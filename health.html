<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#F2F5F3">
<meta name="description" content="한국교원연수원 건강과 안전 60강 학습">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C6B'/%3E%3Cpath d='M7 20h3l2-7 3 12 3-9 2 4h5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>건강과 안전 · 60강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --sans:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  --serif:"Gowun Batang",serif;
  --mono:"IBM Plex Mono",var(--sans);
  --r:16px;
  --fs:1;
  --pg:18px;
}
[data-t="light"]{
  --bg:#F2F5F3; --surf:#FFFFFF; --surf2:#E9EFEB;
  --ink:#0F1F1C; --ink2:#4C625C; --ink3:#8CA39C;
  --line:#DCE5E0; --line2:#C6D3CC;
  --acc:#0E7C6B; --acc-s:#D9EDE7;
  --sig:#C1442E; --sig-s:#FBE5E0;
  --amb:#A9741A; --amb-s:#FAEFD8;
  --sh:0 1px 2px rgba(15,31,28,.04),0 4px 14px rgba(15,31,28,.05);
  --mark:#B9E4D8;
  --btn-on:#FFFFFF;
}
[data-t="dark"]{
  --bg:#0E1513; --surf:#18211F; --surf2:#212B29;
  --ink:#E8EFEC; --ink2:#9DB3AC; --ink3:#6C837C;
  --line:#293431; --line2:#3A4844;
  --acc:#4FC0AA; --acc-s:#173029;
  --sig:#F08A72; --sig-s:#33201C;
  --amb:#DCAA55; --amb-s:#2E2617;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --mark:#1F4A40;
  --btn-on:#07100E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:calc(16px*var(--fs));line-height:1.65;
  font-weight:400;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
  transition:background .25s,color .25s;
}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pg)}

/* ===== 헤더 ===== */
header{
  position:sticky;top:0;z-index:50;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hd{display:flex;align-items:center;gap:6px;height:54px}
.hd h1{
  font-size:calc(17px*var(--fs));font-weight:600;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em;
}
.ic{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
}
.ic:active{background:var(--surf2)}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.lft{margin-left:-9px}
.ic[hidden]{display:none}
.hd .cnt{font-family:var(--mono);font-size:calc(12px*var(--fs));color:var(--ink3);padding-right:4px;flex:0 0 auto}

/* ===== 시그니처: 60강 진도 스트립 ===== */
.gg{padding:24px 0 6px}
.gg-t{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:12px}
.gg-n{font-family:var(--mono);font-size:calc(34px*var(--fs));font-weight:600;letter-spacing:-.04em;line-height:.9}
.gg-n i{font-style:normal;font-size:calc(14px*var(--fs));font-weight:400;color:var(--ink3);letter-spacing:0;margin-left:4px}
.gg-m{text-align:right;font-size:calc(12.5px*var(--fs));color:var(--ink3);line-height:1.45}
.gg-m b{display:block;font-family:var(--mono);font-size:calc(15px*var(--fs));color:var(--ink2);font-weight:600}
.strip{display:flex;gap:2px;align-items:flex-end;height:38px;padding:2px 0}
.tk{flex:1 1 0;min-width:0;background:var(--line2);border-radius:2px;height:11px;transition:height .4s cubic-bezier(.2,.8,.3,1),background .3s}
.tk.h{background:var(--amb);height:24px}
.tk.f{background:var(--acc);height:38px}
.ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:calc(10px*var(--fs));color:var(--ink3);margin-top:7px;letter-spacing:.05em}

/* ===== 섹션 라벨 ===== */
.lb{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:calc(11.5px*var(--fs));font-weight:600;letter-spacing:.08em;color:var(--ink3);
  margin:30px 0 11px;
}
.lb .nm{letter-spacing:0;font-weight:500}

/* ===== 카드 ===== */
.cd{
  display:block;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;margin-bottom:9px;
  box-shadow:var(--sh);transition:transform .13s;
}
.cd:active{transform:scale(.987)}
.cd-r{display:flex;align-items:center;gap:13px}
.cd-b{flex:1;min-width:0}
.cd-t{font-weight:600;font-size:calc(15.5px*var(--fs));letter-spacing:-.017em;line-height:1.4}
.cd-s{font-size:calc(12.5px*var(--fs));color:var(--ink3);margin-top:3px;font-family:var(--mono);letter-spacing:0}
.pill{
  font-family:var(--mono);font-size:calc(11px*var(--fs));font-weight:600;letter-spacing:.03em;
  padding:5px 8px;border-radius:8px;background:var(--acc-s);color:var(--acc);flex:0 0 auto;
}
.pill.g{background:var(--surf2);color:var(--ink3)}
.pill.r{background:var(--sig-s);color:var(--sig)}
.cv{color:var(--ink3);flex:0 0 auto;display:flex}
.cv svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:4px;background:var(--surf2);border-radius:3px;margin-top:13px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .55s cubic-bezier(.2,.8,.3,1)}

.cd.hero{background:var(--acc);border-color:var(--acc);color:var(--btn-on)}
.cd.hero .cd-s{color:var(--btn-on);opacity:.72}
.cd.hero .cv{color:var(--btn-on);opacity:.8}
.cd.hero .pill{background:rgba(127,127,127,.25);color:var(--btn-on)}

/* ===== 목록 ===== */
.lst{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--surf2)}
.row-n{font-family:var(--mono);font-size:calc(12px*var(--fs));font-weight:600;color:var(--ink3);width:22px;flex:0 0 auto}
.row-t{flex:1;min-width:0;font-size:calc(14.5px*var(--fs));line-height:1.45;letter-spacing:-.015em}
.row-t em{font-style:normal;background:var(--mark);border-radius:3px;padding:0 2px}
.sc{font-family:var(--mono);font-size:calc(11.5px*var(--fs));font-weight:600;padding:4px 8px;border-radius:7px;flex:0 0 auto}
.s-h{background:var(--acc-s);color:var(--acc)}
.s-m{background:var(--amb-s);color:var(--amb)}
.s-l{background:var(--sig-s);color:var(--sig)}
.s-n{color:var(--ink3);font-family:var(--mono);font-size:calc(11.5px*var(--fs));flex:0 0 auto;padding-right:3px}

/* ===== 버튼 ===== */
.bt{display:block;width:100%;text-align:center;padding:15px;border-radius:13px;font-weight:600;font-size:calc(15.5px*var(--fs));letter-spacing:-.015em;transition:transform .12s}
.bt:active{transform:scale(.985)}
.bt.p{background:var(--acc);color:var(--btn-on)}
.bt.o{background:var(--surf);border:1px solid var(--line2);box-shadow:var(--sh)}
.bt.q{background:var(--surf2);color:var(--ink2);font-weight:500}
.bt.sm{width:auto;padding:10px 15px;font-size:calc(13.5px*var(--fs))}
.bt.rev{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink2)}
.bt.rev svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bt.rev.on{background:var(--amb-s);border-color:var(--amb);color:var(--amb)}
.br{display:flex;gap:9px}
.br .bt{flex:1}
.gap{height:9px}
.pad{height:30px}

/* ===== 퀴즈 ===== */
.qh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 9px}
.qc{font-family:var(--mono);font-size:calc(12.5px*var(--fs));color:var(--ink3);letter-spacing:.03em}
.qr{display:flex;gap:7px;align-items:center}
.tp{font-family:var(--mono);font-size:calc(10.5px*var(--fs));letter-spacing:.07em;font-weight:600;padding:4px 8px;border-radius:7px;background:var(--acc-s);color:var(--acc)}
.st{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.st svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.st.on{color:var(--amb)}
.st.on svg{fill:var(--amb)}
.qp{height:3px;background:var(--surf2);border-radius:3px;overflow:hidden;margin-bottom:24px}
.qp i{display:block;height:100%;background:var(--acc);transition:width .35s ease}
.src{font-family:var(--mono);font-size:calc(11.5px*var(--fs));color:var(--ink3);margin-bottom:9px}
.qt{
  font-family:var(--serif);font-size:calc(20px*var(--fs));font-weight:700;line-height:1.6;
  letter-spacing:-.015em;margin:0 0 22px;word-break:keep-all;
}
.op{
  display:flex;gap:11px;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:9px;
  font-size:calc(15px*var(--fs));line-height:1.52;word-break:keep-all;
  box-shadow:var(--sh);transition:transform .12s,border-color .15s,background .15s;
}
.op:active{transform:scale(.99)}
.op b{font-family:var(--mono);font-weight:600;color:var(--ink3);flex:0 0 auto}
.op.ok{border-color:var(--acc);background:var(--acc-s)}
.op.ok b{color:var(--acc)}
.op.no{border-color:var(--sig);background:var(--sig-s)}
.op.no b{color:var(--sig)}
.op.dm{opacity:.45}
.ox{display:flex;gap:10px}
.ox .op{justify-content:center;font-family:var(--serif);font-size:calc(26px*var(--fs));font-weight:700;padding:24px 0}
.sa{width:100%;padding:15px;border:1px solid var(--line2);border-radius:13px;font-size:calc(16px*var(--fs));background:var(--surf);box-shadow:var(--sh)}
.sa:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.sa:disabled{opacity:.6}
.fb{border-radius:13px;padding:15px 16px;margin-top:16px;font-size:calc(14.5px*var(--fs));line-height:1.62;word-break:keep-all}
.fb.ok{background:var(--acc-s)}
.fb.no{background:var(--sig-s)}
.fb .h{font-weight:700;display:block;margin-bottom:7px;font-size:calc(13.5px*var(--fs))}
.fb.ok .h{color:var(--acc)}
.fb.no .h{color:var(--sig)}
.fb .an{font-weight:600;margin-bottom:7px}
.fb .an span{opacity:.65;font-weight:400}

/* ===== 결과 ===== */
.rs{text-align:center;padding:38px 0 6px}
.rs-n{font-family:var(--mono);font-size:calc(64px*var(--fs));font-weight:600;line-height:1;letter-spacing:-.05em}
.rs-n i{font-style:normal;font-size:calc(22px*var(--fs));color:var(--ink3);letter-spacing:0}
.rs-t{font-size:calc(17px*var(--fs));font-weight:600;margin-top:18px;letter-spacing:-.02em}
.rs-s{color:var(--ink2);font-size:calc(14px*var(--fs));margin-top:6px}

/* ===== 노트 ===== */
.md{font-size:calc(15.5px*var(--fs));line-height:1.8;padding:8px 0 30px;word-break:keep-all}
.md h1{font-family:var(--serif);font-size:calc(23px*var(--fs));line-height:1.4;margin:28px 0 10px;letter-spacing:-.02em}
.md h2{font-family:var(--serif);font-size:calc(20px*var(--fs));margin:36px 0 13px;padding-bottom:10px;border-bottom:2px solid var(--acc);letter-spacing:-.02em;scroll-margin-top:70px}
.md h3{font-size:calc(16.5px*var(--fs));font-weight:700;margin:26px 0 8px;color:var(--acc);letter-spacing:-.02em}
.md h4{font-size:calc(15px*var(--fs));font-weight:600;margin:18px 0 6px}
.md p{margin:9px 0}
.md ul,.md ol{padding-left:20px;margin:9px 0}
.md li{margin:5px 0}
.md li::marker{color:var(--ink3)}
.md strong{font-weight:700;background:linear-gradient(transparent 60%,var(--mark) 60%);padding:0 1px}
.md hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.md blockquote{margin:15px 0;padding:12px 15px;background:var(--surf);border-left:3px solid var(--acc);border-radius:0 11px 11px 0;font-size:calc(14.5px*var(--fs))}
.md blockquote p{margin:0}
.md code{font-family:var(--mono);font-size:.87em;background:var(--surf2);padding:2px 6px;border-radius:5px}
.md .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:15px 0;border:1px solid var(--line);border-radius:12px;background:var(--surf);box-shadow:var(--sh)}
.md table{border-collapse:collapse;width:100%;font-size:calc(13.5px*var(--fs));min-width:min-content}
.md th,.md td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;line-height:1.55;word-break:keep-all}
.md th{background:var(--acc-s);font-weight:600;white-space:nowrap;font-size:calc(12.5px*var(--fs));color:var(--acc)}
.md tr:last-child td{border-bottom:0}
.md td strong{background:none;color:var(--acc);font-weight:600}
.toc{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:4px;margin:14px 0 6px;box-shadow:var(--sh)}
.toc summary{padding:11px 13px;font-weight:600;font-size:calc(14px*var(--fs));cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.toc summary::-webkit-details-marker{display:none}
.toc summary::after{content:"▾";color:var(--ink3);font-size:12px}
.toc[open] summary::after{content:"▴"}
.toc a{display:block;padding:9px 13px;color:var(--ink2);text-decoration:none;font-size:calc(13.5px*var(--fs));border-top:1px solid var(--line);line-height:1.45}
.toc a:active{background:var(--surf2)}

.top{
  position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  width:46px;height:46px;border-radius:50%;background:var(--surf);border:1px solid var(--line2);
  box-shadow:0 4px 16px rgba(0,0,0,.13);display:none;align-items:center;justify-content:center;color:var(--ink2);
}
.top.on{display:flex}
.top svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 설정 ===== */
.st-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line)}
.st-row.tight{padding-top:0}
.st-row:last-child{border-bottom:0}
.st-l{flex:1;min-width:0}
.st-l b{display:block;font-weight:600;font-size:calc(14.5px*var(--fs));letter-spacing:-.015em}
.st-l span{display:block;font-size:calc(12.5px*var(--fs));color:var(--ink3);margin-top:2px;line-height:1.45}
.seg{display:flex;background:var(--surf2);border-radius:10px;padding:3px;width:100%}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink3);white-space:nowrap}
.seg button.on{background:var(--surf);color:var(--acc);box-shadow:var(--sh)}
.sw{width:50px;height:30px;border-radius:16px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--acc)}
.sw.on i{transform:translateX(20px)}
.danger{color:var(--sig)}

/* ===== 검색 ===== */
.sb{display:flex;gap:9px;align-items:center;background:var(--surf);border:1px solid var(--line2);border-radius:13px;padding:0 14px;margin:16px 0 6px;box-shadow:var(--sh)}
.sb svg{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2;flex:0 0 auto}
.sb input{flex:1;padding:14px 0;font-size:calc(15.5px*var(--fs));background:none;min-width:0}
.sb input:focus{outline:none}

.emp{text-align:center;padding:60px 20px;color:var(--ink3)}
.emp svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.5;margin-bottom:14px}
.emp p{margin:0;font-size:calc(14.5px*var(--fs));line-height:1.75}
.note{color:var(--ink3);font-size:calc(12.5px*var(--fs));text-align:center;line-height:1.7;margin:6px 0 0}
.ft{text-align:center;padding:28px 0 40px;font-family:var(--mono);font-size:calc(10.5px*var(--fs));color:var(--ink3);letter-spacing:.05em}
.tst{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:calc(13.5px*var(--fs));
  font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;
}
.tst.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:f .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <button class="ic lft" id="bk" hidden aria-label="뒤로 가기">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="ttl">건강과 안전</h1>
    <span class="cnt" id="cnt"></span>
    <button class="ic" id="sch" aria-label="검색">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="ic" id="stg" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="vw"></main>
<div class="ft">한국교원연수원 · 두고두고 요긴한 건강과 안전</div>

e":"알레르기 비염의 가장 특징적인 증상은 재채기이며, 코 안에만 국한됩니다."},{"t":"mc","q":"코가 막혀 입으로 숨을 쉬면서 상악이 돌출되고 입이 벌어지는 특징적인 얼굴 모양을 무엇이라 하는가?","c":["아데노이드 얼굴","말단비대증 얼굴","무어 얼굴","비후성 얼굴"],"a":0,"e":"아데노이드가 커져 코로 숨을 못 쉬면 상악이 돌출되는 아데노이드 얼굴로 변할 수 있습니다."},{"t":"sa","q":"콧물과 비염 증상을 없애주는 대표적인 알레르기 약의 이름은?","a":["항히스타민제","항히스타민","히스타민제"],"e":"항히스타민제가 대표적이며 국소 스테로이드나 코 분무제도 사용합니다."},{"t":"sa","q":"외출 전 꽃가루 농도 위험 지수를 미리 확인할 수 있는 기관의 홈페이지는?","a":["기상청","기상청 홈페이지"],"e":"기상청 홈페이지에서 꽃가루 농도 위험 지수를, 화분알레르기연구회에서 꽃가루 현황을 확인할 수 있습니다."},{"t":"sa","q":"비염 관리를 위한 식염수 세척 시, 식염수는 어느 정도 온도로 맞춰 사용해야 하는가?","a":["체온","체온 정도","36.5도"],"e":"체온 정도로 덥혀서 사용해야 하며, 찬 수돗물을 그냥 쓰면 증상이 더 심해집니다."},{"t":"ox","q":"알레르기 비염과 코감기의 근본적 차이는, 비염은 코 안에만 국한되지만 코감기는 인후통·기침·발열 등 전신 반응을 동반한다는 점이다.","a":true,"e":"코감기는 치료하지 않으면 폐렴 등 합병증이 생길 수 있습니다."},{"t":"ox","q":"알레르기 비염은 도시보다 농촌에 사는 사람에게 더 많이 발생한다.","a":false,"e":"예상과 달리 도시에 사는 사람에게 더 많다고 보고됩니다."},{"t":"ox","q":"비염약은 내성이 생기면 더 이상 쓸 약이 없으므로 처음부터 약을 쓰지 않는 것이 좋다.","a":false,"e":"알레르기약과 비염약은 종류가 매우 다양하므로 상황에 맞게 바꿔 쓰면 됩니다."}]},{"no":3,"title":"위기의 증거, 비만","questions":[{"t":"mc","q":"성인 비만의 기준이 되는 체질량지수(BMI) 값은?","c":["23 이상","25 이상","27 이상","30 이상"],"a":1,"e":"성인은 BMI 25 이상을 비만으로 판단합니다."},{"t":"mc","q":"부모 두 사람이 모두 비만인 경우 자녀에게 비만이 발생하는 비율은?","c":["40~60%","70%","80%","90%"],"a":2,"e":"부모 한 명이 비만이면 자녀의 40~60%, 부모 모두 비만이면 80%에서 비만이 발생합니다."},{"t":"mc","q":"지방 세포의 수가 늘어나 주로 소아에게 나타나며 살이 잘 빠지지 않는 비만 유형은?","c":["증식성 비만","비후성 비만","중심형 비만","이차성 비만"],"a":0,"e":"증식성 비만은 세포 수가 늘어나는 것으로 주로 소아에게, 비후성 비만은 세포 크기가 커지는 것으로 주로 성인에게 나타납니다."},{"t":"mc","q":"폐경 후 여성에게 주로 나타나는 부위별 비만 유형은?","c":["상체형 비만","하체형 비만","중심형 비만","증식성 비만"],"a":0,"e":"상체형은 폐경 후 여성, 하체형은 여성, 중심형은 남성에게 많이 나타납니다."},{"t":"sa","q":"소아비만을 의심할 수 있는 허리둘레와 키의 비율 기준값은?","a":["0.5","0.5 이상","2분의 1"],"e":"허리둘레를 키로 나눈 값이 0.5 이상이면 비만을 의심하고 병원 진료를 권합니다."},{"t":"sa","q":"지방이 증가하면서 축적되어 성호르몬에 영향을 주고 성조숙증을 유발할 수 있는 호르몬 물질은?","a":["렙틴"],"e":"지방 증가로 렙틴이 축적되면 성호르몬에 영향을 주어 성조숙증이 나타날 수 있습니다."},{"t":"sa","q":"비만을 질병으로 정의한 국제기구의 약칭은?","a":["WHO","세계보건기구"],"e":"WHO는 오 <script id="N1" type="text/markdown"># 『두고두고 요긴한 건강과 안전』 핵심 정리
## PART 1 · 학생 건강 지도 (01~14강)

> 시험 대비용 핵심 요약본입니다. **굵은 글씨**는 숫자·기준·분류 등 출제 가능성이 높은 부분입니다.

---

## 01강. 발견이 중요, 척추측만증

### 1) 척추측만증이란
- **척추옆굽음증**. 머리~다리까지 일자여야 할 척추가 **옆으로 휘어진 상태**
- 일반적으로 **측만 각도 10도 이상**이면 진단
- **청소년기(2차 성장기)에 가장 많이 발생**, 인구의 **1~3%**
- 원인: 골 형성이 미완성인 시기 + 좁은 의자, 잘못된 자세, 운동 부족

### 2) 발생 원인 (5가지)
① 유전적 요인 ② 호르몬 요인 ③ 성장에 따른 요인 ④ 생체역학적 요인 ⑤ 조직학적 요인
- 가족력이 있으면 유병률이 훨씬 높음
- **멜라토닌 결핍**도 원인이 될 수 있음
- 척추 앞쪽·뒤쪽의 성장 차이 → **버클링(buckling) 현상** → 옆으로 뒤틀림

### 3) 치료 (3가지)
| 치료법 | 적용 기준 |
|---|---|
| 보존적 치료 | 경증 |
| **보조기 치료** | **측만 각도 25도 이상** |
| 수술적 치료 | **45도 초과**(보조기 효과 떨어짐) |

- 선택 기준: **① 얼마나 휘었는가 ② 골 성장이 멈췄는가**
- 성장기 청소년은 **4~6개월 간격 정기 X-ray** 촬영
- 보조기는 **성장기에 효과가 더 좋고, 지속적으로 유지**해야 함(좋아졌다고 중단하면 악화)

### 4) 유전
- 특발성 척추측만증 어머니 → 딸 유전 확률 **27%**
- **상염색체 우성 유전** 연구 보고

### 5) 일상에서의 자가 확인 (골반 비틀림으로 무게 분산 불균형)
- 신발 한쪽 굽이 유난히 잘 닳을 때
- 신발 한쪽 **바깥쪽**이 많이 닳을 때
- 속옷 끈·가방끈이 한쪽으로 치우칠 때
- 수영장·목욕탕에서 주변 사람이 척추가 휘었다고 말할 때

### 6) 구분 ★
- **구조적 측만증**: 구조 자체에 이상 O
- **비구조적 측만증**: 구조 이상 X, **원인만 교정하면 회복**
  → 자세, 디스크, 요통, **다리 길이 차이**로 인한 것
- 원인을 특정하기 어려워 **특발성 측만증**으로 진단되는 경우가 많음

### 7) 궁금증 정리
- **자세**: 특정 자세와의 직접적 연관성은 아직 입증 안 됨. 그러나 나쁜 자세 누적은 척추에 무리
- **키**: 척추측만증과 키의 관계는 밝혀지지 않음. 다만 굽어서 키가 약간 작아질 수는 있음. (연구: 구부러진 만큼 환산하면 측만증 그룹이 오히려 키가 더 컸음)
- **짝다리**: 습관성이면 비구조적(교정 가능), 구조적 문제 때문에 짝다리를 하는 경우도 있어 **원인과 결과가 상호적**
- **가방 한쪽 메기**: 논란 있음. **직접적 원인은 아니라는 것이 일반적 견해**

## 02강. 비염 관리하기

### 1) 알레르기 비염
- 항원-항체 반응 5가지 중 **제1형(급성)**이 알레르기 비염
- 꽃가루 등 외부 항원 자극 → 콧물, 코막힘
- 계절성: 일본은 봄 **삼나무 꽃가루**, 우리나라는 사무실 먼지 등으로 **거의 1년 내내** 발생

### 2) 비염 vs 축농증 ★
| 구분 | 비염 | 축농증(부비동염) |
|---|---|---|
| 부위 | **코 안에만** 염증 | **상악동·전두동·사골동·접형동**에 2차 염증 |
| 양상 | 점막 염증 | 점막 부종, 물혹, 고름 |
| 합병증 | – | 눈·머리 쪽 합병증 |
- **비염을 방치하면 축농증으로 진행**될 수 있음

### 3) 대표 증상
- 코막힘 / 콧물 흘러내림 / **재채기**(가장 특징적), 눈 주변 가려움

### 4) 알레르기 비염 vs 코감기 ★
- 알레르기 비염: **코에만 국한**, 재채기 심함
- 코감기: 인후통, 칼칼함, 기침, 발열 등 **전신 반응 동반**, 방치 시 폐렴 등 합병증

### 5) 치료
① **원인(항원) 제거**가 첫 번째
② 약물치료: **항히스타민제**, 국소 **스테로이드**, 코 분무제
③ **면역요법**(1년 내내 증상이면 항원에 지속 자극을 주어 적응)
④ 생활: **식염수 세척**, 극단적인 경우 수술
- 비염은 **고혈압·당뇨처럼 관리하며 함께 가는 병**

### 6) 식염수 세척 요령 ★
- 몸의 농도와 **비슷하거나 약간 높은 농도**의 식염수 사용
- **체온 정도로 덥혀서** 사용
- 찬 수돗물을 그냥 쓰면 **증상이 더 심해짐**

### 7) 유전·역학
- 부모 중 **한 명** 알레르기 → 자식의 일정 비율에서 발현 / **양쪽 모두** → 확률 크게 상승
- 인종 차이: 말레이계보다 **중국계**가 알레르기 비염 더 많음
- **도시 거주자가 농촌보다 더 많음**(예상과 반대)

### 8) 합병증 연쇄 ★
- 비염 → 중이염 → 난청 → (못 들으면) **치매 위험 증가**
- 코막힘 → 수면장애 → 산소 공급 저하 → 뇌에 악영향
- **아데노이드 얼굴**: 코가 막혀 입으로 숨 → 상악 돌출, 입이 벌어진 얼굴 모양으로 변형

### 9) 예방
- 집안 청결(청소기·걸레질), 커튼·소파·담요 줄이기, **침구 특수커버**
- **기상청 홈페이지 꽃가루 농도 위험지수**, 화분알레르기연구회 꽃가루 현황 확인
- 내성 걱정 불필요 — 약 종류가 다양하므로 상황에 맞게 교체

## 03강. 위기의 증거, 비만

### 1) 기준
- 성인: **체질량지수(BMI) 25 이상**
- 소아: 성별·연령별·신장별 표준체중 성장도표 비교(직관적 판단 어려움)
  → **허리둘레/키 비율 0.5 이상**이면 비만 의심

### 2) 소아비만의 종류
- **단순성 비만**: 원인 불명확, 섭취 열량 > 소비 열량 → **소아비만의 99% 이상**
- **증후성 비만**: 특별한 원인 질환이 있어 발생

### 3) 가족력 ★
- 부모 **한 명**이 비만 → 자녀의 **40~60%**
- 부모 **모두** 비만 → 자녀의 **80%**

### 4) 합병증
- 비만 아동의 **약 80%**가 나이와 무관하게 성인병 보유
  → **고지혈증, 지방간, 고혈압, 당뇨병**
- 심한 비만: 심장 기능 이상, 호흡 장애
- 지방 증가 → **렙틴** 축적 → 성호르몬 영향 → **성조숙증**
- 가슴근육 팽창·수축 감소 → **모세기관지염, 천식** 증가
- 사춘기 아이들의 **정신적 문제** 초래

### 5) 마른비만 ★
- 체중은 같아도 **체지방률이 높고 근육량이 적은** 상태
- 잦은 다이어트 반복 → 근육량 ↓, 지방 ↑
- 문제점: **인슐린 저항성 상승** → 당뇨 발병·악화 / 혈압 조절 실패 → 뇌혈관·심장질환 / **기초대사량 감소**로 감량이 더 어려워짐
- 근육이 많으면: 인슐린 저항성 감소, 엉덩이·허벅지 근육 많으면 혈압 조절 양호
- → **체중만 보지 말고 체지방량을 반드시 확인**

### 6) 비만의 분류 ★
**① 세포 기준**
- **증식성 비만**: 지방 **세포 수**가 늘어남 → 주로 **소아**(아기 때 과식 시), 살이 잘 안 빠짐
- **비후성 비만**: 지방 **세포 크기**가 커짐 → 주로 **성인**

**② 부위 기준**
- **상체형 비만**: 주로 **폐경 후 여성**
- **하체형 비만**: 주로 **여성**(출산 대비 지방 축적)
- **중심형 비만**: 이른바 '사장님 배', **남성**에 많음

**③ 원인 기준**
- **일차성 비만**: 원인 불명
- **이차성 비만**: 당뇨, **갑상선 기능저하증** 등 내분비계 질환으로 인한 비만

### 7) 다이어트
- **WHO는 비만을 질병으로 정의**. 고혈압·당뇨·고지혈증의 **전구질환**
- '나잇살'은 의학적 정의 없음. 다만 나이 들수록 기초대사량 감소 → 체중관리 필요
- 원푸드·황제·연예인 다이어트 = 대부분 **절식** → 장기 유지 어려움, 영양 불균형 → 면역력 저하·기존 질환 악화
- 정답: **식습관 + 운동 + 생활습관의 조화**

## 04강. 독한 여름 대비하는 여름철 건강관리

### 1) 체온 관리의 중요성
- 체온 조절은 **자율신경계(교감·부교감신경계)**가 담당 → 장기·호르몬 작용 관리
- 여름철 체온 들쭉날쭉 → 자율신경계 교란 → **면역력 저하**
- **체온 1도 하강 = 면역력 약 10% 감소 / 1도 상승 = 약 10% 증가**

### 2) 일사병 vs 열사병 ★★
| 구분 | 일사병 | 열사병 |
|---|---|---|
| 관계 | **열사병의 전 단계** | 중증 |
| 체온 | **37~40도** | **40도 이상** |
| 체온조절중추 | 유지 | **파괴됨** |
| 땀 | **흘림** | **나지 않음** |
| 의식 | 있음 | **의식 소실·혼란 등 신경계 이상** |
| 기타 | 구역질, 발열, 몸살, 무기력 | 뇌 기능 손상 |

### 3) 예방
- 하루 **물 2리터 이상**, 야외활동·운동 시 **3~4리터(1.5배)**
- 햇빛 차단(모자, 겉옷), 적절한 수면
- 규칙적 운동(운동 안 하는 사람이 더 취약) — 실내에만 있지 말 것
- **노년층은 폭염에 특히 취약** → 한낮 야외활동 자제, 수시 수분 섭취

### 4) 여름철 식중독
- 일사병·열사병과 달리 **예측이 불가능**한 것이 특징
- 증상: 소화기 증상 + **피부 증상, 전신 근육통**
- 아이는 설사·구토 → **탈수** → 혈액순환·신장에 부담
- **채소도 식중독 원인**: 안전하다는 착각으로 세척 소홀 → 반드시 **흐르는 물**에 세척
  → **채소 씻기 전·후 손 씻기** 필수(교차오염 차단)
- **공기를 통해서도 식중독균 전파** → 환기 중요
  (과거: 음식만 → 현재: 음식·조리기구·손·공기)
- **냉면·콩국수 육수** = 병원성 대장균이 좋아하는 식재료 → 차갑다고 안전하지 않음
- **냉장고도 안전지대 아님**: 냉동실에서도 죽지 않는 균, 끓여도 죽지 않는 바이러스 존재.
  냉장고는 **잠시 신선 보관용**이며, 한 음식의 균이 다른 음식에 옮을 수 있음

### 5) 냉방병 ★
- 지구온난화·에어컨 사용 증가로 급증
- 증상: **감기 유사 증상, 두통, 소화불량(장염처럼), 어지러움, 근육통**
- **감기 vs 냉방병**
  - 감기: 호흡기 증상(기침·가래·콧물) 중심, 면역 시스템이 걸러줘 **며칠~1~2주면 호전**
  - 냉방병: **체온 조절 능력 자체의 저하**(자율신경계 교란) → 순환장애·소화기장애, 무력감
    → **원인이 해결되지 않으면 여름 내내 지속**되는 만성적 질환
- **예방**
  - 에어컨 온도 **26도 정도** 유지
  - 에어컨·선풍기 바람 **직접 쐬지 않도록 위치 조정**, 어려우면 **긴소매** 착용
  - **50분 냉방 시 10분 환기**
  - 가끔 밖으로 나가 외부 온도 접하기
  - 적절한 수분 섭취(혈액순환)
  - **하루 30분~1시간, 주 3회** 운동
  - 열대야로 잠을 못 잤다면 **1시간 정도 더 수면**

## 05강. 여름철 눈 건강 지키기

### 1) 여름과 눈병
- 눈병은 사시사철 발생하나, 여름의 **고온다습**한 환경이 세균 번식에 유리 → 여름에 많음(위생 문제와 관련)

### 2) 눈병의 종류 ★
- **결막염**: 균·곰팡이 등 외부 감염으로 **흰자(결막)**에 염증
- **아폴로 눈병**: **콕사키 바이러스 / 엔테로 바이러스** 감염
  → **1969년(아폴로 11호 달 착륙 해)** 크게 유행하여 붙은 이름
- **유행성 각결막염**: **아데노 바이러스** 감염, **가장 흔한 눈병**

### 3) 잠복기 ★
| 눈병 | 잠복기 |
|---|---|
| 유행성 각결막염 | **5~7일, 늦으면 2주** |
| 아폴로 눈병 | **2~3일** |
- 잠복기에는 무증상
- 대부분 바이러스 질환 → 직접 치료제가 많지 않음 → **합병증 치료를 철저히**
- ⚠ 쉬려고 일부러 눈병을 옮기는 행위 → **각막 염증으로 시력 크게 저하**, 절대 금지

### 4) 다래끼
- 속눈썹 밑 **기름샘(피지선)**에서 깨끗한 기름이 나와야 윤활 역할
- 지성 피부 등은 기름 이상 → 눈꺼풀에 기름 축적 → 염증 → 가려움 → 비빔 → 악화 → **기름샘 막힘 = 다래끼**
- **눈꺼풀 청소법**: 면봉에 세정제나 **베이비 샴푸 1~2방울** → 거품 → 거울 보며 속눈썹을 살짝 들어 밑을 닦기 → **아침·저녁 하루 2회**

### 5) 여름철 눈 건강 상식 ★
- 눈병은 **눈을 쳐다봐도 전염되지 않음**. **손과 눈의 접촉**으로 전염
- 쌍꺼풀 수술 후 부기, 알레르기로 인한 부기 → **냉찜질**
- **다래끼(염증성 고름)** → **온찜질**로 자연 배농 유도
- 선글라스의 **자외선 차단 코팅은 시간이 지나면 벗겨짐** → **1~2년에 한 번 렌즈 교체**
- **아동용 선글라스**는 아크릴 재질이 많아 잘못 사용하면 **시력 손상** 위험

## 06강. 콜레스테롤의 여러 가지 얼굴

### 1) 콜레스테롤이란
- 지질의 하나로 **반드시 필요한 지방**
  - 모든 **세포막의 가장 중요한 성분**
  - **여성호르몬·남성호르몬**의 구성 성분
  - **비타민 D 생성 재료**
- 그러나 과다하면 질환의 원인

### 2) 4가지 분류
**총콜레스테롤 / LDL(나쁜) / HDL(좋은) / 중성지방**
- 현재 의학계에서 **이상지질혈증 ≒ 고콜레스테롤혈증 ≒ 고지혈증** 거의 같은 의미로 사용

| 종류 | 특징 |
|---|---|
| **LDL** (Low Density Lipoprotein) | **간 → 장기·혈액**으로 가는 콜레스테롤. 높으면 조직·장기에 축적. **나쁜 콜레스테롤** |
| **HDL** (High Density Lipoprotein) | **조직·장기 → 간(폐기장)**으로 되가져옴. **좋은 콜레스테롤, 혈관청소부**. 높을수록 심혈관질환 예방에 좋음 |
| **중성지방** | 에너지로 쓰고 남은 것이 혈관·지방세포에 저장. 필요 시 분해되어 에너지원. 과다 시 **동맥경화** 유발 |
| **총콜레스테롤** | 좋은+나쁜+중성지방의 합 |

### 3) 수치 기준 ★★
| 항목 | 정상/양호 | 주의·위험 |
|---|---|---|
| 총콜레스테롤 | **200 이하** | **240 초과 = 고위험** |
| LDL(나쁜) | **100 이하** | **130~160 초과 시 위험** |
| 중성지방 | **150 이하** | **200 초과 시 주의** |
| HDL(좋은) | **최소 40 이상** | **60 이상이면 매우 좋음** |

- ⚠ 총콜레스테롤이 높아도 **HDL이 높아서** 높은 사람은 문제없음
- 반대로 총콜레스테롤이 정상이어도 **HDL 매우 낮고 LDL 높으면** 뇌심혈관계 질환 위험 高

### 4) 이상지질혈증 ★
- 고LDL콜레스테롤혈증 / 저HDL콜레스테롤혈증 / 고중성지방혈증
- 이 세 가지를 통칭 → **이상지질혈증**
- **우리나라 30세 이상 두 명 중 한 명**이 이 중 하나에 해당

### 5) 상식
- **커피**: 커피전문점의 **에스프레소 추출 커피 하루 6잔 이상** → 콜레스테롤 상승
  **드립커피·더치커피**는 종이필터가 **카페스톨** 성분을 걸러줌 → 상대적으로 안전
  **믹스커피**는 콜레스테롤 상승 성분 포함 → **블랙커피** 권장
- 나쁜 콜레스테롤은 **유전 가능**
- **오메가3**: 중성지방 치료제로 사용, 혈관 확장 → 혈압 강하, **부정맥 예방** 효과
  → 미국 심장병학회는 심혈관계질환자에게 오메가3 섭취 권고
  → 음식: **등푸른 생선(멸치·고등어·연어), 들깨, 들기름**
  → 중금속 우려 생선(옥돔·특이한 상어류)은 임신부 금지, 일반 생선은 **주 2회**는 무방

## 07강. 온몸이 아프다, 편도선염

### 1) 편도
- **임파선 조직**의 하나. 구강으로 들어온 균을 **방어**
- 종류: **목편도**(눈에 보이는 것), **설편도, 인두편도(아데노이드)** 등

### 2) 편도염의 양상
- **급성 편도선염**: 약물치료 시 약 **10일**이면 완치
- **만성 편도선염**: 계속 재발하거나 목에 이물감이 지속될 때 진단
- **편도 주위 농양**: 고름이 차서 목이 아프고 **입이 안 벌어짐**
- **편도결석**: 편도 안에서 하얀 것이 떨어져 나옴, **구취**의 원인 (실제 결석은 아니나 돌처럼 생김)
- 편도염은 후두염과 동반되는 경우는 많지 않음. **목소리 변화**는 후두 자체 염증(후두염)이며, 후두염은 **인두염**과 동반되는 경우가 많음

### 3) 편도선염 vs 목감기(인두염) ★★
| 구분 | 편도선염 | 목감기(인두염) |
|---|---|---|
| 열 | **고열** | 미열 |
| 통증 | **침 삼키기 힘들 정도로 극심** | 보통 수준 |
| 기침 | **별로 없음** | 동반 |
| 성격 | **세균성 감기의 최고** | – |
- 참고: **바이러스성 감기의 최고 = 독감**

### 4) 방치 시 합병증 ★
- **편도 주위 농양**
- **심장으로 퍼지면 → 류마티스열**
- **콩팥(신장)으로 퍼지면 → 사구체신염**
- ⚠ 보통 감기에는 항생제를 쓰지 않지만, **편도선염만큼은 반드시 항생제로 정확히 치료**

### 5) 진단
- 고열 + 심한 몸살 + 임파선 부종 + **기침 없음** → 편도선염 의심
- **신속항원검사**: 면봉으로 편도선 주위를 긁어 균 검출 → 세균성 여부 구분
- 감기가 오래 가서 **2차 세균 감염**이 생기면 편도선염으로 진행 가능

### 6) 편도선 수술 적응증 ★
- **1년에 4회 이상** 편도선염을 앓아 약을 많이 먹어야 할 때
- 편도선염 때문에 **코골이**로 잠을 제대로 못 잘 때
- **축농증이 매우 심하거나 자주 재발**할 때, **중이염이 자주 재발**할 때
- 직업적으로 절대 감기를 앓으면 안 되는 경우(의사와 상의)
- **입 호흡으로 얼굴 모양이 바뀔 우려**가 있을 때 → 수술 적극 고려
- 최근에는 **아데노이드를 작게 만드는 약물**을 3개월씩 장기 투여하는 방법도 있으므로 **수술 전 약물치료 먼저** 시도
- **만 8세 전까지** 편도 사이즈가 커지므로 이 시기에 코골이 문제가 많이 발생

### 7) 예방 및 음식
- 감기 예방이 핵심 → **물 많이 마시기, 가습기 적절히 활용**
- 나쁜 음식: **단순 탄수화물**, 체내에서 탄수화물로 바뀌는 **고지방**
- 좋은 것: **비타민 C, 아연**

## 08강. 방심하면 생기는 충치

### 1) 원인
- 대표 원인균: **뮤탄스균**
  - 산 생성 능력 / 산성 환경에서 견딤 / **치아 표면에서도 증식** / **당을 세균 내에 저장**하는 능력
- 기전: **탄수화물(당) → 세균이 분해 → 산 생성 → 구강 산도 상승 → 법랑질 파괴 → 충치**
- **탄산음료**: 중성 pH 7 / 탄산음료는 **pH 2~4의 강한 산성** → 치아 표면 무기질 분해 → 치아 삭음

### 2) 치통의 원인 감별 ★
| 구분 | 원인 부위 | 통증 양상 |
|---|---|---|
| **충치** | 치아 안의 **치수(신경)** | **날카롭고 시큰하고 찌릿한** 통증 |
| **잇몸 질환** | **치주 인대** | **묵직하고 욱신거리는** 통증 |
- 100% 일치하지는 않으므로 증상이 있으면 치과에서 원인 파악

### 3) 신경치료
- **치수** = 치아 안쪽의 신경·혈관이 풍부한 연조직
- 신경치료 = 치아를 뽑지 않고 통증·염증을 제거해 **치아 기능을 살리는 것**
  (신경·혈관·조직 제거 후 그 공간을 다른 재료로 밀봉)
- 신경치료를 받은 치아는 **정상 치아보다 약해짐** (심한 충치, 치아 손상, 치아 삭제로 **탄력 저하·수분 감소**)

### 4) 충치 치료 재료 비교 ★★
- 범위가 작으면 **때우고**, 크면 **씌운다**

| 재료 | 심미성 | 강도 | 삭제량 | 특징 |
|---|---|---|---|---|
| **레진** | 매우 우수 | 보통(플라스틱) | 적음 | 앞니·작은 어금니. **변색** 가능, 깊으면 깨짐·시린 증상 |
| **아말감** | 많이 떨어짐 | 넓으면 깨지기 쉬움 | 레진보다 많음 | **수은+금속 합금**. **보험급여 → 비용 매우 저렴**, 부작용 거의 없음 |
| **금** | 다소 떨어짐 | **화학적·물리적으로 가장 안정, 치아와 비슷** | 레진보다 많음 | 비용 비쌈 |
| **세라믹** | **가장 뛰어남** | **가장 약함** | 많음 | 주로 **앞니** |
| **지르코니아** | 세라믹과 유사 | **금과 비슷** | 많음 | **앞니·어금니 모두 사용 가능** |

### 5) 궁금증
- **유치 충치**: 곧 빠질 치아는 굳이 치료할 필요 없으나, **빠질 시기가 남은 치아는 반드시 치료**
- 나이 들수록 **불소 노출 누적**으로 치아가 단단해져 충치 저항성이 높은 편
- **물 자주 마시기** → 구강건조 방지, 입냄새 제거, 세균·음식물 잔사 제거 → 충치 예방
- ⚠ **충치균은 전염성이 있음** → 어른이 아이에게 뽀뽀, **먹던 수저로 음식 먹여주기** 금지
  → 어린 아이의 **구강 접촉 시기를 최대한 늦추는 것**이 가장 좋음

## 09강. 우리 아이 괴롭히는 아토피 피부염과 건선

### 1) 아토피
- 어원: **'이상한, 기이한'**
- 원인은 아직 정확히 밝혀지지 않음
- 경향: 과거(감염병 多) → **선진국이 될수록 알레르기 질환 증가**
- **미세먼지·대기오염**과 관계있을 것으로 추정. 자연친화적 환경에서 호전되는 사람도 있으나 **보편적이라 보긴 어려움**

### 2) 아토피의 악영향
- 치료가 어려워 **민간요법·허황된 정보** 난립
- 가려움은 아픔보다 더 괴로움 (예: 못 긁게 손에 붕대를 묶고 재우는 잘못된 사례)
- 정신적 문제: 야간 가려움 → 각성 → **불면증, 예민함**, 부모까지 수면 방해
- 아이는 **자기결정권이 없어** 부모가 시켜주는 치료만 가능 → 부모교육이 매우 중요

### 3) 진단 기준 ★
**주증상 3가지 중 2가지 이상 부합 시 아토피로 판단**
① 가려움증
② **만성적·재발성** 가려움증
③ **가족력** 또는 **알레르기성 비염·천식 동반**

**부증상**: 유두 습진 / 손발 허물 벗겨짐 / 귀 밑이 찢어짐 / 눈 밑 다크서클 / 눈 밑 주름 등

### 4) 원인 ★
① **유전력 70~80%**
 - 부모 중 한 명 아토피 → 자녀의 **약 50%**
 - 부모 모두 없어도 → **약 20%**에서 발생 가능
② **돌 이전에는 음식 항원**의 영향 (계란, 땅콩, 우유 등)
 → 이유식 시작을 다소 늦추는 추세. 단 **무조건 안 먹이면 성장에 문제** → 골고루 먹이되 심해지는 음식만 제한
③ **흡입 항원**: 소파·이불의 **집먼지 진드기** → 침구 소독 / 대기오염·미세먼지
④ **면역반응의 불균형**
⑤ **피부장벽 손상** → 보호막 파괴 → 세균·바이러스 감염 쉬워짐

### 5) 치료 — 스테로이드 연고
- '피부과 약이 독하다'는 말의 근원. 그러나 **오남용만 하지 않으면 좋은 약**
- 스테로이드는 **등급이 다양** → 아이에게는 약한 것을 사용하므로 과도한 걱정 불필요
- 문제: 호전 후 중단하면 **바로 재발** → 이때 **면역조절 연고**(의사 처방)로 바꿔 **유지요법**
- 대안: **먹는 항히스타민제** (가려울 때만 복용 가능해 활용도 높음)
- 핵심: 병원에서 그만 오라고 할 때까지 치료 받기 + **부모교육**

### 6) 건선
- **건선 ≠ 건조증**
  - 건조증: 대기·피부가 건조해져 생기는 단순 가려움
  - 건선: **원인불명의 질환**

**증상 ★**
- **팔꿈치, 무릎, 엉덩이**에 **은백색 인설(각질)**이 두껍게 판 모양으로 발생
- 인설을 뜯으면 **점상 출혈** → **아우스피츠 증후(Auspitz sign)**
- **쾨브너 현상**: 부딪히거나 긁힌 자리에 건선 발생
- **두피**에도 잘 생김 → 지나치게 심한 비듬이면 의심
- 환자의 **약 10%**는 **손톱**에도 발생 → 바늘로 콕콕 찍은 듯한 **함몰**
- 약 **5%**에서 **관절염** 발생

**치료**
- 정상 피부 재생 주기와 달리 건선은 **재생이 일주일밖에 안 걸릴 정도로 빠름** → 각질이 제대로 탈락하지 못하고 두꺼워짐
- 기본: **표피 증식을 억제하는 비타민 D 제제**
  ⚠ '단순 습진'으로 오인해 스테로이드 연고만 바르면 **재발률이 더 높음**
- 먹는 약, **생물학적 제제**(부작용 줄이며 표피 증식 억제)
- **광선치료**: 아토피와 건선 모두 사용 가능. 햇빛 중 유효한 파장을 추출한 기계
  → 스테로이드 양 감소, 부작용 감소, **병합요법** 가능

## 10강. 일상의 곤란, 근시

### 1) 정상 시력
- 흔히 1.2~1.5를 좋은 눈으로 여기지만 **정상 시력은 1.0**
  (IQ 100이 중간이자 정상인 것과 같은 개념)

### 2) 시력의 작동
- 시력 = 빛이 들어와 그 신호가 **뇌에서 해석되는 눈과 뇌의 복합 작용**
- 따라서 **환경적 요인도 중요** (예: 몽골인은 멀리 보는 훈련이 되어 2.0~3.0 시력)
- **야외 활동으로 햇빛을 많이 받으면 도파민 분비 → 근시 진행 억제** 주장 있음

### 3) 마이너스 시력
- 정상 = 0, **원시 = +, 근시 = −**
- 마이너스는 '나쁜 시력'이 아니라 **근시가 있다는 표현**

### 4) 굴절이상의 종류 ★
| 구분 | 초점 위치 | 교정 렌즈 |
|---|---|---|
| **근시** | 망막 **앞**에 맺힘 | **오목렌즈** |
| **원시** | 망막 **뒤**에 맺힘 | **볼록렌즈** |
| **난시** | **초점이 2개 이상** → 겹쳐 보임, 선 밑에 선이 하나 더 | 난시용 렌즈로 초점을 하나로 |
- 근시·난시·원시는 **함께 나타날 수 있음**

### 5) 시력 이상의 요인
- **환경적 요인 + 유전적 요인**
- 우리나라는 특히 근시가 많고 **초·중학생 근시 비율이 높아지는 추세**
- 환경 요인 사례: **에스키모인을 미국으로 이주시켰더니 근시가 크게 증가**
  → 원인으로 **TV 시청 문화와 단(설탕) 음식 섭취** 추정
- 아직 **근시 유전자는 발견되지 않음** → 여러 요소가 복합 작용

### 6) 근시의 종류
- **고도근시**: 약 −6 디옵터 이상
- **초고도근시**: 약 −10 디옵터 초과(안경알이 매우 두꺼움)
- **악성 근시(진행성 근시)**: 계속 진행되는 근시
  → **조절마비굴절검사**(눈에 약을 넣고 하는 검사)로 판정. 취학 전 안과 검진 시 반드시 시행

### 7) 고도근시의 위험 ★
- 눈 뒤의 **망막** = 카메라의 필름
- 근시가 심하면 **풍선이 커지며 얇아지듯 망막이 늘어나 약해짐** → **근시성 망막변성**
- → 망막에 **구멍** 발생 → **출혈** → 떨어지면 **망막박리**
- ⚠ 고도근시는 **단순 시력검사 외에 정기적인 망막검사** 필수

### 8) 관리(바꿀 수 있는 것 = 환경적 요인)
- **50분 작업 후 5분 정도 먼 산 바라보기**
- **검은콩, 홍당무(당근), 블루베리, 포도** 등 색깔 있는 채소·과일 섭취

## 11강. 생활 속 위염의 괴로움

### 1) 한국인의 위장
- **우리나라 위암 발병률 세계 1위**, **10만 명당 약 60명**
- 스트레스, 과로, 음주 등으로 **젊은 층 위장질환** 증가
- **야식**: 포만감·수면 유도는 있으나 → 위장운동 저하, 위산 분비 증가, **역류성 식도질환** 우려

### 2) 위의 기능
① 음식을 잘게 부숨
② **위산 분비** → 음식에 들어온 세균 등을 일차적으로 죽이고 소화를 도움

### 3) 위염이란
- **위장 점막 표피층이 살짝 벗겨져 염증이 생긴 것**
- 증상: 식후 불편감, 속쓰림, 더부룩함 등 다양

### 4) 위 내시경
- 위암 발생률 1위이므로 건강보험에서 **40세 이상 남녀 모두, 증상과 관계없이** 위 내시경 또는 위장조영술 권유

### 5) 위염의 종류 ★★
| 종류 | 내용 |
|---|---|
| **급성 위염** | 심한 스트레스·음주·과로 등으로 위 점막 표피가 벗겨짐. 보통 **수 일 지속** |
| **만성 위염** | 급성 위염과 같은 증상이 **일정 기간 이상 지속**될 때 |
| **위축성 위염** | 오랜 자극으로 위장 점막이 **얇아지고 노화**된 상태. **만성 염증으로 얇아진 상태** |
| **화생성 위염(장상피화생)** | 위장 세포가 오랜 자극으로 **장 세포로 바뀐 것** |
- ⚠ **위축성 위염과 화생성 위염은 위암 발생률을 높임**

### 6) 예방
- 좋은 것: **신선한 채소, 생선류**
- 피할 것: **탄 음식, 짠 음식**(상태 악화)
- **매운 것**은 위암을 악화시키지는 않으나 **자극성**이 있어 피하는 게 좋음
- 사람마다 다르므로 **자신이 먹었을 때 불편한 음식을 피하는 것**이 원칙

### 7) 궁금증 ★
- **우유**: 단기적으로 속쓰림 완화 가능. 그러나 우유 속 **칼슘이 위산 분비를 촉진** → 오히려 악화 가능
- **탄산음료**: 트림 때문에 소화된 듯 느껴지지만 위장운동에 영향 없음. 오히려 **위식도 괄약근 압력을 낮춰 역류질환 심화** 보고
- **커피(카페인)**: 다량 섭취 시 **위식도 괄약근 압력 저하** → 역류성 식도질환 유발

## 12강. 방치하면 큰일, 난청

### 1) 난청의 기준 ★
- 20대 남성 평균 청취 강도 = **0dB**(가장 정상)
- **20dB**의 소리를 잘 못 들을 때 난청으로 진단
- **문제가 있다고 보는 난청 = 40dB을 못 들을 때**
- **청소년 소음성 난청 기준은 더 낮은 약 15dB**

**청력 손실 정도 분류**
| dBHL | 등급 |
|---|---|
| ~20 | 정상 |
| **21~40** | **경도 난청** |
| **41~55** | **중도 난청** |
| **71~90** | **고도 난청** |
| 91 이상 | **심도 난청** |

### 2) 난청 자가 테스트 (1개라도 해당하면 의심) ★
① 나는 괜찮은데 주변에서 TV 소리가 크다고 한다
② 이야기는 들리는데 **내용은 알아듣기 어렵다**
③ 여러 사람과 얘기할 때 어렵다
④ 목소리가 가늘거나 **여성과 대화할 때** 이해하기 어렵다
⑤ 전화로 대화할 때 잘 안 들린다
⑥ 다른 사람의 말을 잘못 이해할 때가 있다

### 3) 흔한 증상 해설
- 주변에서 TV 소리가 크다고 하는 것 = **대표적 실제 난청 증상**
- '들리는데 내용을 모르겠다' = **귀에서 뇌로 가는 통로의 문제** → 못 듣는 것이 **치매 위험**을 만드는 이유
- 조용한 곳에서는 들려 인지 못 하다가 **식당·술집·모임**에서 발견되는 경우
- 밖에서 통화 시 **저도 모르게 음량을 최대로** 올림
- **고주파 난청(노화성 난청의 특징)** → 저주파는 들리나 고주파를 못 들음 → **여성 목소리가 남성보다 듣기 어려워짐**
- 어르신과 대화할 때는 **또박또박 천천히** 말하는 것이 가장 중요

### 4) 치료
- **중이염, 뼈 문제, 고막 문제** → 수술적·약물적 치료 가능
- **신경세포 손상** → 초기에는 약물치료 효과
- **돌발성 난청** = **이비인후과 응급질환**, **초기 치료 시 호전**
- **노화성 난청은 치료 방법이 없음 → 예방이 최선**

### 5) 원인
- 노화가 원인인 경우도 있으나 **노화가 아닌 원인이 매우 많음**
  - 어린이의 **중이염**으로 인한 난청
  - 성장 과정에서 청력 관련 **뼈가 딱딱해지는 병**
  - 감기를 통해 생기는 **중이염** 등
- **선천성 난청**: 달팽이관·청신경이 제대로 형성되지 않은 채 출생
  → **조기 발견이 핵심** → 현재 **신생아 난청 검사**를 반드시 시행, **법제화 추진 중**

### 6) 소음성 난청
- 청소년의 전자기기 과다 사용으로 급증. **인지가 늦어** 상당히 진행된 후에야 발견
  → **미리 청력검사**로 조기 발견·예방 필요
- 큰 데시벨에 오래 노출될 때 발생하는 것이 맞지만, **작은 소음도 반복 노출되면 충격이 누적**되어 청각세포가 손상됨
- 귀 보호: **주변 소음이 얼마나 많은지 인식하려고 노력하는 것**이 매우 중요

## 13강. 공황장애, 어떻게 해야 할까?

### 1) 불안장애의 유형 ★
| 유형 | 내용 |
|---|---|
| **분리불안장애** | 아이가 부모와 떨어지는 것을 싫어함 |
| **선택적 함구증** | 친한 사람과는 말을 잘 하지만 다른 사람과는 말을 못 함 |
| **광장공포증** | 위험한 상황이 아닌데도 특정 공간에서 몸과 마음이 불안해지고 위험한 상황처럼 느낌 |
| **사회불안장애** | 밖에 나가지 못하고 사람을 만나지 못함 |

### 2) 공황장애
- **성인 10명 중 5명 정도가 경험**, 국내 **연간 약 10만 명** 발병
- 전형적 경과: 이유 없이 갑자기 **가슴 두근거림, 심장 조임, 죽을 것 같은 공포, 호흡곤란** → 응급실 → **검사상 이상 없음** → 몇 개월~1년 후 **재발**
- 본질: 자극을 **본래보다 크게** 받아들이게 만드는 병
  (예: **전화벨 소리가 사이렌처럼** 느껴짐)
- 아이가 밤에 무서워 불을 못 끄는 경우 → **분리불안**일 수 있음
- **엘리베이터 등 특정 공간 공포** → **공황장애 + 광장공포증의 결합 형태**
  (둘은 별개이나 함께 나타날 수 있음)

### 3) 원인과 치료 ★
- **원인**: **노르에피네프린 과활성화 + 세로토닌 부족**
- **약물치료**: **세로토닌 재흡수 억제제(SSRI)**로 세로토닌 강화
- **인지행동치료**: "공황은 **일시적**이다, 공황 때문에 죽지 않는다, 극복할 수 있다"
  → **'대단한 줄 알았는데 별 게 아니네'**로 인식을 바꾸는 것

### 4) 궁금증
- 공황장애는 **만성질환** 성격 → 나빠졌다 좋아졌다 반복
  → **치료를 8~12개월은 유지**해야 하며, 치료 후 재발 시 다시 병원 방문
- 불안감이 반드시 **불행한 어린 시절에서 유래하지는 않음**
  → 최근 치료는 **현 시점의 증상과 치료법**에 더 비중. **어린이에게도 공황장애 발생 가능**
- 약 장기복용: 일부 약이 졸릴 수 있으나 **기억력 등 인지기능에 영향 주는 약은 매우 적음**
- **의료법 제21조**: 모든 환자에 관한 사항은 **환자 동의 없이 타인이 알 수 없음**
  → **정신과 치료는 가족이라도 본인 동의 없이 알 수 없으므로** 치료에 거부감 가질 필요 없음

## 14강. 손 끝의 고통, 방아쇠수지

### 1) 방아쇠수지란
- 손가락을 구부릴 때 **총 방아쇠를 당기듯 '뚝' 소리**가 나서 붙은 이름
- 손가락 힘줄이 **좁은 통로를 지나며 마찰** → 통증, 잘 안 구부러지다 '뚝' 하며 갑자기 구부러짐
- 본질: **협착성 힘줄(건초) 염증 질환**

### 2) 발생 추이·부위 ★
- 손가락 반복 과사용, **스마트폰 그립 동작**으로 증가
- 건강보험심사평가원 자료: **2011년 약 13만 명 → 2013년 약 16만 명 → 2015년 약 18만 명**
- 호발 부위: **네 번째(약지) > 세 번째(중지) > 엄지** (물건을 꽉 쥐는 그립 동작과 관련)
- **골프와 연관성 높음** — 야구·테니스보다 **골프 그립이 매우 얇아** 손가락으로 감싸며 힘줄에 힘이 더 들어감

### 3) 원인
- 원인이 분명치 않음. **선천적** 발병도 있음
- 후천적: 오랫동안 무언가를 쥐는 동작, **진동기기 사용**, 무리한 손작업, **장시간 운전대**, 골프·테니스 라켓
- **2차성 원인**: **당뇨병, 류마티스 관절염, 통풍**
  → 단순히 손가락 문제로 보지 말고 **당뇨·통풍 등 질환도 의심**

### 4) 증상 진행 순서 ★
① 손가락을 구부리거나 펼 때 **불편한 느낌, 걸리는 느낌**
② 움직일 때 **통증**, 구부릴 때 **'뚝' 소리**
③ 손바닥 **가로 손금 주변에 혹·결절**이 만져짐
④ 아침에 손가락이 완전히 펴지지 않아 **반대쪽 손으로 펴야 함**
⑤ 손가락이 **구부러진 채 고정**되어 펴지지 않음
- 아침에 심한 이유: 자는 동안 안 움직이다가 아침에 **초기 마찰**이 크기 때문. 몇 번 움직이면 부드러워짐

### 5) 방아쇠수지 vs 류마티스 관절염 ★★
| 구분 | 방아쇠수지 | 류마티스 관절염 |
|---|---|---|
| 아픈 곳 | 힘줄·통로 | **손가락 관절 마디** |
| 대칭성 | **주로 쓰는 손가락(한쪽)** | **양쪽 손 대칭적, 여러 관절 침범** |
| 조조강직 | 짧음 | **최소 30분~1시간 이상 지속** |
| 발생 | 국소적 | **다발성** |
- 공통점: 아침에 손가락 구부리고 펴기 힘듦
- 요약: 병원을 찾을 만큼 **증상이 아주 심각하면 류마티스 관절염**

### 6) 예방
- **손가락의 반복적 사용을 피하되**, 무작정 안 쓰기보다 **사용 습관을 교정**
- 컴퓨터 작업·스마트폰 사용 시 **휴식시간 갖기**
- 손을 많이 쓴 날은 **따뜻한 물에 손목을 담그고 10분 정도 마사지**
- 손목·손가락 **스트레칭 자주** 하기
- 스마트폰 사용 시간 줄이고 **독서, 신문 읽기, 취미활동**으로 대체

### 7) 소아의 방아쇠수지
- 선천적·체질적으로 발병하기도 하며 **주로 엄지손가락**에 발생
- 엄지 끝마디를 잘 펴지 못해 **기형으로 오인**해 병원을 찾는 경우 많음
- 발달 과정에서 **힘줄과 통로의 균형이 깨져 일시적으로 발생**한 것으로, **대부분 자라면서 정상으로 회복**

## 15강. 피로, 이제 헤어지고 싶다

### 1) 피로의 정체
- **피로감의 대부분은 원인 불명**, 소수는 만성질환이 원인
- 피로를 일으키는 **대표적 만성질환 4가지**: **빈혈, 갑상선 질환, 당뇨, 고혈압**
- ⚠ **빈혈의 증상은 흔히 생각하는 어지럼증이 아니라 '무기력'**이며, 심해지면 숨이 참
  (어지럼증은 동반될 수도, 안 될 수도 있음)

### 2) 원인 찾기
- **기본 검사**: 빈혈 수치, 당 수치 등
- 고령 + 피로 + **체중 감소** → **정밀검사 권유**
- 기본 검사·조언 후에도 회복 안 되면 **기능의학적 검사** 시행
  → 단, 무조건 하는 게 아니라 **의사와 충분한 상담 후** 진행

### 3) 부신피질 호르몬 ★
- **부신피질 호르몬 = 스테로이드 호르몬**의 다른 말
- 위치: **신장(콩팥) 위**, **나폴레옹 모자** 모양, **손가락 하나 정도 크기**
- 내분비기관으로 **혈압, 혈액량, 전해질 조절**에 관여

| 상태 | 특징 |
|---|---|
| **부신기능 과부하** | 과한 노동·에너지 소비. **복부비만, 잦은 수다, 급한 성격** |
| **부신기능 저하** | '유리 체력', 너무 힘들어함. **추위에 약함, 소화불량, 잦은 어지럼증, 약한 체력** |

- **대사형 구분**
  - **느린 대사형**(에너지 약함) → 피곤하면 **걸어야** 함, **자기주도형 운동** 권장
  - **빠른 대사형**(에너지 강함) → **쉬는 것**으로 피로 해소, 운동 시 중간중간 체크하며 쉬기
  - ※ 구분은 전문 검사로 확정

### 4) 관리
- 전문가들이 꼽는 피로의 원인 = **스트레스** (반복되는 말이지만 정답)
- **피로도 자가진단 2가지**
  ① 피로가 **얼마나 회복**됐나?
  ② 피로가 **얼마나 오래** 가나?
- 일반 질환에 의한 피로가 아니라면 → **일기 쓰기** 추천
  → 일기에 적힌 피로 유발 요인을 **하나씩 걸러내는 방식**으로 피로 감소

## 16강. 류마티스 관절염의 습격

### 1) 날씨와 관절통
- 평소 **공기의 기압 ≒ 관절 내 기압**으로 유지
- 날씨로 공기 기압이 변하면 관절 내 기압은 유지되어 **외압차** 발생 → 통증

### 2) 정의 ★
- **다발성 관절염**을 특징으로 하는 **원인 불명의 만성 염증성 질환**
- 진행: 초기에 관절을 싸고 있는 **활막**에 염증 → 주위 **연골과 뼈**로 확산 → **관절 파괴·변형**
- 관절 외에도 **폐, 건조증, 피하결절, 혈관염, 피부궤양** 등 **전신 침범** 가능

### 3) 퇴행성 관절염 vs 류마티스 관절염 ★★
| 구분 | 퇴행성 관절염 | 류마티스 관절염 |
|---|---|---|
| 기전 | 관절을 많이 써서 **연골이 마모**되는 퇴행성 변화 | **자가면역** — 면역 시스템 이상으로 **자기 몸을 공격** |
| 성격 | 노화·과사용 | 만성 염증성·전신성 |

### 4) 초기 증상
- 관절이 **붓고 통증** 발생
- **전체 2/3 환자**에서 **피로감, 식욕부진, 전신 쇠약감, 근육통** 등 평범한 증상부터 시작
- **손에서 가장 잘 발생**, 만지면 아프고 움직임 제한
- **피하결절**: 팔꿈치, 손가락, 치골, 아킬레스건 등에 발생
- **빈혈**이 염증에 비례하여 동반
- **주먹을 꽉 쥐기 힘든 정도**로 질병 진행 정도를 가늠
- **무릎**: 초기에는 잘 발생하지 않으나, 전 기간을 통틀어 **80% 이상 환자**에서 관찰
  → 관절이 붓고 **빨갛게 달아올라 육안 관찰 가능**

### 5) 조조강직 ★
- 아침에 일어나서 또는 오랫동안 한 자세로 있은 후 관절이 뻣뻣해 움직이기 힘들다가 시간이 지나야 좋아지는 현상
- 류마티스 관절염은 **최소 30분~1시간 이상 지속**되는 것이 특징

### 6) 진단 기준 ★
- 제대로 진단받기까지 **평균 1년 정도** 소요
- 진단 항목
 ① **조조강직**
 ② 손목·손가락 중간 마디 관절·손바닥 관절 중 **한 관절 이상**이 부어서 아픔
 ③ 관절이 부은 곳이 **여러 부위 이상**에서 관찰
 ④ 좌우 관절 통증이 **대칭적**으로 비슷하게 발생
 ⑤ **피하결절**이 만져짐
- 환자에 따라 가벼운 관절염부터 **심각한 주요 장기 손상**까지 정도가 매우 다양

### 7) 치료
- 정확한 원인이 밝혀지지 않아 **어떤 약제도 완치시키지 못함**
- **발병 2년 이내 적극적 치료** 시 아픈 관절은 거의 없어지나 **대부분 약물치료를 지속**해야 함
- 수술은 직접적으로 필요하지 않으나, 악화되어 **2차 질환**이 생기면 수술이 필요할 수 있음

### 8) 일상 수칙 ★
- 적당한 운동과 규칙적인 생활 / 숙면 / 온도·습도 조절
- **무리한 성생활 금지**
- **딱딱한 의자 이용**, **좌변식(양변기) 화장실 이용**
- 편한 옷과 신발 착용
- 통증·경직 완화를 위한 **찜질**
- **집안일은 앉은 자세로** 하기
- 운동: 심할 때는 **약한 운동만**, 염증이 가라앉을수록 **근력 강화 운동**
  → **역기 들기, 포장도로 달리기** 등 관절에 무리를 주는 운동은 회피

### 9) 궁금증
- **가족력·유전**: 일란성 쌍생아 연구로 입증. **HLA-B27, HLA-DR4, HLA-DR1** 외에 관련 유전자 **약 40개 이상** 발견
- **합병증**: **치주염** 환자는 류마티스 관절염 위험이 큼
  류마티스 관절염 환자의 **약 절반**이 **고혈압, 골다공증, 당뇨** 등 한 가지 이상의 동반 질환 보유

---

## 17강. 당해보지 않으면 모르는 안구건조증

### 1) 환경적 원인
- 건조한 실내 공기 / 바깥 날씨
- **영상기기 과다 시청 → 눈 깜박임 저하**
- 잘못된 점안, 렌즈, 주변 환경으로 **수분이 빨리 증발**

### 2) 내부적 원인 ★
- **눈물막(눈물층)**이 눈 표면을 고르게 덮어야 하는데 **분비 부족** 또는 **빨리 마름**
- **눈물의 3층 구조**: **지방층 + 단백질(점액)층 + 수성층** → 이 균형이 깨질 때
- 눈물막의 **전해질·항균물질·단백질** 등이 질병으로 변화할 때

### 3) 대기오염
- 가천대 길병원 안과 김동현 교수 연구팀, **2010~2012년 16,824명** 조사
  → **오존 농도, 이산화황, 이산화질소**가 높아질 때 건조증 증가

### 4) 콘택트 렌즈의 문제 ★
- 렌즈 밑에 **눈물층·단백질·이물질** 축적
- 렌즈가 **장벽**이 되어 **산소 투과성 저하** → 눈이 호흡하지 못함
- 균이 붙으면 눈의 장벽을 파괴해 **염증** 유발
- **지방샘 파괴** → 지방 분비 감소
- ⚠ 컬러 렌즈나 안경점에서 그냥 받은 저가 렌즈로 **실명하는 경우**도 있음
- **안구건조증을 방치하면 시력이 크게 저하**될 수 있음

### 5) 치료
- **인공눈물**: 손상된 표면 회복에 도움
- 그러나 **근본적인 치료는 환경을 바꾸는 것**
  → 영상기기·스마트폰 사용 줄이기, **가습기** 틀기, **의식적으로 자주 깜박이기**

### 6) 인공눈물 vs 생리식염수 ★★
- **생리식염수 안구세척은 전문의가 전혀 권하지 않음**
 ① 인공눈물에는 눈 표면에 오래 머물게 하는 **점도 성분**이 들어감
   (우리나라 = **히알루론산 계통**, 미국 = **카복시메틸셀룰로오스**)
   → **생리식염수에는 그런 성분이 없음**
 ② 500cc짜리를 사서 며칠씩 쓰면 **균이 자람**
 ③ 눈물은 **지방층·단백질층·수성층** 3가지와 **전해질·항균물질**로 구성되는데,
   생리식염수는 오히려 **그 성분들을 씻어내 버림**

### 7) 예방
- 스마트폰 조금만 보기 / 영상기기 가까이 보지 않기
- **먼 풍경이나 하늘 보기**
- 나이 든 사람은 외출 시 **테가 큰 안경**으로 바람 막기
- 숙면, 규칙적 생활, 좋은 영양, **약 함부로 먹지 않기**, **금주·금연**
- → 눈에 좋은 것은 **다른 건강에 좋은 것과 다르지 않음**

### 8) 궁금증
- **라식·라섹·백내장 등 모든 눈 수술은 건조증을 유발**
  → 수술로 **신경이 손상**되면 눈 건강 유지 물질 분비가 일시 차단
  → 연구상 **3~6개월, 길게는 1년**까지 악화 / 대개 **6개월~1년** 후 회복
- **눈의 결석**: 눈꺼풀(특히 아래 꺼풀)의 단단한 덩어리. **돌이 아니라 지방이 뭉친 것**
  → 이물감, **눈물층 파괴·불균형** → 건조증을 더 심하게 느끼게 함
- **눈 세척 제품**: 오래 보관하려고 **방부제**가 들어가 악영향 가능. 비타민 첨가 광고는 **의학적 근거가 약함**

## 18강. 업무 불가능, 손목터널증후군

### 1) 정의 ★
- **수근관증후군**이라고도 함
- 손목 부위에서 **정중신경**이 압박되어 발생하는 **신경 압박 질환**
- 주로 **40~50대 여성**에게 많으나, 최근 스마트폰·키보드·마우스 사용으로 **젊은 층**에서도 증가

### 2) 원인
① **손목터널 내 해부학적 구조 변화**: 외상, 출혈, 종물
② **전신질환**: **당뇨병, 알코올중독, 갑상선 저하증** → 염증과 부종으로 발생
③ **손목의 반복적 과사용**

### 3) 여성에게 많은 이유 ★
- **여성 발병률이 남성의 약 4배**, **환자 10명 중 8명이 40~50대 여성**
- 이유
 ① 여성은 남성보다 **근육·관절·인대가 기본적으로 약함**
 ② **50대 이후 에스트로겐 급감** 등 호르몬 변화 → **골밀도 감소, 근육·뼈 약화**

### 4) 노화와 과사용의 기전 ★
- 손목을 반복 사용 → 손목터널 **천정을 구성하는 횡인대가 노화되고 두꺼워짐**
- → 손목터널의 **직경이 좁아짐** → 그 안을 지나는 **정중신경 압박** → 증후군 발생
- 심한 반복 사용 시 손목터널 내 **마찰과 염증** 발생
- **컴퓨터그래픽 디자이너, 게임 개발 직원**처럼 손목을 반복적으로 구부리고 펴거나 **진동 기계**를 쓰는 직업은 발생률이 **약 2배**

### 5) 증상 진행 ★
① 초기: 신경 압박 → 손가락이 **저릿저릿한 통증**
② 오래 압박 → **신경손상** → **무감각해지고 오히려 통증은 감소**
③ 지속 시 **엄지손가락 근육이 마르고(위축)** 기능적 문제 발생
④ **야간에 심해지는 통증** → 숙면 곤란 → **수면부족·수면장애**
⑤ **우울증, 갱년기 증상** 동반 가능

### 6) 치료
- 갑자기 생겼다면 **일단 손을 쉬게 하기**
- **손목 교정(보조기) + 약물치료**, **신경 주위 스테로이드 주사**
- **수술적 치료가 필요한 경우** ★
 ① 저림 증상이 심하거나 **10개월 이상 지속**
 ② **엄지손가락 근육 위축**과 근력 약화
 → 수술: 손목터널 천정인 **횡인대를 잘라 직경을 넓혀줌**

### 7) 예방
- **50분 일하고 10분 쉬기**
- 스마트폰·컴퓨터 사용 시간 줄이기, 손목에 과한 힘이 들어가는 동작 피하기
- 손목이 뻐근할 때 **인대 이완 스트레칭**
- 손목이 지나치게 구부러지지 않도록 **바른 자세**
- 컴퓨터 사용 시 **손목받침대** 사용
- 통증 시 사용 줄이고 **따뜻한 물로 20~30분 찜질·마사지**
- **팔과 어깨의 움직임**으로 손목 사용을 최소화
- 장시간 컴퓨터 작업 시 **보호대** 사용

### 8) 스트레칭 3가지
① 두 팔을 앞으로 뻗고 **손가락이 하늘로 향하게 꺾었다가 아래로 꺾기**
② 가볍게 주먹을 쥔 상태에서 **손목을 안→밖, 밖→안으로 돌리기**
③ 두 손을 깍지 끼고 손등이 하늘을 향하게 한 뒤 **손바닥이 물결치듯 손목 움직이기**

### 9) 오해와 진실
- **분포**: 심사평가원 자료 — 인구 천 명당 환자 수가 **도시보다 농촌 지역에 더 많음**
  (가사일 외에 **농촌일**로 손목을 더 많이 쓰기 때문)
- **발목터널증후군**: 발목에도 신경이 지나는 터널이 있어, **장시간 운전으로 페달을 밟는** 발목 과사용 → **발바닥이 저림**
- **전파·전염되는 질환이 아님**. 다만 한쪽에 생기면 **반대쪽 손을 더 써서** 과부하로 발생 가능
- **수족냉증**의 원인 중 하나로 손목터널증후군(말초신경 압박병증)이 작용 가능
  (추위 → 교감신경 예민 → 혈관 수축 → 말초 혈액공급 감소)

## 19강. 당신도 예외가 아닌 폐렴

### 1) 정의 ★
- **세균·바이러스·곰팡이** 등 미생물 감염으로 **말초 기관지와 폐포 등 폐 실질**에 발생하는 **염증성 호흡기 질환**
- **2015년 기준 우리나라 사망 원인 4위**
- **65세 이상에서는 사망 원인 1위**

### 2) 증상
- 대표: **고열, 기침, 가래**
- 그 외: 흉통, 두통, 근육통, 구토, 설사
- 중증: **호흡곤란, 의식 혼탁**
- **3주 이내의 기간 동안 기침**을 하면 폐렴 의심

### 3) 감기와의 감별 ★
- 폐렴은 감기와 비슷하게 시작하지만
 - **고열 + 누런 가래를 동반한 기침이 호전되지 않음**
 - 일상생활에서도 **숨이 참**, 숨 쉴 때 **흉통**
 - **호흡기 증상 + 의식혼탁 → 폐렴을 강하게 의심**
- 보통 **38도 이상 고열**이 흔하나, **고령에서는 오히려 저체온**을 보이기도 함

### 4) 발생 원인
- **구강(특히 코 인두)에 머무는 균이 수면 중 폐 깊숙이 흡인**되어 염증 발생
- **독감** 등 일부 바이러스가 진행하며 폐에 염증 유발
- 상태가 양호하면 폐렴까지 가지 않지만 **영유아, 65세 이상 고령 만성질환자**는 발병
- **겨울철**: 차가운 기온 → 면역력 약화 / 건조한 공기 → **기관지 섬모 운동 저하** → 균이 하부 호흡기 세포벽에 잘 붙음

### 5) 폐렴구균 백신 ★★
| 종류 | 특징 |
|---|---|
| **다당질 백신** | 세포벽 주성분인 **다당을 항원**으로 인식시켜 항체 형성. **저렴**하지만 **2세 이하 소아에게는 적절한 항체 형성을 유도하지 못함** |
| **단백 결합 백신** | 다당질 백신보다 **예방 효과가 더 높음** |

**접종 원칙**
- **2세 이하 영유아**: **단백 결합 백신**을 꼭, **수차에 걸쳐** 접종
- **65세 이상 성인**으로 접종 이력이 없으면: **종류와 상관없이 1회** 접종
- **65세 이전에 단백 결합 백신 접종** → **1년 간격**을 두고 **다당질 백신 추가 접종**
- **만성질환자**: **65세 이전이라도** 접종 권고. 미접종자는 **단백 결합 백신 먼저 → 다당질 백신 추가**
- 시기: 주로 가을철 권고하나, **독감과 달리 1년 효과로 끝나는 것이 아니어서 시기는 큰 상관 없음**
- **폐렴 예방접종률은 약 33%**로 낮음 (원인: '설마 내가', '병원에서 쉽게 치료된다'는 인식, 의사들의 중요성 간과)

### 6) 폐 건강에 좋은 음식 ★
- **감귤류**(귤·오렌지·유자): **비타민 C, 구연산** → 염증 반응 억제
- **브로콜리**: **설포라페인(유황화합물)** → 폐에 들러붙은 유해물질 세척, **비타민 C·베타카로틴** 항산화
- **토마토**: **리코펜** → 폐 질환 예방
- **고등어**: **오메가3** → 체내에서 **아이코사노이드**로 바뀌어 염증 감소

### 7) 생활 수칙
- **예방접종, 금연, 균형 잡힌 식단·운동, 적절한 실내 환기**

### 8) 궁금증
- 대부분 폐렴은 **오염된 물체 → 손 오염 → 코 인두에 균 머무름 → 흡인**으로 발생.
  일부는 **감염자의 분비물이 비말 형태로 직접 전염**
- **통원 치료 가능**. 단 **65세 이상, 만성질환자, 면역저하 질환자**는 **입원 권유**, 젊은 성인도 증세가 심하면 입원 고려
- **폐렴이 폐암으로 진행되지는 않음**. 다만 **폐렴 진단 과정에서 원인이 폐암이었음을 발견**하는 경우가 있음
  → 특히 **기관지 안쪽에 생긴 폐암**은 **기관지 폐쇄**를 유발해 폐렴으로 발전
- 폐렴의 주요 원인이 **구강 내 병균의 폐 흡인**이므로 **구강 위생이 폐렴 예방에 중요**
  → **스케일링, 치실 사용**도 도움. 고령자는 **의치를 청결**하게
- ⚠ 폐렴구균 예방접종을 해도 **충분한 면역력을 획득하지 못하면 감염될 수 있음**

## 20강. 발바닥이 문제, 족저근막염

### 1) 족저근막
- 서 있거나 걷고 뛸 때 발이 **아치를 형성**하여 체중을 지면으로 분산시키는 데 핵심 역할
- 그러나 **혈액순환(혈관)이 매우 적은 구조물** → **미세한 손상이 반복**되거나 심한 충격을 받으면 손상
- 사례: 마라톤 선수 **황영조**의 은퇴 결심 이유 중 하나

### 2) 증가 원인
- 현대의 **아스팔트·보도블록** = 충격을 전혀 흡수하지 못하는 구조물 (과거 황토길과 대비)
- 현대인의 신발이 편안함보다 **기능·멋** 중심 → 발에 과한 긴장력
- **마라톤, 배드민턴** 등 장시간 뛰거나 점프를 반복하는 **생활스포츠** 활성화

### 3) 증상 ★
- **발꿈치 안쪽에서 통증 시작** → 발뒤꿈치 바닥을 따라 족저근막 통증
- **아침에 일어나 첫발을 딛을 때 통증이 가장 심함**
- 활동 후 **몇 분 지나면 통증 감소**
- **장시간 앉아 있다 일어날 때**도 발뒤꿈치 통증

**아침에 심한 이유** ★
- 잘 때는 발이 축 처져 **아킬레스건과 족저근막이 단축**된 상태
- 아침에 걸으려 하면 갑자기 펴지면서 발생하는 **긴장력**이 손상된 약한 부위에 걸림
- 장시간 앉았다 일어날 때도 **같은 원리**

- **발레**: 발가락 끝으로 서고 반복 점프 → 위험 인자. 단 **운동 전 충분한 스트레칭으로 예방 가능**

### 4) 치료 순서 ★
- **초기**: 약물치료, 스트레칭만으로도 충분
- **진행 시**: 보조기, 주사치료, 부목교정, **체외 충격파 치료**
- **보존적 치료로 6개월 이상 효과가 없으면 → 수술적 치료**
- 발병 초기에 충분한 휴식·시간을 주면 병원 없이도 회복 가능

### 5) 방치의 위험
- 발뒤꿈치 통증을 피하려고 **걸음걸이(보행 패턴)에 변화** 발생
- → **허리뿐 아니라 무릎, 고관절**에도 악영향

### 6) 냉찜질 vs 온찜질 ★★
| 상황 | 처치 |
|---|---|
| 운동 후 갑작스러운 통증, **외상에 의한 통증** | **냉찜질** (염증 반응 감소) — 이때 온찜질은 "불난 집에 부채질" |
| 통증이 **3주 이상 경과, 만성화**된 경우 | **온찜질** |

### 7) 예방
- 갑작스럽거나 과도한 걷기·뛰기 피하기
- **충분한 준비운동 후 운동 시작**, 평소 **편한 신발** 착용
- **체중이 많이 나가면 위험** → 체중을 적정하게 유지
- **아킬레스건·족저근막 스트레칭 꾸준히**

### 8) 스트레칭 3가지 ★
**① 족저근막 늘리기**: 발을 올려 **발가락을 잡은 후** 족저근막을 늘려줌

**② 아킬레스건 스트레칭**
- 발을 **11자**로 나란히 서고 **아픈 쪽 발을 뒤로** 뻗음
- 벽·식탁·의자를 잡고 **엉덩이를 앞쪽으로 밀어 넣으며** 뒤쪽 아킬레스건·종아리 근육이 당기게
- **10초 유지 후 풀기** 반복 → **하루 20분 이상** (5분·10분·5분 등으로 나눠도 무방)

**③ 다리 근육 강화(까치발)**
- 다리를 **11자**로 하고 뒤꿈치를 들어 **까치발**로 서기
- **10초 유지 후 멈춤** 반복 → **하루 20분 이상**
- 지하철·버스 안에서도 가능. 아킬레스 힘줄·발바닥 통증에도 효과

### 9) 궁금증
- **평발**: 발 아치가 정상보다 낮음 → 발 구조물 불안정, 족저근막에 과도한 긴장 → 위험 증가, **피로감도 더함**
- **요족**: 아치가 정상보다 **높은** 발 → 발 피로 증가, 과도한 긴장력 → 역시 **위험인자**
- **키높이 깔창**: 아치 형성 방해, 족저근막에 과한 긴장, 충격흡수 X → **발 건강에 매우 해로움**
- **하이힐**: 장시간 착용 시 발병률 상승
- **플랫 슈즈**: 바닥이 얇아 보호 기능이 없고 **모든 스트레스가 발에 그대로 전달**
- **등산화**처럼 두껍고 딱딱해 잘 꺾이지 않는 신발 → 걸을 때 발가락이 덜 꺾여 **족저근막이 덜 긴장**

### 10) 신발 고르는 법 — 미국 정형외과 족부관절학회 10가지 ★★
① 신발 크기에 발을 맞추지 말고 **반드시 신어보고** 고를 것
② 나이가 들면서 **발의 폭이 변하므로 정기적으로 발 크기 측정**
③ **전족부와 외곽선**이 잘 맞는 신발 고르기
④ 양 발 크기가 다를 수 있으므로 **큰 발에 맞춰** 고르기
⑤ **발이 커지는 저녁**에 신발 고르기
⑥ **선 채로** 맞춰볼 것 (서면 발이 더 길어지고 폭이 넓어짐)
⑦ **가장 긴 발가락(보통 두 번째)보다 1.3~1.5cm 더 긴 신발**을 고르고, **볼 부분은 딱 맞게**
⑧ 너무 조이는 것 피하고, 잘 맞지 않으면 **사지 말기**
⑨ 전족부는 맞지만 **뒤꿈치가 헐렁한 것** 피하기
⑩ 상점 안에서 신고 **실제로 많이 걸어본 후** 고르기

- **신발 굽은 약 3cm 정도가 적당**
- ⚠ 위험한 생각: "내 발이 265mm니 신발도 265mm", "볼이 좁아도 신다 보면 늘어날 것", "높은 굽은 신어줘야"

### 11) 폐경·체중과의 관계 ★
- 족저근막염은 **40~60대 여성에게 호발**
  → 몸의 탄력이 감소하는 시기이자 **폐경 시기**와 겹침 (관련성 입증 연구 진행 중)
- **체중**: 걸을 때 발은 **체중의 3배**, **뛸 때는 10배**까지 하중을 견딤
  → **체중이 10kg 더 나가면 발에 걸리는 하중은 100kg 증가**
- **족저근막염은 난치병이 아님**. 다만 의사와 환자의 **꾸준한 노력과 인내**가 필요
  → **일기·일지**를 쓰며 꾸준히 운동하고 전문가 상담을 이어가면 해방 가능

## 21강. 목의 피로가 쌓여 성대질환

### 1) 성대의 역할
① **목소리를 만들어내는 발성기관**
② **폐에서 만들어진 공기가 지나가는 호흡기관**

### 2) 성대 결절 vs 성대 폴립 ★★
| 구분 | 성대 결절 | 성대 폴립 |
|---|---|---|
| 원인 | **반복적인 성대 운동으로 흉터**가 생김 | **한 번의 강력한 힘**으로 성대 혈관이 터짐 |
| 위치 | 보통 **양쪽** | 보통 **한쪽** |
| 모양 | 성대가 튀어나옴 | **말미잘 모양의 작은 종기** |
| 치료 | **수술 X, 음성치료** | **음성치료**, 단 **딱딱하거나 큰 경우 수술 고려** |

- **성대 낭종**: 성대 **깊은 곳에 혹**이 생기는 질환 → **반드시 수술**

### 3) 성대 결절의 원인·증상
- **원인**: ① 목소리의 오남용 ② 성대를 일부분만 작동시키는 등 **잘못된 목소리 사용법**
- **증상**: 목소리 변화 / 말을 많이 하면 쉽게 피곤 / **고음이 잘 나지 않음** / **목소리가 낮아짐**
- 폴립·결절·성대암 모두 **대표 증상은 목소리 변화**

### 4) 성대 결절이 여성에게 많은 이유 ★
① 여성이 남성보다 **말을 많이 하는 편**
② **성대 진동수**: 남성 **1초에 약 100번**, 여성 **약 220번** → 성대 활용이 많음
③ 여성은 **성대가 짧아** 충격을 더 많이 받음

### 5) 성대의 노화 ★
- **50대 이후**: 여성은 성대가 **붓고**, 남성은 성대가 **가늘어짐**
- → **남성 목소리는 여성화, 여성 목소리는 남성화**되는 경향
- 목소리가 **빨리 쉬거나**, 연설·스피치 시 예전과 다른 소리가 나면 노화를 짐작

### 6) 성대 풀기 연습 (자기 전 시행 시 아침에 덜 붓고 좋은 목소리)
- 성대의 **튀어나온 부분을 잡고 앞뒤·좌우로 마사지**
- **튀어나온 연골의 윗부분**을 잡고 마사지하듯 눌러주기
- **긴장한 목과 어깨 주변 근육** 충분히 풀어주기

### 7) 올바른 발성법
- 가장 좋은 것은 **자기 성대의 모양에 따른 본래의 피치(음높이)를 알고 그대로 쓰는 것**
- 흔히 말하는 **"공기 반, 소리 반"** 발성은 노래에서는 감성적 효과가 있으나
  **일반적인 말하기에서는 공기가 좀 적은 것이 더 좋음**

### 8) 궁금증
- **후두염**: **과식·폭식** → 역류성 식도염, **역류성 후두염** → 발성과 목소리 변화
  → 담배로 인한 **성대 부종형 후두염**은 **장기화 가능성** 있음
- **허스키한 목소리**: 오랜 기간 유지되어 온 것이면 문제 없음
  ⚠ 그러나 **최근에 변한 목소리가 2주~한 달 이상 좋아지지 않으면 성대암 의심**
- **변성 발성 장애**: 사춘기가 지난 남자가 여전히 예전(높은) 목소리를 쓰는 것
  → 성대는 변화했으나 **심리적으로 바꾸지 않는 것**, **성대질환의 하나로 분류**
  → **음성치료**로 원래 피치와 바뀐 피치를 알려주면 대개 빨리 호전

## 22강. 4계절의 불청객, 피부 건조증

### 1) 나이가 들면 생기는 피부 변화 ★
① **표피가 굉장히 얇아짐**
② **진피의 콜라겐 감소**
③ **피지선의 분비 감소**

### 2) 피부건조증
- 외부 공기가 수분을 뺏어가 피부가 버석해지는 현상
- **피부의 정상 수분량은 약 20%** → 이 정도를 유지해야 촉촉하다고 느낌
- 증상: 피부가 붉어짐, **외부 자극에 민감해짐**, 가려움, 각질

### 3) 입술과 구순염 ★
- 입술은 피부가 아니라 **점막**이며 피부보다 훨씬 얇음 → 대기가 건조하면 훨씬 더 건조해짐
- 방치하면 **구순염**으로 발전 → **입술이 발갛게 되면서 따갑고 가려운 현상이 지속**
- **예방**: 자기 전 **립밤이나 꿀**을 바르고 자기
- **각질이 심할 때**: **흑설탕과 꿀을 1:1**로 섞어 **1~2분간 마사지하듯** 바르기
  → 각질을 녹이고 꿀의 **보습력**까지 활용

### 4) 긁으면 생기는 문제 ★
> 긁어서 생기는 문제가 **약을 발라서 생기는 부작용보다 훨씬 심함**
- 붉어지는 데 그치지 않고 **까맣게 변화(색소침착)**
- 반복해서 긁으면 피부가 증식하여 **코끼리 가죽처럼 두꺼워지는 태선화** 발생

### 5) 발과 무좀
- 매일 걸으므로 발바닥은 두꺼워지고 각질이 쌓임 → **각질이 쌓이면 무좀균 침투가 쉬워짐**
- **각화형 무좀**: 겨울철 발뒤꿈치가 두꺼워지는 무좀 → **무조건 거칠게 밀지 말고 치료를 고려**
- **지간형 무좀**: 발가락 사이에 생기는 무좀
  → 경험이 있으면 **사타구니에도 잘 생김** = **완선** (습진으로 오인하기 쉬움)

### 6) 비듬(두피 각질) ★
| 구분 | 원인 | 관리 |
|---|---|---|
| **건성 비듬** | 건조 | **오일 마사지, 보습 기능 샴푸** |
| **지성 비듬** | 피지가 많아 **곰팡이** 증식 (얼굴의 지루성 피부염 동반 가능) | **항진균제 포함 샴푸** |

### 7) 목욕 ★
- **탕 목욕을 너무 오래** 하거나 **냉탕·온탕을 오가면** 관절엔 도움이 될 수 있으나 **피부 각질이 다 제거**됨
- 각질층에는 **유분막과 수분막**이 있고, **유분막이 수분 증발을 막아줌** → 이 방어막이 사라짐
- **사우나든 탕 목욕이든 짧게** 하는 편이 좋음
- **목욕 후 수건으로 닦고 3분 이내에 보습**하여 보습막을 다시 형성

### 8) 난방
- 과도한 난방 → 피부 수분이 빨리 빠져나감
- **전기장판 가급적 사용 금지**, 자동차 **히터 끄기**
- **가습기**로 실내 수분 맞추기 → 찜찜하면 **젖은 빨래를 널어두기**

## 23강. 단순한 어지럼증이 아니다?

### 1) 어지럼증이란
- **하나의 증상**이며 여러 증상을 포함
  → 빙글빙글 도는 느낌 / 내가 도는 느낌 / 순간적으로 아찔한 것 / 쓰러질 것 같은 느낌

### 2) 관련 신체기관 (순서 중요) ★
**1순위 = 귀, 2순위 = 뇌, 3순위 = 심장**(빈혈·부정맥 등)
그 외 **척추, 발, 눈**도 관련

### 3) 기립성 저혈압
- 일어날 때 **혈압이 빨리 올라가지 못해** 발생 = **일시적인 뇌빈혈**
- 나이가 들어 **다리에 힘이 없거나 근육이 없어지면** 유발

### 4) 응급 상황 판별 (뇌의 문제) ★★
가장 급한 것은 **뇌의 문제** — 다음이 나타나면 **즉시 응급실**
- 약간의 **의식 소실**
- **말을 잘 못 하겠음**, 이름을 부르려는데 말이 안 나옴
- **손발에 힘이 빠짐**
- **두통이 매우 심해짐**
- ★ **귀의 문제는 어지러워도 어떻게든 걸을 수는 있으나, 뇌의 문제는 절대 걷지 못하고 쓰러짐**

### 5) 치료 — 전정재활운동 ★
- 어지럽다고 무조건 쉬거나 약만 먹으려 하지 말 것 (급격히 어지러울 때는 약 복용이 맞음)
- 적절한 치료 후 **전정재활운동**으로 퇴화된 **전정기관**의 기능을 향상시키면 훨씬 빨리 극복
- ⚠ **정말 어지러운 급성기에는 하면 안 됨** (넘어짐·낙상 위험) → **급성기가 지난 후** 시행
- 운동 방법
 ① 정면에 **명함을 놓고 응시**
 ② 명함을 **좌우로 움직이며 눈동자를 좌우로** 움직이기
 ③ **시선을 고정하고 얼굴을 좌우로 돌려가며** 명함 응시
- 어지러운 환자에게 **백화점·시장에 가라**고 권하는 이유: 자연스럽게 **눈을 자꾸 움직이게** 되기 때문

### 6) 이석증 vs 메니에르병 vs 전정신경염 ★★
| 구분 | 이석증 | 메니에르병 | 전정신경염 |
|---|---|---|---|
| 기전 | **세반고리관 안의 돌멩이(이석)**가 떨어져 나옴 | **달팽이관 안의 물(내림프)의 양이 늘어남** | 어지럼증을 담당하는 **신경의 염증** |
| 지속시간 | **10~20초 정도**로 매우 짧음 | **한 20분~3시간 정도** 반복 | **상당히 긴 시간** 좋아지지 않음 |
| 유발 | **고개를 돌릴 때, 움직일 때만** | 반복적 | – |
| 난청 | **동반 X** | **동반 O** (귀 먹먹함, 이명) | – |
| 통증 | 귀의 돌멩이는 **통증을 유발하지 않음** | – | – |

- **메니에르병이 위험한 이유**: **반복적으로 어지러울 수 있어** 운전 중 재발 가능
- **전구 증상**: **웅 하는 소리(이명)**, **귀가 먹먹해짐** → 환자는 이를 인식하고 **주치의와 대응 플랜**을 미리 세워둘 것
- **돌발성 난청**도 어지럼증을 동반 (어지러워서 난청이 생기는 것이 아니라 **병 때문에 둘이 함께** 옴)

### 7) 갑자기 어지러울 때 응급처치 ★
- 문제는 **넘어져 쓰러지는 것** → **빨리 앉거나 주저앉기**
  (앉는 것이 좋은 이유: **서 있을 때보다 뇌로 피가 빨리 감**)
- **귀나 심장 등의 문제는 대개 휴식하면 좋아짐**
- **뇌의 문제로 의심되면 즉시 응급실**

## 24강. 여성의 위기, 갑상선 질환

### 1) 갑상선
- 목 중앙에 위치한 **약 4cm 정도의 기관**
- 먹은 음식을 **에너지로 전환**시켜 **소화 기능, 혈액순환, 호르몬 기능** 등 모든 기능에 영향 → **우리 몸의 중추적 호르몬 기관**
- ⚠ 호르몬이 많아지면 살이 빠질 수 있으나, **다이어트를 위해 일부러 갑상선 질환에 걸리려는 발상은 매우 위험**

### 2) 갑상선 질환의 분류 ★
**① 기능의 문제**: **기능 항진증 / 기능 저하증** → 호르몬의 영향
**② 조직(세포) 자체의 문제**: **갑상선염 / 갑상선 결절(혹) / 갑상선암**
 → 조직의 문제이므로 호르몬 영향은 받지만 **모든 것이 호르몬 때문은 아님**

### 3) 갑상선암 ★
- 이른바 **'착한 암'** — **유두암(전체의 95%)**, **여포암**은
  **전이를 잘 하지 않고 자라는 속도가 매우 느려 조기 수술 시 5년 생존율이 거의 100%**
- ⚠ 그러나 **미분화암** 등 위험한 암은 전이해 생명을 위협 → **반드시 전문의와 상의하여 조직형·성장속도·전이 여부 확인**
- **갑상선암은 갑상선 기능에 문제를 일으키지 않음** → 피곤하다고 반드시 갑상선암은 아님
- **증상 없이 나타나기 때문에 오히려 무서운 암** → **갑상선 초음파 등으로 조기 검진** 권장
- **치료**: 갑상선은 **나비 모양의 두 엽** → 보통 **두 엽 모두 절제**
  단, 암이 국한되고 성장 속도가 느리면 **반만 절제**
  - **조직이 남아 있으면 호르몬제 불필요**
  - **완전 절제 시 갑상선 호르몬제 복용 필수** → 갑상선 자극 호르몬 분비를 억제해 **재발 방지**

### 4) 요오드와 먹거리 ★
- 우리나라는 미역 섭취 등으로 요오드 섭취가 어느 정도 이루어지는 나라 → **적절히 먹으면 문제 없음**
- **오해의 출처**: 갑상선암 절제 후 남은 병소 제거를 위해 **방사선 요오드 치료**를 할 때
  체내 요오드 수치를 낮춰야 하므로 **약 2주간** 요오드 함유 음식을 자제시킴
  → 이것이 "요오드가 갑상선암에 나쁘다"로 **와전**된 것
- 그 기간이 아니라면 **김, 미역은 적절히 섭취하면 건강에 도움**

### 5) 갑상선 기능 저하증
- 원인: **자가면역질환**이나 **세균 침범**으로 갑상선 조직이 망가짐
- 증상: **이유 없이 체중 증가, 몸이 푸석푸석해짐, 머리카락이 빠짐, 소화 기능 저하**
- **하시모토 갑상선염**(하시모토 자가면역 질환): 갑상선에 염증이 생기는 대표 질환.
  방치 시 갑상선 기능 저하 유발
- **급성/아급성 갑상선염**은 약간의 **통증**을 유발할 수 있음
- 💡 **많이 피곤할 때 의사들이 가장 먼저 하는 검사 3가지**: **빈혈 검사, 간 기능 검사, 갑상선 기능 검사**

### 6) 그레이브스병 ★
- **갑상선 기능 항진증의 80~90%**를 차지, **갑상선 자가면역 항진증**이라고도 함
- 기전: 자기 세포가 자기를 공격하면서 **기능이 항진되는 쪽으로 증식**
- 증상: **맥박이 빨라짐, 땀 증가, 많이 먹어도 대사가 빨라 체중 감소**,
  **눈 뒤 조직까지 성장하여 눈 돌출(안구돌출)**
- 다행히 **약물, 방사선 요오드, 수술에 잘 반응**

### 7) 예방 — **SSEN(잠·스트레스·운동·영양)** ★
- 자가면역질환은 **면역력이 떨어졌을 때 외부 바이러스·균과 싸우는 과정**에서 생기는 질환(아토피·천식과 유사)
- **Sleep**: 잠을 충분히
- **Stress**: 스트레스 관리 (대화, 명상)
- **Exercise**: 주 3회 운동
- **Nutrition**: 영양소가 풍부한 음식을 골고루

### 8) 궁금증
- **갑상선암 + 유방암**: 유방암은 **에스트로겐**, 갑상선암은 **갑상선 자극 호르몬**의 영향을 받는 **호르몬 이상**이라는 공통점 → **자주 동반**
  → 갑상선암 환자는 **유방암 검사를**, 유방암 환자는 **갑상선암 검사를** 규칙적으로
- **임신**: 수술·방사선 요오드 치료 중에는 자제. **완치 판정 후에는 갑상선 호르몬제를 먹고 있어도 태아에게 영향을 주지 않으므로 정상적으로 임신 가능**
- **손톱에 때가 많이 끼면 갑상선 기능 항진증 의심** — 생활 속의 지혜
  → 그레이브스병은 조직 생장을 빠르게 함 → **손톱이 빨리 자라고 벌어지며 때가 낌**
- **지나친 채식은 요오드 섭취 불균형**을 초래 → 적절한 섭취 필요
- **채소는 생으로보다 익혀 먹는 것이 더 좋음** — **마늘, 토마토, 당근**을 익히면 영양소 파괴가 줄고 체내 흡수도 잘 됨

## 25강. 면역력 약화로 생기는 문제들

### 1) 면역력의 역할
- 면역력 저하 시 **폐렴·결핵 등 감염 질환**은 물론 **암, 당뇨** 같은 만성 질환까지 유발
- **우리 몸을 지키는 최초이자 최후의 보루**
- 개인차가 크며 **잔병치레가 잦은 사람은 면역력에 문제가 있는 것**

### 2) 면역력의 종류 ★
- **선천면역**: 태어날 때부터 받고 태어난 면역력
- **획득면역**: 살아가면서 학습되고 조절에 따라 만들어지는 면역력
- 부모에게 물려받은 면역력, 보유 인자, 피부 상태 등으로 **일부 유전**되지만,
  **생활습관·건강관리 등 후천적 부분이 더 크게 작용**할 수 있음

### 3) 면역력과 노화 ★
**50대가 지나면서**
- **흉선**의 크기가 작아짐 → **T림프구** 숫자 감소
- **골수**에서 **B림프구**를 만드는 전구세포가 감소하며 골수도 퇴화
- **비장(지라)**의 크기가 줄고 기능이 떨어짐 → **백혈구 등 혈구세포 감소**
- → 노화는 **세포의 노화 + 면역 시스템의 노화**를 모두 불러옴

### 4) 면역력의 조화 ★
- 면역력은 **모자라도, 너무 많아도 문제** → **조화**가 필요
- **과도할 때**: 면역력 혼란 = **자가면역질환** → **류마티스 질환, 알레르기성 비염, 췌장 염증으로 인한 당뇨** 등
- **과도하게 사용되어 소진될 때**: **암, 대상포진**

### 5) 면역력이 떨어지면 생기는 병 ★
- **알레르기 비염** (면역력 저하 + 면역력 혼란 모두 관계)
- **폐렴**
- **암** (변형된 암세포를 공격하지 못해 증식)
- **아토피** (자기 피부를 자기가 공격)
- **대상포진** (신경세포에서 활동 시작)

### 6) 스트레스와 옥시토신 ★
- 면역력을 떨어뜨리는 가장 큰 원인 중 하나가 **스트레스**
- 반대로 면역력을 올리는 좋은 자극은 **사랑받는 느낌**
- 키스를 하면 **옥시토신**(출산 시 자궁을 수축시켜 아기를 편하게 해주는 호르몬)이 분비 → **면역력 상승 효과**

### 7) 원형탈모 ★
- **전형적인 자가면역 질환**
- 스트레스 → 면역력 **과다 증진** → **자기 모낭세포·두피를 스스로 공격**
- → 약물치료도 중요하지만 **스트레스 관리로 면역력을 정상화**하는 것이 필요

### 8) 체온
- 체온은 **신진대사·혈액순환**을 결정하는 중요 인자
- 정상 체온 유지 → 혈액순환 원활 → **혈구 동원**이 잘 되고 **NK세포(자연살해세포, 암세포를 죽이는 세포)**까지 활성화
- → 면역력 관리의 핵심 중 하나는 **너무 차갑지도 덥지도 않은 정상 체온 유지**

### 9) 면역력 자가진단 10문항 ★★
① 피로가 잘 풀리지 않는다
② 감기에 자주 걸리고 잘 낫지 않는다
③ 입안이 헐거나 입 주위에 물집이 생긴다
④ 눈에 염증이 자주 생긴다
⑤ 스트레스가 자주 생긴다
⑥ 상처가 잘 낫지 않는다
⑦ 체력이 급격히 떨어진다
⑧ 인내력과 끈기가 없어진다
⑨ 배탈 혹은 설사가 잦다
⑩ 눈 밑에 다크서클이 자주 생긴다

**판정: 3개 이하 → 정상 / 4~6개 → 약간 주의 / 7개 이상 → 당장 조치 필요**

### 10) 면역력을 높이는 음식·실천
**음식**
- **체온을 올리는 신 음식**, **생강, 마늘**
- **안토시아닌**이 든 음식, **비타민 A·베타카로틴**이 많은 **당근·단호박**
- **비타민 D**가 많은 **버섯**, 항산화물질이 많은 채소
- **오메가3**가 풍부한 **견과류와 등푸른 생선**
- ⚠ 한 가지만 먹으면 **편식으로 영양소 결핍** → 제철과일·생선·견과류를 **골고루 균형 있게**

**실천**
- 자기 전 간단한 **반신욕이나 온욕**
- **금연·금주**
- 적절한 운동으로 **노폐물 배출**
- **물 2리터 이상** 섭취

### 11) 술·운동과 면역력 ★
- **술**: 마셨을 때 체온이 오르는 것은 **일시적인 교감신경계·스트레스 호르몬 분비** 때문
  → **시간이 지나면 체온이 오히려 떨어짐**
- **운동**: 면역력이 떨어지는 사람은 **근육량이 부족한 경우가 다수** → 수영, 걷기
  → **숲에서 걸으면 피톤치드**(면역력 강화 물질)까지 얻음
  → ⚠ **과한 운동은 젖산(피로물질)과 활성산소**를 많이 분비시키므로 **적절히 조절**

## 26강. 지방간이 된다는 것

### 1) 정의와 원인 ★
- **지방간 = 간에 지방이 과도하게 낀 상태**
- **알코올성 지방간**: 술을 많이 마셔서
- **비알코올성 지방간**: 술을 거의 안 마시는데 비만, **당뇨병, 고지혈증** 등 **대사증후군**에 동반

### 2) 진행 경로 ★★
**지방간 → (방치+음주) → 알코올성 간염 → 알코올성 간경변증(간이 굳음) → 간암**
- **비알코올성**도 방치 시 **지방간염 → 간경변증 → 간암**으로 진행 가능

### 3) 발생 기준 ★
- 남자: **일주일에 소주 3병 이상**
- 여자: **일주일에 소주 2병 이상**
- 을 장기간 마시면 대부분 지방간 발생 (단 **유전적 요인과 개인차가 상당히 큼**)

### 4) 진행 상태
- 간은 **우측 갈비뼈 아래**에서 보호받으며 **정상이면 만져지지 않음**
- **전체 간 무게의 5% 이상을 지방이 차지하면 지방간**
- 지방이 낀 간은 불그스름한 색이 아니라 **분홍색(누런색)**으로 변함 → 예: 거위의 **푸아그라**
- 배 밖으로 나와 **만져지게 됨**
- **10~20%**가 단순 지방증이 아니라 **지방간염**이면 → 염증 지속 → 간이 **섬유질로 대체되어 딱딱하게 굳음**
- 간이 굳으면 심장으로 갈 혈액이 다른 쪽으로 우회
  → **대사되지 않은 불순물이 낀 혈액**이
   - **머리로 가면 → 간성 혼수**
   - **식도로 가면 → 식도 정맥류 출혈, 복수**
- **간경변증의 일부는 간암으로 진행**
- ★ **지방간 상태에서 원인을 제거하면 원상복구 가능. 그러나 간경변증이 되면 되돌리기 매우 어려움**

### 5) 환자 증가
- 한 병원 보고: **건강검진자의 약 30%가 지방간 환자**, 그중 **약 10~20%는 염증까지 겹친 지방간염** 환자
- **현재는 비알코올성 지방간 환자가 알코올성 지방간 환자를 앞지른 상태**

### 6) 간 건강관리 ★
- '무조건 쉬어라'는 잘못 — **일상생활은 가능**하나 **격렬한 운동·노동은 피해야 함**
- 식습관: **저탄수화물, 저과당, 저칼로리** 음식을 **소량으로 즐겁게**
- 절주 기준: **일주일에 소주 남자 2병 이내, 여자 1병 이내**
- 음주 후에는 **간이 쉴 수 있도록 2~3일 휴식**, **폭음 금지**

### 7) 진단
- 지방간이 있으면 **간 수치**가 정상보다 조금 올라가 있는 경우가 흔하며, **정상의 10배 이상** 올라가는 경우도 존재
- ★ **가장 좋은 진단법은 혈액검사보다 '복부 초음파 검사'**
  → 간에 지방이 끼면 **색이 하얗게** 보임

### 8) 갱년기 여성과 다이어트
- **폐경기 여성**은 폐경 전보다 지방간 환자 수가 훨씬 증가
- **초경이 빠른 여성**은 성인이 되어 지방간 질환이 많이 발생한다는 보고
- 폐경 후 **여성 호르몬 부족**이 오래 지속되면 지방간염에 의한 **섬유화·염증 정도를 악화**
- ⚠ **갑자기 살을 많이 빼면 간 손상으로 지방간이 악화**
  → **자기 체중의 10%를 6개월에 걸쳐 천천히** 감량해야 함

## 27강. 신장 질환의 위기

### 1) 신장(콩팥) 질환의 기본
- 대부분의 만성 신장질환은 **콩팥 두 개가 모두 망가짐**
  → "하나만 떼어내도 괜찮지 않을까"는 잘못된 생각인 경우가 많음
- 단, **만성 신우신염, 한쪽에 국한된 신장암** 등은 하나만 떼어내도 다른 하나가 기능
- **건강한 신장 공여자**가 하나를 기증하는 것도 괜찮음

### 2) 만성 신장질환 ★
- 몇 개월~몇 년에 걸쳐 신장 기능이 **단계적으로 망가지는 병**
- **3대 원인 질환: 당뇨병, 고혈압, 만성 신염**
- 과거 '만성 신부전'으로 불렸으나, **초·중기에는 기능이 많이 남아 있어 '신부전'이라 부르는 것이 부적절**하여 **만성 신장질환**으로 지칭
- **진단 기준 ★**
 ① **3개월 이상** 신장 기능이 **정상의 반 이하**로 떨어져 있으면 무조건 만성 신장병
 ② 기능이 반 이상 떨어지지 않았어도 **혈뇨·단백뇨** 등 신장 손상 징후가 있으면 진단
- 기능 저하 시: **노폐물 축적, 전해질·체액 조절 실패, 빈혈, 뼈 약화, 혈압 상승**
- ⚠ **천천히 진행되어 증세가 명확하지 않아** 병원에 잘 가지 않게 되고 **진단이 늦어짐**

### 3) 급성 vs 만성 ★★
| 구분 | 급성 신장질환 | 만성 신장질환 |
|---|---|---|
| 속도 | **일 단위, 시간 단위**로 급격히 악화 | **월 단위, 년 단위**로 천천히 |
| 증세 | **명확**(오줌이 안 나옴 등) | **애매함** |
| 위험 | 심하면 **사망**에 이르기도 | 말기 신부전 → **투석·이식** |
| 예후 | **관리 잘하면 완전히 회복 가능** | 초기가 아니면 회복 어려움 |

### 4) 급성 신부전의 증상·원인 ★
**증상**
- **핍뇨**: 하루 소변량 **400cc 미만**
- **무뇨**: 하루 소변량 **100cc 미만**
- → 수분이 고여 **부종**, 심하면 **폐부종 → 심한 호흡곤란**

**원인 3구분**
| 구분 | 내용 | 회복 |
|---|---|---|
| **신장 전 단계** | 신장으로 가는 **혈류 감소**(탈수 등) | **탈수 교정 시 바로 회복** |
| **신장 자체** | 심한 탈수·출혈로 **혈압이 현저히 떨어질 때**, 혈압이 장기간 떨어질 때, **신장의 허혈성 변화** | 구조적 변화이므로 **원인을 제거해도 바로 좋아지지 않음** |
| **신장 후 단계** | 오줌이 만들어진 후 **배출로가 막힘** | **뚫어주면 바로 회복** |
- 대부분 급성 신부전은 **신장 자체의 문제**를 말함

### 5) 당뇨병 환자에게 투석이 많은 이유 ★
- 식생활 변화와 고령화로 **당뇨 인구가 폭발적으로 증가**
- **당뇨병 환자 3~4명 중 1명**에서 만성 신장병 발생
- 이유: 고혈당에 장기간 노출된 혈관이 서서히 망가지는데,
  **신장 자체가 모세혈관 뭉치**이므로 고혈당에 의한 혈관 변화가 신장에도 나타남

### 6) 만성 신장질환의 증상
- **소변에 거품이 많이 발생**
- **소변 색깔의 변화**
- **밤에 자다가 소변을 보러 감** → 단, 노화·**전립선 비대증**도 원인이므로 **전립선 비대증 검사**도 함께

### 7) 치료 — 단계별 주안점 ★
- **가장 먼저: 원인 질환 치료** (혈압 높으면 혈압 엄격 관리, 혈당 높으면 혈당 관리)
- **초기**: 만성 신장병의 **진행 억제**에 주안점
- **중기**: **합병증 예방**에 주력
- **말기**: **투석 또는 이식** 관리

### 8) 투석 환자 주의사항 ★★
- 보통 **주 3회** 병원에서 투석, **1회 4시간**
- 투석 후 체중을 재고 **2~3일 후** 다시 측정 → 그 사이 몸에 쌓인 수분량 확인
- **체중 증가는 2~3kg를 넘지 않도록 권유** (많이 늘면 **폐부종 → 심한 호흡곤란**)
- 체중 관리를 위해 **싱겁게 먹고 물을 많이 먹지 말 것**
- **고칼륨혈증** 예방 → **야채·과일 섭취 줄이기**
- **고인산혈증** 예방 → **견과류, 유제품, 콜라** 적게 먹기

## 28강. 위태로운 생활의 증거, 위궤양

### 1) 정의 ★
- 위벽은 **다섯 층**으로 나뉨
- **위궤양** = 표면층인 **점막층을 넘어서 점막근층 이상의 깊은 층까지 손상이 진행된 상태**
- 정상 위점막은 강력한 위산으로부터 자신을 보호하기 위해 **단단한 결합**을 하고 지속적으로 **뮤신**을 분비
- **스트레스** 같은 강력한 자극으로 위점막이 결손될 수 있음

### 2) 증상 ★
- 위장 점막을 느끼는 **내장감각신경**은 **예리한 통증에 반응하지 않음**
  → 위궤양이 생겨도 **극심한 통증이 없는 경우가 많음**
  → 단순히 윗배가 살살 아프거나, 속이 아프거나, 소화가 안 되는 정도
- 혈관이 노출되면 출혈 → **토혈(피 섞인 구토)** 또는 **혈변**
- ⚠ 궤양이 심한데 통증이 별로 없거나, 궤양은 작은데 예리하게 심한 통증을 느끼는 경우도 있음
  → **통증의 크고 작음과 상관없이 증상이 있으면 검사**

### 3) 위 내시경 ★
- 내시경을 자주 받는다고 **위점막이 파괴되거나 위궤양이 심화되지는 않음**
- **40대 이상**: 위장 증상이 있든 없든 **2년에 한 번**
- **위장에 이상이 있으면 1년에 한 번** 검사 추천

### 4) 스트레스와 위장
- 스트레스 → **교감신경 항진** → **위장 운동과 세포 재생이 상당히 저하** → 위장 증상 악화

### 5) 헬리코박터균 ★★
- **위염, 위궤양, 더 나아가 위암과 관련**
- 그러나 감염이 있다고 모든 질병이 나타나지는 않으며 **항생제 내성**과도 관련이 있어 **모든 경우를 치료하지는 않음** → **증상이 있는 부분에 대해 치료 권장**
- **감염 경로**: **구강 대 구강**, 또는 **대변으로 나온 균이 손에 의해** 감염
  → **술잔 돌리기**, 큰 그릇에서 **국물을 함께 떠먹는 것**도 감염 위험
- ⚠ 헬리코박터균은 **치약이 아닌 항생제를 통해서만 죽일 수 있음**

### 6) 위궤양과 위암
- **위궤양이 오래됐다고 위암이 되지는 않음**
- 그러나 위궤양이 의심되어 내시경 조직검사를 했을 때 **나중에 암으로 판명되는 경우가 종종 있음**

### 7) 응급 상황 ★
- **출혈**: 많이 하면 **쇼크로 생명을 잃을 수 있음**
  → **토혈이나 혈변**이 있으면 즉시 병원 → 위장내시경으로 출혈 확인, 필요 시 **수혈·내시경 지혈**
- **천공**: 궤양이 깊어져 **위장벽이 뚫려 구멍이 나는 것** → 즉시 병원, **수술적 치료** 필요할 수 있음

### 8) 예방과 치료
- 평소 **과음과 스트레스를 줄이고 규칙적인 식습관**
- **유산균 음료는 위궤양 치료에 큰 도움이 되지 않음**
- **위산 분비 억제제**를 **한 달 정도 복용**하면 치료가 매우 잘 된다는 보고

## 29강. 남몰래 흘리는 눈물, 치질

### 1) 치질의 종류 ★★
> **치핵 + 치루 + 치열 + 나머지 항문질환 = 치질**

| 종류 | 내용 |
|---|---|
| **치핵** | 항문 조직이 **항문 밖으로 빠진** 질환 |
| **치열** | 굳은 대변 등이 나오다가 **항문이 찢어져서** 생긴 질환 |
| **치루** | **항문샘이 곪아** 항문 주위 농양이 되었다가 터져, 항문선 안쪽과 항문 바깥쪽 피부 사이에 **터널**이 생겨 바깥 구멍으로 분비물이 나오는 현상 |

- 항문은 다 똑같이 생겼으니 **창피해할 일이 아니며, 방치하면 더 큰 문제**가 됨

### 2) 치핵 ★
- 초기에는 항문은 빠지지 않고 **출혈만** 발생하는 경우가 많음
- 진행되면 **항문 밖으로 빠짐**
- 일반적으로 **통증은 없으나**, 항문 밖에 생긴 **외치핵은 통증**이 있을 수 있음
- **치핵의 90% 이상은 내치핵**

**치핵의 4단계 ★★**
| 도 | 상태 |
|---|---|
| **1도** | 밖으로 빠지지 않고 **출혈만** |
| **2도** | 용변 시 빠지지만 **끝나면 저절로 들어감** |
| **3도** | 용변 시 빠져서 **손으로 밀어야 들어감** |
| **4도** | 보통 때에도 빠져 있고 **밀어 넣어도 안 들어감** |

### 3) 일상과 치질
- **변비**면 힘을 오래 주게 되어 **점막지지인대가 늘어나** 치질이 될 수 있음
- **변이 굵으면** 치질 확률이 높아짐

### 4) 치질을 막는 생활습관 ★
- **용변은 3분 내에** 끝내기
- 육류는 줄이고 **식물성 섬유**를 많이 섭취
- ⚠ 치질 환자가 **자전거, 등산, 골프, 스쿼트, 씨름, 야구 포수처럼 엉거주춤한 자세**의 운동을 하면 **출혈 가능**
- 의자에 오래 앉으면 항문이 빠져 나오기 쉬움 → **1시간에 1번 정도 일어나거나 케겔운동**(항문을 조여 배 위로 당기기)

### 5) 알아둘 것 ★
- 대변 후 휴지로 **세게 닦는다고 치질에 걸리지는 않음**. 다만 민감한 부위이므로 **비데 사용 추천**, 없으면 **물휴지**
- **혈변의 3~4%는 대장암** → 사람들은 치질을 암과 연관지어 걱정하나
  **치질을 오래 방치한다고 암이 되지는 않음**
- ⚠ **단, 치루는 염증성 질환이므로 약 10년 정도 지나면 암이 될 수도 있음**

## 30강. 잠 못 이루는 고통, 탈모

### 1) 생활 속 탈모 상식 ★
- **머리를 자주 감으면 탈모?** → 자주 감으면 **모발 손상**이 발생할 수 있으나, **두피 타입에 따라 다름**
  - **건성**: **이틀에 한 번**
  - **지성**: **매일**
  - 자주 감아야 한다면 **한 번은 샴푸, 나머지는 물로**
- **원형탈모**: 유병률 **1%(백 명 중 한 명)**로 흔한 편
  → 대체로 **예후가 좋아 그대로 두면 다시 회복**
  → 일부는 **전두탈모로 진행** 가능
  → **스트레스와 자가면역질환**이 원인이므로 **자꾸 재발하면 다른 신체 기능 이상 여부 확인**
- **여성도 대머리가 될 수 있음** — 머리가 다 빠지는 경우는 흔치 않으나 **호르몬 이상 등 질병**에 의한 탈모는 가능

### 2) 탈모의 원인
**스트레스, 유전, 잦은 염색·파마로 인한 두피 손상, 무리한 다이어트, 수술 후유증, 약물 복용, 갑상선 질환**

### 3) 탈모의 종류 ★★
| 종류 | 특징 |
|---|---|
| **O자형 탈모** | 대표적. **발모벽**(머리를 뽑는 습관)으로 인한 탈모일 수 있음 → **스트레스 원인 파악과 정서 안정**이 중요 |
| **M자형 탈모** | 나이가 들수록 심해짐. **전형적인 남성형 탈모** → 유전적으로 **전두탈모**가 있는지 확인 |
| **정수리 탈모** | **왕관형 탈모**라고도 함. **전형적인 여성형 탈모** → 정수리 모발이 빠지면 **빠른 진단** 필요 |
| **복합형 탈모** | 남성형 탈모의 경우 **옆머리만 남으면서 앞부분이 빠지는** 형태로 진행 가능 → **앞머리가 다 빠지기 전에 관리** |

### 4) 해법 ★
- **초기에는 완치 가능** → **골든타임인 초기에 잡는 것**이 중요
- **젊은 연령층의 탈모는 갑상선 관련 검사가 필수**
- **난소·자궁 질환**이 있어도 탈모가 나타날 수 있음
  → 난소질환의 경우 **다모증/빈모증** 발생

**치료 (종류에 따라 다름)**
- **원형탈모** → **탈모 부위에 직접 주사** 방식. **효과가 좋고 의료보험 적용 가능**
- **남성형 탈모** → **약물 복용**
- **폐경 이후 탈모** → **약 복용**
- **모발이식** → **확실한 방법 중 하나이나 사후관리가 중요**

- 자신이 가지고 있을지 모를 **내부 질환에 대비해 진단**을 받고,
  **술·담배·잦은 파마는 자제**

## PART 3 · 알아두면 건강해지는 내 몸 이야기 (31~45강)

## 31강. 자궁경부암 주의하기

### 1) 자궁경부암이란 ★
- **질에 연결된 자궁경부에 발생하는 악성종양**
- **2013년 국내 암 통계 기준**
  - 여성에게 생기는 **전체 암 중 7위**, **여성 생식기암 중 2위**
  - 매년 약 **3,500명 진단**, 그중 약 **900명 사망** → 사망률이 매우 높음
- ⚠ 다른 암이 주로 **50대 이후** 발병하는 것과 달리 **30대 이후부터 발병률이 증가**
- **자각증상이 없어** 검진하지 않으면 알 수 없음 → 증상이 있어 병원을 찾을 때는 이미 많이 퍼진 경우가 많아 사망률이 높음

### 2) 원인 ★
- **주된 원인: 인유두종 바이러스(HPV) 감염** — **자궁경부암의 99%**가 HPV 감염에 의한 것
- 위험요인: **조기 성 경험자, 성교 대상자가 많은 여성, 아이를 많이 낳은 여성**
- 그 외: **흡연, 면역 기능 저하, 경구피임약 장기 복용**
  → 피임약을 **수개월~1~2년** 복용하는 것은 큰 문제 없으나, **장기 복용은 위험요인**

### 3) 인유두종 바이러스(HPV) ★★
- **파필로마 바이러스과에 속하는 DNA 바이러스**
- 유발 질환: **자궁경부암, 항문암, 외음부암, 두경부암**
- **종류는 100여 가지**
  - **피부친화형 약 80여 가지** → 손·발 등 피부에 **사마귀** 유발
  - **점막친화형 약 40여 가지** → 이 중 **고위험군이 자궁경부암** 유발
- **대표 고위험군: 16번, 18번형**
  → 우리나라 여성은 **52번, 58번**형도 많이 감염되어 있는 상태
- 감염 후 **1~2년이 지나면 대부분 자연 소멸**
  → 그러나 **전체 여성의 3~10%는 지속 감염** → 수년~수십 년 후 암 유발

### 4) 검사 ★
- 기본 선별검사 = **자궁경부 세포진 검사(팝스미어)**
  → **질경**을 통해 **채취솔**로 자궁경부와 질의 세포를 얻어 **현미경 관찰**
- 이상 발견 시 → **인유두종 바이러스 검사** → 조직검사에서 확진되면 **병기 설정을 위한 정밀검사**
- ⚠ 정기검진에서 이상이 없다가 갑자기 판정받는 사례가 있는데, **검사 방법의 문제가 아니라 세포진 검사의 민감도가 100%가 아니기 때문**
  → **대한산부인과학회는 1년에 한 번 정기검사를 권장**

### 5) 치료 ★
- **자궁 적출**은 일반적으로 **병기 1기나 2기**에 고려
- **2기 후반부터는 수술보다 항암 화학 요법과 방사선 치료**
- **미혼 여성**은 임신을 고려해 **원추절제술** 같은 최소한의 수술 후 주기적 경과 관찰

### 6) 예방접종 ★★
- **우리나라: 2016년 6월부터 무료 예방접종 사업**
  → **만 12세 여성에게 6개월 간격으로 2회** 접종
  → 국가 예방접종 **시행 첫해 접종률은 50% 미만** (영국·호주는 **약 90%**)
- **무료 접종 외의 판매는 2007년부터** → **9~26세 여성에게 3회 접종** 권장
- **가장 유리한 시점: HPV에 노출되기 전, 즉 성 접촉을 시작하기 전**
- **26~44세 여성도 어느 정도 효과**는 있으나, **청소년기보다 항체 형성률이 낮으므로 빨리 맞는 것이 좋음**

**백신의 종류 ★**
| 백신 | 예방 바이러스 | 예방 효과 |
|---|---|---|
| **2가 백신** | **16, 18번** | **약 70%** |
| **4가 백신** | **6, 11, 16, 18번** (6·11번은 **생식기 사마귀** 예방) | **약 70%** |
| **9가 백신** | (최근 출시) | **약 90%** |

### 7) 궁금증
- **예방**: ① **예방접종**이 가장 중요 ② 100% 예방은 아니므로 **정기 검사** ③ 흡연·면역기능 저하·경구피임약 등 **위험요인 줄이기** ④ 적당한 운동과 수면으로 **면역력 높이기**
  → 자궁경부암은 **예방과 조기진단이 가능**한 암
- **불임**: 자궁경부암 자체와 불임의 연관 연구는 없음. 단, 진행된 상태에서 **항암 화학 요법·방사선 치료** 시 불임이 될 수 있음
- **유전**: **유전적 이유만으로 생긴 자궁경부암은 아직 없음**
- **성병 여부**: 자궁경부암은 **성병이 아님**. 다만 성관계를 통해 원인 바이러스가 감염될 수 있어 걸리는 것
- **남성의 백신 접종도 도움**
  → 남성의 **항문암, 생식기 사마귀** 예방 + 남성의 HPV 감염 감소 → **여성 감염 예방 → 전체 감염률 감소**

## 32강. 나도 힘들고 다른 사람도 힘든 코골이

### 1) 위험성 ★
- 가장 문제가 되는 것은 **숨을 안 쉬어서 뇌에 산소 공급이 잘 안 되는 것**
- → 낮에 **수면장애로 졸림**, 나아가 **심혈관계 질환**까지 유발

### 2) 원인 — 상기도 협소 ★
- 근본 원인은 **입을 벌렸을 때 보이는 뒤쪽 공간인 '상기도'가 좁아지는 것**
- 해당되는 사람
  - **턱 발달이 안 된 사람**
  - **구조적으로 목 안이 좁아 잘 안 보이는 사람**
  - **비만인 사람**
  - **소아**: **편도·아데노이드 비대**
- **피로**: 오래 피곤하면 **몸 전체 근육에 젖산이 쌓여** 근력 저하 → 상기도를 유지하는 근력이 느슨해져 좁아짐
- **알코올**: ① 근육 이완 → 상기도를 잡아주는 근력 약화 → 공간 수축
  ② **주변 혈관 확장** → 부어서 상기도가 좁아짐

### 3) 소리와 건강
- 소리가 크다 = 코를 고는 과정에서 **압박과 힘이 강하게 작용**
- = **많이 막힌다** = **산소포화도가 떨어진다**고 예상 가능
- ⚠ 코골이 소리 자체에 깨는 것이 아니라 **숨을 쉬기 위해 깰 때 소리도 함께 듣게 되는 것**
- 코 고는 소리로 상태를 진단하는 것은 가정은 되나 **확실한 데이터는 아직 없음**

### 4) 예방 ★
- **비강 확장기, 코골이 밴드, 입 벌림 방지 마스크** 등은 코를 고는 공간이 **입 안쪽 상기도**인데
  **외부에서 조작하는 것들이라 오히려 숨쉬기가 어려워져 더 위험할 수 있음**
- **똑바로 누워 자면** 기도가 눌리고 **복압이 늘어** 숨쉬기가 어려워져 코골이 유발
  → **가급적 옆으로 자기**
  → 한쪽으로만 오래 자면 척추에 무리 → **좌우로 자세를 바꿔가며** 자기
- **코골이 베개**는 의학적으로 큰 영향은 없음
  → 베개보다 중요한 것은 **머리 위치를 약간 높게** 하고 **옆으로 자서 기도를 충분히 유지**하는 것

### 5) 궁금증
- **코의 크기와는 상관없음** (문제는 코 안쪽의 상기도 공간)
- **노화**: 운동력 저하, 기도 탄력 저하 등 **전신 기능 저하**로 심해질 수 있음
- **비만**: ① 목 안쪽에도 살이 쪄서 **상기도 주변에 지방이 침착**되어 좁아짐
  ② **복부 비만** → 수면 시 눌려 **횡격막을 압박** → 호흡이 자유롭지 않아 억지로 강한 호흡 → **무호흡증·코골이** 발생

---

## 33강. 조용한 암살자, 대장암

### 1) 한국인의 대장암 ★★
- **세계보건기구(WHO) 산하 국제암연구소 2018년 기준**
  → 인구 **10만 명당 대장암 발병률 45명**
  → 조사 대상 **184개국 중 가장 높음(1위)**

### 2) 증가 이유
- **적색육·육류 섭취량 증가**와 관련성이 매우 높음
- **음주, 흡연, 비만 인구 증가, 스트레스, 야간 근무, 각종 만성 질환 노출**
- **유전**: 현재 연구상 **5~15%**가 유전
  → 그중 **가족성 용종증**: 대장 안에 **용종(작은 혹)**이 자라며 **어려서부터 나타나고 나중에 대장암으로 바로 발달**

### 3) 대장내시경과 대안 검사 ★
- **분변잠혈검사(대변 잠혈 검사)**
  - 용종이나 암으로 궤양이 생기면 **눈에 보이지 않는 출혈**이 있을 수 있음
  - **만 50세가 넘으면 1년에 한 번** 시행
  - 피가 발견된 사람에게 **대장내시경을 권할 수 있게 하는 1차 선별검사**

### 4) 대변으로 보는 대장암 신호 ★★
| 신호 | 의미 |
|---|---|
| 변이 **연필처럼, 국수가락처럼 가늘어짐** | 대장 안에 덩어리가 자라 변이 가늘어지는 것 의심 (정상 대변 굵기 = **몽키 바나나 정도**) |
| 변이 **검은색** | **상부위장(위·십이지장) 궤양 출혈** — 피가 소화되면서 검게 나옴 |
| 변을 못 참을 정도로 **변의**를 느끼는데 **막상 변은 안 나옴** | **에스자결장·직장** 쪽에 덩어리가 자라 착각을 일으킴 |
| **지독한 냄새, 방귀 증가** | 대장암이 많이 진행되어 조직이 썩는 경우 |
| **변이 시작될 때** 붉은 피 | **항문질환(치질)**인 경우가 많음 |
| **변을 다 본 마지막 부분**에 피가 묻음 | 항문보다 **위쪽 출혈** → **에스자결장 암** 가능성 |

### 5) 대장의 구조와 증상 ★
- 구조: **맹장 → 상행결장(우측) → 횡행결장 → 하행결장 → 에스결장(에스자결장) → 직장**
- **오른쪽(상행결장)에 암이 생기면 증상이 거의 없음** ('체했나?' 정도)
- **왼쪽으로 갈수록** 변에 피가 묻고, 변이 가늘어지고, 변비가 심해지는 등 증상이 나타남
- → **항문과 가까울수록 증상이 많아짐**
- ⚠ 3기·4기까지 모르는 경우도 있음 — **몸이 적응**하기 때문
  대부분의 암은 **천천히 자라다가 마지막 순간에 빨리 퍼짐**

### 6) 수술 ★
- **우측 결장절제술**: 오른쪽 상행결장 암 → 오른쪽 제거
  → **장루**를 만들어 감압, 항문을 유지하면서 장루를 통해 분비물을 배출
  → 최근에는 **삶의 질을 위해 항문을 보존하며 자연 배변하는 수술법**도 소개되고 있음
- **좌측 결장절제술**: **횡행결장과 하부결장·직장부를 연결(문합)**하여
  외부로 변을 내보내지 않고 **자연적으로 배변**할 수 있게 함

### 7) 예방 식습관 ★
- **섬유질(섬유소)** 섭취 → 대변이 대장벽에 오래 머물지 않고 바로 배출 (변비 예방과 같은 원리)
- **육류 섭취를 줄이라는 것이 아님** → 육류로 면역력·체력을 키우되 **섬유소를 신경 써서 많이** 먹기
- **물을 많이 마셔** 장운동을 원활히 하고 변비 예방
- **과도한 음주**는 **장 점막을 자극**해 대장암을 발생시킬 수 있음
- ⚠ **적색육이 무조건 나쁜 것이 아니라 '가공육'이 문제**
  → **소시지·햄** 등 가공육의 **보존제가 발암물질**로 밝혀짐
  → 적게 먹거나, 먹어야 한다면 **물에 데쳐서 표면의 보존제·색소를 빼내기**

### 8) '완치'보다 '근치'
- 대장암은 **고혈압·당뇨처럼 근치에 가깝게 조절하며 살 수 있음**
- 인간의 수명이 늘며 암을 피할 수 없는 시대 → **검버섯·주름처럼 암을 받아들이는 태도**
- **조기 발견**함으로써 이후 더 큰 문제를 예방할 수 있다고 생각하는 것이 좋음

---

## 34강. 콤플렉스를 만드는 색소질환

### 1) 색소질환의 종류 ★★
| 질환 | 모양·특징 | 주된 원인 |
|---|---|---|
| **기미** | 납작해서 피부결과 똑같은데 **넓은 판상 형태** | **호르몬의 영향**을 가장 많이 받음 |
| **오타양모반** | 동글동글하게 **잿빛 모양**으로 **얼굴 양쪽**에 생기는 점 종류 | – |
| **주근깨** | 점 같은 **다이아몬드(마름모꼴)** 모양, **어렸을 때 발생** | **유전적 요인**이 가장 큼 |
| **검버섯(흑자)** | 여러 형태 — 솟은 것, 납작한 것, 진한 것, 연한 것. **40대부터 급증** | **노화**가 가장 큰 원인, **자외선에 의한 광노화**로도 많이 생성 |

- 색소질환 전체의 가장 중요한 원인 중 하나는 **자외선**
- 검버섯은 **어떤 종류의 흑자냐에 따라 치료 방법과 횟수가 달라지므로 진단이 중요**

### 2) 피부색과 색소질환 ★
- **피부가 하얀 사람**: 멜라닌 색소가 적어 **자외선 공격을 직접적으로 받음**
  → **색소도 더 많이 생기고, 주름도 더 많이 생기며, 피부암 확률도 커질 수 있음**
- **피부가 검은 편인 사람**: 멜라닌 세포 활동량이 크므로 **상처가 아무는 과정에서 햇빛을 받으면 더 까맣게 되는 경향**

### 3) 치료
- 기본은 **레이저 치료**, **색소의 깊이에 따라 방식이 달라짐**
- **진한 색소로 튀어나온 것 → 치료가 간단**
- **연한 색소 → 깊이 들어가 있는 경우가 많아 치료가 어려움**
- **기미**는 **표면성 기미와 진피성 기미**가 있어 종류에 따라 치료법이 다름
- 나이에 의한 것은 어쩔 수 없으나 **햇빛에 의한 것은 어느 정도 막을 수 있음** → 자외선 조심

### 4) 궁금증 ★
- ⚠ **검버섯이 갑자기 비(非)노출 부위인 등에 많이 생기면 위나 장에 암이 생겼을 가능성** → **위 내시경** 진행 권장
- **기미와 호르몬**: 기미로 모든 사람에게 호르몬 이상이 있다고 단정할 수는 없으나, **임신·출산·경구피임약 복용 시 기미가 생기는 것**으로 보아 호르몬 변화가 있다고 볼 수 있음
- **대기오염과 검버섯**: **독일 뒤셀도르프 라이프니츠 환경의학 연구소** 연구 — **대기오염이 많을수록 검버섯이 더 많이 생김**
  → 아직 겉으로 표현되지 않은 검버섯이 나이가 들며 나오는데 **자외선이 이 발현을 앞당길 수 있음**
  → 피부과의 **피부측정기**로 피부 안쪽 멜라닌 세포를 관찰 가능 → 많으면 더 신경 써서 예방

## 35강. 바람만 불어도 힘든 통풍

### 1) 통풍이란 ★
- **잘 먹고, 술 많이 마시고, 비만인 사람**에게 잘 생김
  → 생활 수준이 높아지며 우리나라도 환자 증가 추세
- **원인**: **요산**이 몸속·관절·신장에 많이 쌓이면서 **염증과 통증**을 일으키는 것
- **요산** = 음식(특히 육류·등푸른 생선 등)에 많이 함유된 **퓨린**이 몸에 들어와 **에너지로 사용된 후 나오는 찌꺼기**

### 2) 진짜 무서운 것 = 합병증 ★★
> 통풍의 통증은 **빙산의 일각**에 지나지 않음
- **만성 신부전, 고혈압, 고지혈증, 당뇨병, 뇌졸중, 심근경색증** 등 **생명에 치명적인 질병들**
- → 통풍은 관절이 아픈 병이 아니라 **전신질환, 대사성 전신질환**으로 봐야 함

### 3) 발생 부위·기준 ★★
- 요산이 가장 많이 쌓이는 곳: **엄지발가락, 발등, 발목**
  → **발가락이 아프면 퇴행성 관절염이나 통풍을 의심**
- **요산 농도 7.0mg/dL 이상**인 상태에서 결정을 이루면 통풍 발생
- **전체 통풍 환자의 90%**가 **엄지발가락 뿌리 부분**에 염증과 통증
  → 다음으로 **발등, 발목**, **발뒤꿈치**
  → 치료를 제대로 안 하면 **무릎**까지, 나중에는 **어깨·팔꿈치·손**까지 올 수 있음

### 4) 무증상 고요산혈증 ★
- 통풍은 아닌데 검사에서 요산 수치가 **7 이상**인 경우
- 무증상 고요산혈증 환자 중 **실제 통풍 환자는 약 17%**, **나머지 83%는 일시적 상승**
- 그러나 **요산 농도가 높을수록 통풍으로 갈 가능성이 높음**
- 다이어트·운동으로 **체중 감량**, **음주 감소** → 요산 수치 하락 가능

### 5) 진행 시기 ★★
- **무증상 고요산혈증이 10년~40년쯤 지나서 첫 번째 통풍 발작**이 발생
- 대개 **청소년 시기가 지나면서부터 요산이 쌓이기 시작**
- → 통풍은 보통 **40~50대**에 잘 생김
- → 요산이 평소 높았던 사람은 **20대 후반~30대**에도 발생 가능

**간헐기 통풍**
- 요산 수치가 높고 술을 많이 먹고 뚱뚱한 사람은 **20대에도** 발생
- 발작이 왔다가 **약 일주일쯤 지나면 없어지는 것**
- 치료하지 않으면 **길어야 1~2년 후에 다시 발작**

**만성 결절성 통풍**
- 치료하지 않으면 진행
- **콩팥에 요산이 많이 쌓여 콩팥 기능이 망가지기 시작**
- **관절이 녹아 나와 변형이 생겨 보행 장애** 발생
- **고혈압, 당뇨병, 고지혈증, 뇌졸중, 심장병** 등 치명적 합병증 위험 상승

### 6) 치료 3단계 ★★
① **급성 발작기**: 염증과 통증을 가라앉히는 약물치료
  → **소염진통제, 스테로이드, 항스테로이드** 등
② **요산 낮추기**: **요산형성억제제 + 요산배설촉진제**
③ **합병증 치료 병행**: 고지혈증, 콩팥 등

### 7) 복약 순응도 문제 ★
- 치료가 잘 되어 요산이 떨어지면 "다 나았나 보다" 하고 약을 끊음
- **전 세계 공통** — 역학조사상 **1년 이내에 50%의 환자가 약을 먹지 않음**
- → 그러다 **1~2년이 지나 그중 90%는 다시 발작**

### 8) 음식 ★
**나쁜 음식**
- **맥주** (효모에 퓨린 성분이 많음)
- **소고기, 돼지고기, 등푸른 생선, 갑각류**

**좋은 음식**
- **채식**을 하는 것이 가장 좋음
- 단백질을 섭취한다면 **1인분만**
- **달걀, 메추리알, 우유, 치즈**
- **쌀, 보리, 감자**

## 36강. 떨어지지 않는 무좀의 침투

### 1) 특징 ★
- 무좀은 **피부의 각질을 매우 좋아하는 균(곰팡이)**에 의해 생김
- → **발에만 생기는 게 아니라 각질이 있는 머리끝부터 발끝까지 어디에나** 생길 수 있음
- 곰팡이는 **덥고 습한 데서 잘 자람** → **장마철**에 환자 급증

### 2) 발 무좀의 종류 ★★
| 종류 | 특징 |
|---|---|
| **발톱 무좀** | 발톱이 **두꺼워지고 거뭇거뭇해지며 부슬부슬 부서짐** |
| **지간형 무좀** | **발가락 사이가 하얗게 되고 많이 가려움** |
| **수포형 무좀** | **수포(물집)**가 생김 |
| **각화형 무좀** | **발뒤꿈치가 두꺼워짐**. 각질연화제 등 약물치료에 저항하는 매우 두꺼운 각질이면 무좀 의심 |

- **진단**: 병원에서 **각질을 긁어 균 검사**를 하면 바로 진단이 나옴

### 3) 부위별 무좀 ★
**머리 무좀**
- **특히 어린 아이들에게 많음**
- **토끼, 고양이를 만지고 온 뒤 머리카락이 빠진다**고 하면 의심
- 빨리 치료해야 하며 **먹는 약을 먹어야 효과** 있음
- **방치하면 원형탈모** 발생

**몸 무좀**
- **여름이 되면 심해지는 얼룩덜룩해지는 현상**
- **백반증**은 좀 더 하얗고, **몸 무좀은 좀 덜 하얀** 차이
- **가슴이 매우 큰 경우**에도 발생 가능성

**얼굴 무좀**
- **동그란 모양**으로 생기며 겉쪽에 각질이 일어남. 가려운 경우도, 가렵지 않은 경우도 있음
- ⚠ **습진인 줄 알고 습진약을 바르면 무좀이 더 자람**
- **여자보다 남자에게 더 많음**
- 스스로 처방한다며 습진약을 발라 악화시키는 경우가 빈번
- **예방**: 땀이 잘 차는 꽉 끼는 옷보다 **트렁크 팬티**, **통풍이 잘 되는 바지** 착용

### 4) 상식 ★
- ⚠ **빙초산에 발 담그기**: 각질층이 녹아 무좀균이 죽기는 하나 **화상이라는 더 큰 문제**가 발생
- **사과 식초 정도로는 무좀균이 죽지 않음**
- **통풍이 잘 되는 샌들**이 좋음
- **습기제거제를 신발 안에** 넣으면 예방에 도움
- **무좀은 감기와 같은 계절병**
  → 고질병·불치병이 아니라 **완치가 되어도 다시 걸릴 확률이 있는 것**

## 37강. 어느새 생긴다, 뱃살

### 1) 뱃살과 호르몬 ★
- 호르몬의 중요한 역할 중 하나는 **몸의 살을 몸에 맞는 부위로 보내고 배로 가는 것을 막는 것**
- 나이가 들수록 **호르몬이 줄어들어 살이 배로 감**
- 나이가 들면 **기초대사량**이 줄어들어 조금 더 줄여 먹지 않으면 에너지가 남음
  → 남는 에너지가 호르몬 부족으로 **모두 배에 차곡차곡 쌓임**

### 2) 피하지방 vs 내장지방 ★
- **피하지방**: 앉은 채로 배를 만졌을 때 **만져지는 부위**
  → **여성 잡지 두께 이하**로 만져지면 피하지방이 매우 없는 상태 (대부분은 그 이상)
- **내장지방**: **힘을 줘도 만질 수 없는 안쪽에 있으면서 허리를 굵게 만드는 부분**

### 3) 운동 효과 ★
- **어느 부분의 운동을 한다고 그 부분의 살만 뺄 수 있는 방법은 없음**
- 윗몸일으키기로 허리가 가늘어지는 것은
  → **늘어져 있던 배 근육에 힘이 생기고 굵어지면서 앞의 살들을 잡아주기 때문**
  → 마치 **벨트를 두른 것처럼** 뱃살이 들어가 보이는 효과

### 4) 여성과 뱃살 ★
- "여자는 배가 나와도 피하지방이 많아 남자만큼 위험하지 않다"는 말은 **폐경 전까지만 해당**
- **폐경 후에는 여성의 뱃살도 내장지방이 많아져 남자 이상으로 위험**

### 5) 걷기 vs 달리기
- 둘 다 **유산소 운동**이므로 모두 뱃살에 도움
- **걷기**는 편해서 오래 할 수 있고, **달리기**는 힘들어 오래 못 함
- **젊고 운동에 익숙한 사람** → 달리기가 좋음
- **운동을 막 시작한 사람, 비만인 사람, 관리 안 되는 만성병 환자** → 갑자기 달리면 문제 발생
  → **걷기부터 시작해 시간을 늘리고, 심심해지면 그때 달리기 시작**

### 6) 뱃살 측정법 ★
① 다리를 **어깨 너비**로 벌리기
② 양 팔을 **살짝 벌려주기**
③ **배꼽을 중심**으로 한 뱃살 둘레를 **줄자**로 측정
- 측정한 허리둘레가 기준치를 넘으면 **복부비만(내장비만)**으로 판단
  (우리나라 복부비만 기준: **남성 90cm, 여성 85cm** 이상)

### 7) 뱃살의 종류 ★★
| 위험도 | 형태 | 관리법 |
|---|---|---|
| **저위험군** | 아랫부분만 툭 튀어나옴 | 대부분 **피하지방**이며 몸에 해롭지 않음 |
| **중간위험군** | **배꼽 아래가 배꼽 위보다 많이 튀어나옴**, 엉덩이·허벅지에도 살이 붙음 | 배를 넣으려면 **운동과 식이조절을 함께** |
| **고위험군** | **거의 임신부와 같은 상태**, 내장지방이 매우 많음 | 굶기만 하면 팔다리만 가늘어지는 **'감자 이쑤시개 체형'**이 되므로 **유산소 운동으로 지방을 녹여야 함** |

- 운동은 **몇 주~몇 개월이 지나야 체중이 감소하고 허리가 줄어듦**
  → 처음에는 **목표를 작게 잡고 조금씩 늘려가는 것**이 중요

---

## 38강. 남모를 고통, 치주질환

### 1) 얼마나 흔한가 ★
- **국민 5명 중 1명**이 치주질환 — **감기 다음으로 흔한 질환**
- **40대 이후 장노년층의 80~90%**가 앓고 있음

**증가 이유**
① 나이가 들면 **침의 분비가 줄어 입이 건조** → **세균 증식이 빨라져** 치주염에 걸리기 쉬움
② **스케일링·잇몸 치료에 대한 불신과 오해**
③ 치아에 대한 관심 증가로 **최근 20년 사이 장노년층의 치아 생존율이 증가** → 치아가 많이 남아 있으니 그만큼 치주질환 발생률도 증가

### 2) 원인 ★★
**간접 원인 4가지**
① **잘못된 구강 관리** ② **유전적 요인** ③ **부정교합** ④ **전신질환**

**직접적 주원인 2가지: 치태 + 치석**
- 더 자세히는 **치태 내에 살고 있는 박테리아**
- 박테리아가 **독소**를 만들어 그 독소가 **치아 주변의 치주 조직을 파괴**

### 3) 치태와 치석 ★
- **치태**: 화장실 벽이나 강가 돌멩이 표면이 매끌매끌한 것처럼, 입 안에 침이 분포되며 **얇은 피막을 형성한 것**. 그 안에 세균이 삶
- **구강 내에 약 300가지 종류의 세균**이 살며, 이들이 **충치와 치주질환**을 일으킴
- 치태는 처음에 **양치질만으로 쉽게 제거**되지만 **곧바로 다시 생기고**,
  시간이 지나며 **침의 석회화 성분과 결합하면 치석**이 됨 → **그래서 양치질이 중요**

### 4) 증상
- 빨갛게 **붓고, 피가 나고, 아프고, 흔들리고, 씹기가 불가능**해짐
- 심한 경우 **고름** 발생
- **임플란트**의 경우 잇몸이 내려가며 **주변 나사가 노출**
- **틀니** 사용이 어려워짐
- ⚠ 이런 증상들을 모르고 치과에 오는 사람도 많음

### 5) 검사 2가지 ★
| 검사 | 방법 |
|---|---|
| **치주낭 측정 검사** | **탐침**이라는 뾰족한 기구로 치아 주변의 **치주낭이 얼마나 깊은지, 피가 나는지** 검사 |
| **방사선 검사** | 방사선 사진 촬영으로 **치아 주변의 뼈가 얼마나, 어떤 형태로 녹았는지** 확인 |
- **두 가지를 병행**해야 치주질환의 정도를 파악 가능

### 6) 치료 ★★
| 치료 | 대상 | 설명 |
|---|---|---|
| **스케일링** | **잇몸 위에 보이는 치석** | 간단한 치은염은 이것만으로도 많이 호전 |
| **치근활택술** | **잇몸 속에 숨은 치석** | **치근(치아 뿌리)** + **활택(매끄럽게 만듦)** = 치아 표면을 매끄럽게 만드는 것 |
| **치주소파술** | **잇몸 속에 숨은 치석** | **소파 = 염증을 제거**한다는 뜻. 치주 조직의 염증 제거 |

- **잇몸 뼈 자체가 파괴되는 치주염**에서는 스케일링 다음 단계인 **치근활택술·치주소파술**이 필요

**잇몸약**
- 증상을 억제하는 효과는 조금 있으나, **근본 원인인 치석은 물리적으로 직접 제거하지 않으면 불가능**
- → 약만 먹다 중단하면 반복 악화. **반드시 치주 치료와 병행** 필요

### 7) 양치질 ★
- 치주질환 예방의 가장 기본적인 방법
- 식사 후 또는 자기 전에 하되, **특히 취침 전 양치질이 가장 중요**
- **치간 칫솔, 치실**로 인접면 청소
- **구강 세정기**(물총처럼 물을 쏘는 기구)로 칫솔이 닿지 않는 부분 청소
- **정기 검진과 잦은 스케일링**

**바스법(Bass법) ★★**
> **칫솔모의 끝을 치아와 잇몸이 닿는 부위에 45도 각도로 넣어 마사지하듯 4~5회 정도 살살 닦아주는 방법**
- **잇몸 마사지 효과가 크며**, 평소 피가 나던 사람도 피가 안 나게 되고 **잇몸이 탄력적으로** 바뀜
- 양치질은 **너무 세게 하지 말고 살살 가볍게**
- 회전법은 손목까지 움직여야 해 어려우므로, **칫솔을 잡듯 잡고 위아래로 살살 닦는 것**도 효과적

### 8) 궁금증
- **스케일링과 치아 마모**: 스케일링용 **초음파 기구는 치아를 절대 삭제할 수 없음**
  → "치아가 마모됐다", "사이가 벌어졌다"는 것은 **치석이 껴 있다가 떨어져 그 공간이 느껴지는 것**
- **칫솔모**: 치주염 환자는 **부드러운 칫솔모** 사용. **이중미세모**(평평하지만 한두 개씩 모가 올라온 것) 칫솔은 치아와 잇몸 사이에 들어가기 더 쉬움
- **소금**: 치약이 보편화되기 전 방법. **입자가 굵고 거칠어 치아를 마모시키고 잇몸에 상처**를 줄 수 있음 → 요즘은 **치약으로 꼼꼼히 닦는 것이 훨씬 효과적**
- **입 벌리고 자기**: 잘 때는 평상시보다 **침 분비량이 훨씬 감소** → 입을 벌리고 자면 입 안이 바짝 마름 → **세균이 빠르게 증식해 잇몸을 공격** → 치주염 발생 쉬움
  → **아침에 입냄새가 더 많이 나는 것**도 이와 관련
