## 39강. 내가 대상포진에 걸렸다고?

### 1) 발생 ★★
- 어린 시절에 겪은 **수두 바이러스**가 몸속에 숨어 있다가,
  **스트레스·영양 부족 등으로 면역이 떨어지면 신경을 따라 활성화**되어 통증을 일으킴
- **한쪽에 띠 모양처럼 발생** → **대상포진**
- 어원: **'대상' = 띠 모양**, **'포진' = 수포성 발진**
- ⚠ **반복해서 재발하는 입 주위의 작은 물집성 질환은 대상포진이 아니라 헤르페스 바이러스 질환**(경증의 면역질환)

### 2) T림프구와 대상포진 ★
- **흉선에서 성숙하는 T림프구**가 제 역할을 하면 대상포진을 적절히 제어
- 나이가 들어 **흉선의 크기가 줄어들면 T림프구가 줄어들고** 대상포진 바이러스가 활성화

### 3) 발생 대상 ★
- 대상포진 환자의 **72.6%가 50대 이상**
- 최근에는 **잦은 야근, 스트레스, 잦은 음주, 운동 부족, 심한 다이어트**로 쇠약한 **젊은이**에게도 발병

### 4) 증상과 합병증 ★★
- 신체 한 부위에 **처음에는 발진 → 수포(물집)로 변함**
- 전신 증상: **가려움증, 근육통, 발열**이 점점 심해짐
- 통증이 심해지면 **마약성 진통제로도 진정이 안 될 수 있음**
- **산통보다 더한 경우**도 있으며, 지속적 통증으로 **우울증, 만성 피로** 동반
- 극심한 통증 때문에 **신경차단술**을 시행하기도 함
- **대표적 합병증: 뇌졸중** → 대상포진 환자는 뇌졸중 발생 확률이 상승
  → 특히 **안면·눈·귀 쪽**에 걸리면 뇌졸중 발병 확률이 **더 올라감**

### 5) 다른 질환과의 구별법 ★★
- **극심한 통증**
- **물집이 띠 모양**으로 생기면 대상포진
- **타거나 찌르는 듯한 통증** (신경통이므로 전형적인 근육통과 다름)
- **몸 한쪽이 유난히 아프고 힘이 없을 때** (약간 마비된 듯한 느낌)
- **발진·수포가 몸의 한쪽에만** 발생하는 경우 (신경절을 타고 번지기 때문)
- ⚠ **발진이 없는데도 이유 없이 통증이 있고 물집이 띠 모양으로 생기면 대상포진**

### 6) 치료 ★
- ⚠ "수두 바이러스와 같으니 집에서 쉬면 낫겠지" 하며 **치료시기를 놓치는 사람이 많음**
- **대상포진은 절대 스스로 치료되지 않으며**, 방치하면 **심각한 후유증**을 야기할 가능성이 큼 → **반드시 병원에**
- **대상포진 치료의 골든타임은 72시간 이내**
- 치료 방법
  - **항바이러스제를 일주일가량 복용**
  - 물집이 심각한 경우 **침으로 물집액을 빼고 재생 레이저**로 치료
  - 통증·가려움증이 있으면 **항히스타민제나 신경제** 사용
  - 일반 진통제로 진정되지 않으면 **마약성 진통제** 사용

### 7) 예방접종 ★
- **50대 이후 1회 접종으로도 50~70%의 면역 효과**
- 걸리더라도 **심각해지거나 후유증이 발생할 비율을 현저히 낮출 수 있음**
- **20~30대는 국가접종 가이드라인에서 권유하지 않음**
  → 이 연령대는 **T림프구로 충분히 예방**할 수 있기 때문
  → 단, 본인이 대상포진에 매우 취약하거나 가족력이 있다면 **주치의와 상의**하여 결정 가능

## 40강. 현대인의 숙명, 노안

### 1) 노안의 시작
- **40대가 시작되면 어김없이 시작**
- 처음에는 노안이라 생각하지 않지만 **근거리가 안 보이고**, 시간이 지나며 **평상시 시력도 떨어지고 침침**해짐

### 2) '중년안' ★
- 안과학회에서는 **노안 대신 '중년안'이라 부르자**는 운동을 벌이고 있음
- 이유: 예전에는 40~50대에 노안이 와도 큰 불편이 없었으나,
  요즘은 **핸드폰 등 근거리 작업이 매우 많아** 노안을 **더 많이, 더 빨리, 더 심하게** 느끼기 때문

### 3) 노안 자가진단 8문항 (하나라도 해당되면 의심) ★★
① 책 보는 거리가 몸에서 **점점 멀어진다**
② **근시가 있는데 안경을 벗으면 오히려 근거리가 잘 보인다**
③ 글자나 숫자를 **잘못 읽는 때**가 많다
④ **안개 낀 것처럼 눈이 침침해** 자주 비비게 된다
⑤ **햇빛에 눈이 시리다**는 느낌이 든다
⑥ 전보다 **밤에 운전**하는 것이 어렵다
⑦ 아주 밝은 곳에서는 차이가 없는데 **조명이 침침하거나 어두운 곳에서는 덜 보인다**
⑧ **바닥의 높이가 약간만 달라져도 발을 헛디딘다**

### 4) 시력 건강의 골든 타임 ★★
- 노안으로 불편해지는 시기는 **녹내장, 백내장, 황반변성** 등이 호발할 수 있는 시기
  → 안과 의사들이 **'골든 타임'**이라 부름
- **백내장과 노안은 뗄 수 없는 관계** — 백내장이 지나가며 노안이 생기기도, 노안 때문에 백내장이 더 진행되기도 함

| 질환 | 특징 |
|---|---|
| **백내장** | 수정체가 혼탁해져 **초점이 흐려지는 것** |
| **녹내장** | **초기 증상이 없고 시력은 정상**이나, **시야가 좁아지기 시작하면 이미 말기** → 검진 시 함께 체크해야 함 |
| **황반변성** | 시력이 흐려지면서 **물체가 굽어 보이거나 휘어 보임** |

**황반변성 확인법 ★**
- **모눈종이**를 보면 됨
- 모눈종이가 곧아야 하는데 **중간에 흐리거나 굽어지는 면**, 또는 **가운데가 검게 가려져 보이는 면**이 있으면 황반변성
- **오른쪽·왼쪽 눈으로 번갈아 보면** 정확하게 알 수 있음

### 5) 노안과 원시 ★
- 증상이 거의 비슷해 **구별이 어렵고 동반되는 경우도 많음**
- 예: 20~30대에 안경 없이 잘 보다가 → 40대에 먼 곳은 보이는데 근거리가 안 보여 돋보기 착용 → 50~60대에 먼 곳도 안 보임
  = **20~30대에 안경을 안 쓴 사람이 50~60대에 안경을 써야 보이는 경우 = 노안과 원시가 같이 진행된 것**

### 6) 돋보기 ★
- 돋보기는 **필요할 때 시작**하는 것이며, **돋보기를 썼다고 노안이 진행되는 것은 아님**
- 중요한 점: **돋보기는 자기 도수가 맞아야 하며, 약간 부족해도 자기 것을 써야 함**
- ⚠ **"시원하지 않게 보이는 돋보기"가 나에게 맞는 돋보기**
  → 시원하게 보이면 **돋보기를 벗었을 때 안 보이기** 때문

### 7) 치료 ★★
| 방법 | 특징 | 단점 |
|---|---|---|
| **다초점 안경** | 안경 하나로 **근거리·원거리** 모두 보임 | 안경 밑에 근거리 초점을 만든 것이라 **상이 점핑**, **계단 내려갈 때 발을 헛디딤** |
| **누진 다초점** | 원거리·근거리 사이에 **중간거리를 넣어 부드럽게 연결** | **적응하는 사람이 50~60% 정도**. 어지럽고 불편, 계단·누워서 TV 보기 힘듦. **원거리·근거리 도수가 다 맞아야 해서 제작과 시력 측정이 까다로움** |
| **백내장 굴절 수술** | 백내장 제거 + **인공 수정체**로 **시력·난시·노안 교정**을 함께 | **야간 번짐 현상**(차 헤드라이트 불빛이 퍼져 보임) |
- 인공 수정체는 **다초점, 삼중초점, 연속초점**의 장단점을 따져,
  **중간거리가 필요한지 / 근거리를 꼭 봐야 하는지 / 야간 운전이 많은지** 등에 따라 선택

## 41강. 피할 수 없는 폐경과 갱년기

### 1) 정의 ★★
- **폐경**: **난소 기능의 상실**로 생리가 **영구적으로 중단**된 것
  → **40~58세 여성 중 12개월 이상 생리가 없으면 진단**
- **갱년기**: **폐경이 되기 전 단계**로 **2~8년** 정도 걸리며, **마지막 생리 이후 1년까지**를 의미
- **우리나라 여성의 평균 폐경 연령: 약 50세** (40~58세 사이)
- 폐경은 난소 기능 저하로 인한 **자연적인 신체 변화 과정**
  → 그 외 **산부인과적 수술, 항암 화학 요법**으로도 올 수 있음

### 2) 증상 ★
- 가장 흔한 증상: **안면홍조와 발한** — **70%의 여성**이 느끼며 **길게 10년** 지속
  (개인 편차가 매우 큼: 수년~10년)
- 그 외: **성욕 감소, 질 건조감**
- 장기적으로: **심혈관계 질환 위험 증가, 골다공증 진행, 비뇨생식기 위축**
  → **비뇨생식기 위축과 골다공증 같은 장기적 증상은 점점 심해짐**

### 3) 폐경과 우울증
- 폐경 후 **세로토닌** 분비 감소로 **우울증이 심해질 수 있음**
- **자녀의 분가나 퇴직**으로 인한 공허한 마음으로 더 심해짐
- 특히 **유명인일수록, 자존감이 높은 사람일수록** 더 많이 생김

### 4) 갱년기 자가진단 — 쿠퍼만 지수 ★★
- 갱년기 증상 항목을 **0~3점**으로 점수를 매긴 후 **가중치를 곱해** 점수를 냄
- 항목: **안면홍조/발한, 불면증, 우울증, 신경질, 어지러움, 피로감, 관절통, 머리 아픔, 질 건조함** 등

| 점수 | 상태 |
|---|---|
| **5~10점** | **경미** |
| **10~15점** | **중등도** |
| **15점 이상** | **심함** |

### 5) 폐경과 질병 ★★
- 폐경 후 **에스트로겐 감소**로 **심혈관계 질환·골다공증** 위험 증가
- **폐경 이전**: 에스트로겐의 효과로 **여성이 남성보다 심혈관계 질환 위험이 매우 낮음**
- **폐경 이후**: 에스트로겐 감소 → **혈관 확장 기능 감소** → **오히려 남성보다 심혈관계 질환 가능성이 더 높아짐**

### 6) 치료
- 대부분의 폐경기 여성은 병원 대신 **운동과 식이요법만으로 완화할 수 있다**고 생각
  → 생활습관 개선이 큰 도움이 되는 것은 사실이나, **치료 없이 방치하면 삶의 질이 크게 저하**
  → 우리나라 여성은 **호르몬제에 대한 잘못된 인식**으로 병원을 잘 찾지 않음. **증상이 심하면 참지 말고 치료**

**호르몬 치료 ★★**
- 난소에서 더 만들어내지 않는 **여성 호르몬을 외부에서 보충**하는 것
- **약 30%의 여성**이 갱년기 증상을 매우 심하게 겪어 삶의 질이 떨어짐 → 이런 경우 고려
- **치료받는 나이가 중요** → **폐경 후 10년이 지나지 않은 여성**에게 **약 3~5년간** 치료
- ⚠ 부작용이 있으므로 **반드시 전문가와 상담 후 복용**
  → 장기 복용 시 **심혈관계 질환, 정맥색전증, 유방암** 위험 상승

### 7) 갱년기 생활습관
- **운동을 통한 체중 감량**
- **매운 음식, 술, 카페인, 스트레스** 피하기
- **배우자에게 갱년기가 왔다면 관심을 갖는 것이 가장 중요**
- 부부가 서로 **양보·이해**하고 **운동·여행·취미생활**을 함께
- 💡 요즘은 **폐경 대신 '완경'**이라는 표현을 많이 사용
  → **완경 = 여성의 몸 변화에서 가장 완성된 단계**라는 의미

### 8) 궁금증 ★
- **사춘기와 폐경**: 생리를 늦게 시작한 여성이 좀 더 늦게 폐경되기는 하지만 **전체적인 횟수는 비슷**
  → 사춘기가 일찍 시작된다고 난소 기능이 일찍 끝나는 것은 아니며, **조기 폐경을 일으킨다는 연구 결과도 아직 없음**
- **폐경과 폐 기능**: 폐경은 **담배를 하루 한 갑씩 10년간 흡연한 여성의 폐 기능과 비슷할 정도로** 폐 기능에 악영향을 끼친다는 연구 결과가 있음
  → 단, **원인과 인과관계는 정확히 밝혀지지 않음**
- **조기 폐경**: **40세 이전에 폐경**되는 경우
  → **심혈관계 질환·골다공증 위험이 매우 높아 호르몬제를 꼭 복용해야 함**
  → 40세 이전 여성이 생리 불규칙 + **안면홍조·발한·불면증**이 생기면 의심
  → **자가면역질환, 방사선 치료, 난소 수술, 갑상선 질환**이 있으면 더 신경 써야 함
- **남성 갱년기**: **서서히 증상이 나타나 무시하고 지나가기 쉬움**
  → 여성과 같이 신체 기능이 떨어지고 노화가 빨리 와서 **남아 있던 병들이 더 악화**
  → 평소 지병이 있다면 방치하지 말고 **적극적으로 치료**

## 42강. 임플란트 제대로 알기

### 1) 정의 ★
- **치아가 빠졌을 때 그 치아를 대신하기 위해 만든 인공 대체물**
- **임플란트와 치조골이 결합되는 현상**을 이용해 치아의 **기능과 심미를 회복**해주는 치료

### 2) 장점
- 치아가 빠졌을 때 **주변 치아를 손상시키지 않고** 기능 회복
- 기능적인 면에서 **자연 치아와 가장 유사한 기능** 회복
- **임플란트와 틀니를 연결**해 사용하면 기존 틀니보다 훨씬 **안정적이고 편함**
- 기존 틀니로 인한 **과도한 뼈 흡수를 방지**

### 3) 구조와 수명 ★★
**임플란트의 구조 3부분**
① **식립체** — 치조골에 식립하는 부분
② **크라운** — 잇몸 위에 올라와 있는 부분
③ **연결 부위** — 두 부분을 연결하며 **나사**가 있음

- **크라운**: 일반 보철물처럼 유지관리가 필요하며 문제가 생기면 **교체 가능**
- **나사**: **적절한 시기에 교환**해 부러지는 것을 예방
- → 구조물 대부분이 **금속**이므로 **염증관리와 유지관리만 잘 되면 수명은 거의 반영구적**
  ⚠ 관리가 소홀하면 수명에 문제 발생

### 4) 임플란트 전 고려 ★
- 치아가 흔들리거나 통증이 심하면 무조건 뽑고 임플란트를 해야 한다고 생각하기 쉬움
- → 그러나 먼저 **이 치아를 살릴 수 있는지 자세히 상담받는 것이 중요**
- ⚠ **자연 치아보다 더 좋은 임플란트는 없음** → 가급적 치아를 살려 쓰고, 더 이상 방법이 없을 때 뽑아도 늦지 않음

### 5) 수술 전 체크사항 ★
① **방사선 사진**(파노라마, CT)으로 **심을 부위의 치조골 형태와 주변 해부학적 구조** 파악
 → **치조골 이식이 필요한지** 확인
② 치아가 빠진 뒤 오랜 시간이 지나면 자리가 부족하므로 **임플란트가 들어갈 공간이 확보됐는지** 확인
③ 환자의 **전신 건강 상태, 알러지** 확인
④ **임플란트의 종류, 보철의 재료** 결정
- **나이나 성별은 임플란트에 크게 영향을 주지 않음**
  → 나이가 많으면 지병이 있을 수 있으나, 지병이 영향을 주지 않는다면 걱정할 필요 없음

### 6) 치료 기간 ★★
> 임플란트는 **치과 치료 중 가장 긴 치료 기간**을 필요로 함
> (임플란트와 치조골·잇몸뼈가 **융합**하는 기간이 필요하기 때문)

| 단계 | 기간 |
|---|---|
| 발치 후 **뽑은 자리가 아무는 기간** | **1~3개월** |
| 임플란트 식립 후 대기 — **위턱(상악)** | **3~6개월** |
| 임플란트 식립 후 대기 — **아래턱(하악)** | **2~4개월** |
| **보철물 제작** | **1~2주** |
| **총 소요 기간** | **빠르면 4개월, 길면 9개월** |

### 7) 식립 과정 ★
① 임플란트가 들어갈 자리를 **마취**
② **잇몸 절개** → **판막 형성** → **치조골(잇몸뼈) 노출**
③ **드릴**로 임플란트가 들어갈 자리 결정
④ **임플란트 식립** (필요하면 **치조골 이식**을 함께)
⑤ 수술 후 임플란트가 **잇몸 속에 묻혀 있는 경우**와 **기둥이 잇몸 위로 올라와 있는 경우**가 있음
 → 잇몸뼈·치조골이 아주 건강하고 정확한 위치에 심어졌다면 **금속 기둥을 노출시켜 2차 수술을 생략** 가능
⑥ 최종적으로 **보철물 제작·부착**

### 8) 후유증
- 심은 후 **2~3일 정도 통증**
- **일주일 후에는 붓기가 빠짐**

### 9) 오해와 진실 ★
- **흡연**: 장기 흡연자라도 임플란트가 불가능하지는 않으나 **금연이 꼭 필요**
  → 담배의 **니코틴이 혈관을 수축**시켜 치아·치조골에 공급되는 **혈류량을 감소** → **임플란트 실패** 가능
- **무치악**(이가 전혀 없는 것)에서도 임플란트 가능
  → ① **임플란트 2~4개를 심어 틀니와 연결**
  → ② **치아 개수만큼 임플란트를 심어 크라운·브릿지를 접착하는 고정식**
- **자가치아 이식술**: 자기 치아(주로 **사랑니**)를 의도적으로 뽑아 필요한 부분에 식립
  → 단 **성공률이 그리 높지 않고 사랑니가 멀쩡해야** 쓸 수 있어 흔하지 않음
- **틀니 사용자**: 임플란트 가능. 그러나 틀니를 오래 쓰면 **치조골이 흡수되고 단단한 잇몸이 없어져** 심기 쉽지 않음
  → **치조골 이식**을 함께 하고, 필요하면 **잇몸이식**으로 단단한 잇몸을 만들어줌

## 43강. 나이 들면 찾아오는 노인 우울증

### 1) 우울감 vs 우울증 ★
- 슬프고 우울한 감정이 **일시적**이면 → **우울감**
- 우울하거나 슬픈 감정이 **2주 이상 계속**되어 정상적인 생활을 못할 때 → **우울증(우울장애)**

### 2) 연령별 우울증 증상 ★★
| 연령 | 증상 |
|---|---|
| **청소년** | **학교를 안 가려 함**, 짜증, 여기저기 아프다고 함 → 성적 저하, 친구와 싸움, 약물 → **비행청소년화** |
| **성인** | **우울감**이 많이 나타남 — 슬프다, 불안하다, 절망적이다, 사는 것이 재미없다, 깜빡깜빡 잊어버린다 |
| **노인** | **막연히 불안하고 중병에 걸린 것 같음**, **기억력 감퇴**로 자꾸 잊고 자녀들에게 물어봄 (치매와는 다름) |

### 3) 노인이 우울증을 드러내지 않는 이유 ★
- 노인들은 **'내가 삭이면서 해결해야지 성숙한 사람'**이라 느끼고 표현하지 않고 감내함
- **'우울증에 걸린 것 = 인격이 부족하고 성숙하지 않고 자기 관리를 못한 것'**이라 생각
- "말해봤자 무슨 소용이 있을까"라고 함
- ⚠ 그러나 실제로는 **"나 이렇게 슬퍼, 괴로워"라고 말하는 것만으로도 우울증에 도움**이 됨

### 4) 원인 ★
- 가장 큰 이유는 몸속의 **신경전달 물질**
  → 이것이 **음식의 맛을 내는 조미료**처럼 희로애락을 느끼고 즐겁게 살게 해줌
  → 우울증은 그 **조미료가 잘 나오지 않거나 부적절하게 있는 것**
- **노인의 경우** 하나의 원인이 있을 수 있으나, **본래의 우울증은 아무런 이유 없이 서서히 찾아옴**
  → 물론 **환경적 요인이 안 좋을 때 더 심하게** 나타남

### 5) 우울증과 자살
- **우울증이 곧 자살로 이어지는 것은 아님**
- 그러나 우울증 환자가 자살을 많이 하므로 **우울증이 높으면 자살률도 높아짐**
- → 어느 나라의 자살률이 높다면 **치료가 잘 되지 않은 우울증이 많다**고 볼 수 있음

### 6) 치료 실태 ★
- 우리나라는 **약 20%만 치료를 받고 약 80%는 치료를 받지 않음**
- → 병원조차 오지 않아 **만성화**되고 가족들도 힘들어함
- ⚠ **우울증은 그냥 낫는 병이 아니고, 치료하면 반드시 낫는 병**
  → 대부분은 "치료해도 안 낫는다"고 생각
  → **그 80%를 빨리 병원에 오게 하고 "우울증은 치료가 잘 된다"고 인식시키는 것이 중요**

### 7) 우울증과 술 ★
- 우울하면 감정과 에너지가 가라앉는데, **술 또한 에너지를 가라앉히는 역할**
- → 술은 **우울증을 더 심하게 하고**, **자기 조절과 참는 행동을 잘 못하게** 해 **자살 위험도 높임**
- 사례: 과거 **헝가리**는 우리나라보다 자살률과 우울증이 높았는데,
  국가적으로 **금주 운동으로 음주를 조절했더니 자살률이 많이 떨어졌다**는 보고

### 8) 노인 우울증 vs 치매 ★★
| 구분 | 노인 우울증 | 치매 |
|---|---|---|
| 시작 증상 | **괴롭고 아픈 것**이 먼저 → 활동 감소 → 기억력 저하 | **처음부터 기억력(인지) 저하**가 주 증상 |
| 진행 | **어떤 사건·원인**이 있어 **급격하게** 슬퍼지고 급격하게 기억력 저하 | **별다른 원인 없이 조금씩 서서히** 나빠짐 |
| 본인의 인식 | **"내가 요즘 기억력이 상당히 나빠졌어"** 하고 **우울해함** (실제로는 기억력이 그런대로 있음) | 기억력이 나빠진 것을 **심각하게 생각하지 않음** ("너도 나이 들어 봐라") |
| 두드러지는 것 | **우울한 기분** | **인지 기능 저하** |

- 판별 요령: 처음 시작될 때 **인지가 흐려지면 치매**, **감정 증상이 보이면 노인 우울증** 의심
- ⚠ 다만 **나중에는 두 가지가 섞인다**는 점도 유념

### 9) 치료
- **인간관계(친구·부부) 문제가 뚜렷한 경우** → 정신치료, 부부치료, 인지치료
- **대부분의 경우** → 잘못된 **뇌의 생화학적 불균형을 약물치료**로 교정
  → 그래서 **약물치료의 비중이 상당히 큼**

### 10) 완치의 의미 ★
- **원래의 내 상태, 가장 좋은 상태로 돌아가는 것**이 우울증의 완치
- 예: 원래 보통 사람 대비 80% 수준으로 살던 사람이 우울증으로 60%밖에 발휘를 못 했다면,
  → 치료하면 **원래의 80%가 되는 것**이지 **그 이상이 되는 것은 어려움**
- 의학적 평가 척도가 있음
  → "일주일 동안 슬퍼한 적이 있습니까? 요즘 입맛은 어떻습니까? 사는 것이 즐겁습니까? 잠은 잘 주무십니까?" 등 **일상 생활의 중요한 요소들**을 평가

## 44강. 거울 보기 싫게 만드는 주름

### 1) 주름의 발생 원인 ★
① 나이가 들수록 **피부 유수분 밸런스가 깨져서 건조**해짐
② 피부 **진피층 안의 콜라겐과 탄력섬유가 점점 감소**
③ **지방들이 이동**하면서 불독처럼 내려감
④ **얼굴 근육의 힘이 떨어지며** 늘어짐
- **피부가 지성이고 유분기가 많은 사람은 나이 들어 주름이 덜 생기는 편**

### 2) 주름이 덜 생기는 사람 ★
- **유분이 많은 사람**: 젊어서는 여드름·기름기 등 불편이 많지만, **나이가 들면 쉽게 건조해지지 않아 주름이 덜 생김**
- **피부가 조금 까만(흑인에 가까운) 사람**: **멜라닌 색소가 자외선으로부터 피부를 보호**해 **콜라겐 파괴가 덜하므로** 주름이 덜 생김

### 3) 주름의 시작 시기 ★
- **노화에 의한 주름은 20대 중반부터 시작**
- **40대가 되면 20대의 절반 정도 수준**이 됨

### 4) 팔자 주름을 심화시키는 생활 습관 ★
- **턱 괴기**
- **옆으로 누워 자기**
- **입을 샐쭉샐쭉 하는 습관**

### 5) 눈가 주름 방지법 ★
- 화장은 **얇게, 약하게**
- **풀 메이크업**을 했다면 **클렌징을 잘하기**
- **알코올이 함유된 스킨이나 토너**는 건조한 피부를 더 건조하게 하므로 **자제**
- **눈 비비기 자제**
- **눈은 피부가 가장 얇은 부위**이므로 쉽게 구겨지기에 주의

### 6) 보톡스 ★★
**유래**
- **'보톡스'는 상품명**이고, 원래는 **클로스트리디움 보툴리눔**이라는 균주
- **상한 통조림에서 발견된, 신경을 마비시키는 무서운 균**
- **눈 떨림, 근육 뭉침, 눈이 모이는 사시** 등에서 **근육을 마비시키는 기능**으로 사용되며 보편화

**효과의 범위 (매우 중요) ★**
- 보톡스는 **모든 주름에 적용되는 것이 아니라, 근육을 써서 생기는 주름에만 효과**
- **얼굴을 반으로 나눠 위쪽 = 이마, 미간, 눈가 주름 → 보톡스 효과 O**
- **팔자 주름 = 근육이 내려오면서 발생 → 보톡스 효과 X**

**사용법**
- 보톡스는 **신경을 마비시켜 찡그리지 못하게** 만듦
- **한 번 주름이 생기면 다시 펴기 어려우므로**, **젊었을 때 맞아 주름을 방지하는 예방 목적**으로 사용하는 것이 효과적

**부작용**
- 너무 많이 주사한 경우 **해당 부위를 움직이기 어려움**
- **효과가 지속되지 않아 4~6개월이 지나면 서서히 다시 돌아옴**

## 45강. 치매 이해하기

### 1) 치매의 정의 ★★
- **치매는 특정 질환명이 아님**
- **기억력 저하, 행동장애, 성격이 포악해지는 등 다양한 뇌 질환 증상들을 묶어서 일컫는 것**
- 즉 **병명이 아니라 어떤 병으로 생긴 결과를 종합한 것**
  → 따라서 **치매를 유발하는 병은 많을 수밖에 없고, 치료도 병에 따라 달라짐**
  → **고칠 수 있는 병과 고치지 못하는 병**이 있음

### 2) 상식
- **고스톱과 치매**: 예방에 효과적인지 확답은 내릴 수 없으나,
  **계산이나 게임을 하며 느끼는 즐거운 감정**이 도움이 되지 않을까 추측
- **비만과 치매**: 비만이 오면 **콜레스테롤이 올라가고 동맥경화가 심해져** 치매를 악화시킬 수 있으며 **알츠하이머의 발병률을 높임**

### 3) 치매의 원인 질환 비율 ★★
| 원인 질환 | 비율 |
|---|---|
| **알츠하이머** | **50%** |
| **혈관성 치매** | **20~40%** |
| **퇴행성 뇌질환** | **10%** |
| **기타 치매** | **10~15%** |
- 그 외 **70가지 이상의 질환**이 치매를 유발하는 것으로 알려짐

### 4) 원인 질환별 특징 ★★
| 질환 | 특징 |
|---|---|
| **뇌종양, 뇌수두증, 뇌외상** | **수술 등의 치료로 치매 증상 치료가 가능** |
| **퇴행성 뇌질환** | 대개 **유전성 질환, 뇌 신경계 질환**이 많아 **치료가 힘든 경우**가 꽤 있음 |
| **루이체 치매** | 뇌에 **루이체**라는 물질이 많이 쌓여 발생. **몽유병 증상, 환각·환시·환청** → **치매가 아닌 정신병으로 분류되는 경우가 많음** |
| **전두측두엽 치매** | 뇌의 **전두부·측두부가 원인 모르게 말라가는 병**. **갑자기 포악해지거나 폭식**하는 등 성격 변화. **측두부에 문제가 생기면 언어 기능 문제** → 말은 다 이해하는데 **문법이 틀림** (예: "나는 학교에 갔습니다" → "나는 학교에 가무니다") |
| **알츠하이머 치매** | **아직 정확한 원인조차 모르며 치료법이 없음** |

### 5) 건망증·필름 끊김·명사치매 ★
- **건망증**: 기억을 해내는 것의 **개인 성격 차이**로 발생하는 것이지 **병이 아님**
- **필름 끊김(블랙아웃)**: 술을 마시면 알코올이 분해되며 생기는 **아세트알데하이드**가
  기억이 **저장소로 가는 것을 막음**으로써 발생 → **치매와 유사한 면**이 있음
- **명사치매**: 종이·펜·볼펜·마이크 등의 단어가 저장된 **뇌의 부위가 파괴되어 꺼내올 수 없어** 단어를 떠올리지 못하는 것

### 6) 치매 자가진단 ★★
> **10개 이상 해당되면 의심, 15개 이상이면 고위험**

**[기억]**
① 어떤 일이 언제 일어났는지 기억하지 못할 때가 있다
② 며칠 전에 들었던 이야기를 잊는다
③ 반복되는 일상 생활에 변화가 생겼을 때 금방 적응하기 힘들다
④ 본인에게 중요한 사항을 잊을 때가 있다(결혼기념일, 배우자 생일 등)
⑤ 어떤 일을 하고도 잊어버려 다시 반복한 적이 있다
⑥ 약속하고 잊을 때가 있다
⑦ 이야기 도중 방금 자기가 무슨 이야기를 하고 있었는지를 잊을 때가 있다
⑧ 약 먹는 시간을 놓치기도 한다

**[언어]**
⑨ 하고 싶은 말이나 표현이 금방 떠오르지 않는다
⑩ 물건 이름이 금방 생각나지 않는다
⑪ 개인적인 편지나 사무적인 편지를 쓰기 힘들다
⑫ 갈수록 말수가 감소되는 경향이 있다

**[이해·독해]**
⑬ 신문이나 잡지를 읽을 때 이야기 줄거리를 파악하지 못한다
⑭ 책을 읽을 때 같은 문장을 여러 번 읽어야 이해가 된다
⑮ 텔레비전에 나오는 이야기를 따라가기 힘들다

**[공간·계산·수행]**
⑯ 전에 가본 장소를 기억하지 못한다
⑰ 길을 잃거나 헤맨 적이 있다
⑱ 계산 능력이 떨어졌다
⑲ 돈 관리를 하는 데 실수가 있다
⑳ 과거에 쓰던 기구 사용이 서툴러졌다

## 46강. 생활 속 안전 지킴이, 건강검진

### 1) 종합검진 vs 개별검진 ★
- 어느 쪽이 더 좋다고 잘라 말하기 어려움
- **건강검진을 드물게 받는 사람 → 종합검진**
- **만성 질환으로 계속 병원을 다니는 사람 → 개별검진**

### 2) 검진 비용
- 특정한 평균값이 도출되지 않음. 서비스·편리성을 고려하면 가격이 올라감
- 비유: **건강검진은 남성에게는 차량, 여성에게는 백과 같다**
  → 원하는 브랜드·서비스·자기 만족도에 따라 가격이 천차만별
- **국민건강보험공단의 무료 건강검진 활용을 추천**

### 3) 체리 피커 ★
- **케이크가 있으면 체리 하나만 빼먹는 사람**을 이르는 말
- 약간 밉상일 수도 있지만 실질적으로는 **현명한 소비자**를 가리키는 표현
- → 무료로 할 수 있는 건 다 하면서 **본인에게 필요한 것만 뽑아서 하는 똑똑한 소비자**

### 4) 노인 건강검진 ★
- **만 66세 이상** 해당
- 항목: **고혈압, 당뇨, 간 기능, 혈당, 골절, 치매, 우울증** 등

### 5) 추세에 따른 건강검진의 변화 ★★
| 대상 | 권장 검진 |
|---|---|
| **20~30대** | **위 내시경** — 국내 **암 발병률 1위는 위암** (**2020년 기준 암 사망률 1위는 폐암**) |
| **20대 초반 여성** | **자궁경부암** 검사 (환자 증가 추세) |
| **30~40대** | **대장 내시경** (대장암 급증 추세) |
| **50대 이상 여성** | **뇌 영상 검사** — 갱년기·폐경으로 심혈관·뇌 질환자 급증 |
| **70대 남성** | **전립선 질환 검사** — **10명 중 7명**이 전립선 질환 발생 |

### 6) 영상 검사 ★
- **CT**: 몸에 특정한 방사선을 쏘아 나오는 영상을 **치즈를 슬라이스로 자르듯 단층으로 보는 영상**
- **PET(양전자 방출 단층 촬영)**: CT 등으로 **암이 확진된 경우**,
  그 암의 형상이나 **다른 부위에 전이·확산된 상태를 확인**하기 위해 촬영
- **CT와 방사능 부작용**: 결핵을 앓았거나 흡연으로 폐가 망가진 경우 일반 엑스레이로 폐암을 찾기 어려움
  → **방사선 피폭량의 위험성보다 얻는 것이 더 크기 때문에** CT를 선택하는 것

### 7) 검진 전 주의사항 ★★
- 검진 날짜가 잡히면 **최소 3일에서 7일 정도 금주**
- 기존 질환으로 **아스피린**을 먹는 경우 **일주일 정도 전에 미리 중단**
- **당뇨약·인슐린 주사**를 하는 환자는 **검진 당일에는 약을 먹거나 인슐린을 맞지 않고, 검진이 끝나자마자 바로** 하는 것이 좋음

## 47강. 생활을 흔드는 낙상과 골절

### 1) 낙상 사고의 결과
- 골절 시 **골절 부위 통증과 압통, 부종, 피부변색, 변형**으로 신체 활동 제약
- **척추나 고관절 골절**: 통증으로 **앉아 있을 수조차 없는 '준 와상 상태'**
- **하지 골절**: 보행 제한

### 2) 겨울철에 빈번한 이유 ★
- **11월부터 2월까지 낙상 사고가 유독 빈번**
- 이유: 추워지며 **활동량 감소 → 근육 위축 → 민첩성 저하** + **눈길·빙판길**

### 3) 낙상 고위험군 ★
**고령 환자**
- **골다공증 유병률이 높고** 활동 능력 저하 → **근력 약화, 균형 감각 이상**
- **뇌졸중·고혈압·부정맥** 등 뇌혈관·심혈관 질환, **척추 질환**
- **치매, 신경정신과 약물 복용자**

**스트레스와 우울증**
- 외부 환경에 대한 **인지를 감소**시켜 낙상 위험도를 상승시킴

### 4) 낙상을 유발하는 기저질환 ★★
| 질환군 | 내용 |
|---|---|
| **안과 질환** | **시력 저하, 시야 장애** |
| **비뇨기 질환** | – |
| **심혈관 질환** | **기립성 저혈압, 부정맥** |
| **뇌혈관 질환** | **뇌졸중, 현훈(어지럼증)** |
| **척추 질환** | **보행 능력에 영향** |
- 그 외: **운동실조, 평형감각에 영향을 주는 질환, 신경정신과 질환, 영양실조와 비타민 D 결핍, 항정신성 약물** 투여

**기저 심장 질환자**
- 보행 능력 감소로 **근감소증**이 빈번하고, **비타민 K 길항제 또는 항응고제** 복용이 **골대사에 영향**을 미칠 수 있어 주의

### 5) 연령별 낙상 ★★
**젊은 층(20~30대)**
- 정상 성인은 **골량·골질 모두 아주 우수한 시기** → **골절에 대한 역치(골절이 가능한 부하)가 매우 높음**
- → **높은 곳에서 떨어지거나 교통사고 등 강한 에너지**가 주어질 때 골절
- 최근 **스키·스노보드 등 스포츠 손상 빈도가 매우 높아짐**

**아이들**
- 활동 중 골절·인대 손상 → **관절 부위를 다치며 성장판 손상**으로 이어지는 경우가 있음
- **재형성 능력**이 있어 큰 문제 없이 낫는 경우가 많음
  → 특히 **10세 이하는 재형성 능력이 커서** 원래대로 회복되기도 하고 **치유 기간도 성인보다 현저히 빠름**
- ⚠ 단 **골절 허용범위 이내**일 때만 해당 → 허용범위를 벗어나면 성장하며 **변형이나 각형성이 심해지는 방향**으로 진행
  → 반드시 **전문의의 진료**를 받아 판단

### 6) 골절 치유 기간 ★★
| 대상 | 기간 |
|---|---|
| **건강한 성인** | **3개월**이 기준 |
| **아이들** | **4~8주** (골 유합 기간이 단축됨) |
| **고령층** | 골량·골질이 양호하지 못해 **정상적인 치유 과정을 기대하기 힘든 경우**가 있음 |

### 7) 대처법 ★
- 아픈 줄 모르고 금방 일어날 수 있다면 크게 걱정하지 않아도 됨
- **통증·부종이 지속되고 보행에 지장이 있는 수준이면 반드시 진료**
- 당장 움직일 수 없고 통증이 극심하면 **주위의 도움을 청하고, 무리해서 움직이지 말고 119 구급차 이용**

**증세 완화법 ★★**
① 다친 부위의 **관절 운동을 제한하도록 부목이나 보조기로 고정**
② **외상 후 급성기에는 냉찜질** → 다친 부위의 **열감·부종 감소** 효과가 좋음
③ 부종이 심하면 **붕대와 솜으로 압박**하되 **혈액순환에 장애를 주지 않도록 주의**
④ **다친 부위를 심장 높이보다 30cm 이상 높이면** 부종이 경감되고 통증이 감소

### 8) 관절 운동
- 집에서 가볍게: **스트레칭, 가벼운 체조**
- **대퇴 사두근, 슬괵근**을 강화하는 **스쿼트나 런지** 운동 추천

### 9) 낙상에 좋은 음식 ★
- **저지방 우유, 요구르트, 등푸른 생선, 콩이나 두부, 들깨, 과일, 채소** 등
- **비타민 D의 역할**: **소장에서 칼슘 흡수**를 돕고, **신장에서 칼슘 재흡수**를 촉진하며,
  뼈에서의 작용을 통해 **혈중 칼슘 농도를 정상으로 유지** → **칼슘 대사와 골질 유지에 중요**
- ⚠ **50세 이상 남성과 폐경 여성**은 **칼슘과 비타민 D의 적절한 공급**이
  **골다공증 및 골절의 예방·치료에 필수적**

## 48강. 겨울 생활을 두렵게 하는 한랭질환

### 1) 한랭질환이란 ★★
- **추위에 장시간 노출되어 일어날 수 있는 여러 질환이나 상태**
- **대표적 5가지: 저체온증, 동상, 동창, 한랭피로, 한랭 두드러기**
- **한파특보·강추위 때 환자가 급증**하나, **반드시 영하가 아니라 영상의 기온에서도 발생 가능**
  → **늦가을부터 초봄까지** 주의 필요
- **취약 계층**: 고혈압·당뇨·심장질환·뇌졸중 등 **만성질환자**, **75세 이상 고령자, 독거노인, 노숙인, 군인**

### 2) 저체온증 ★★
- **우리 몸의 중심체온이 35도 이하로 떨어지면서** 여러 증상이 나타나는 것
- **체내의 열 생산보다 열 손실이 더 커서** 지속적으로 체온이 떨어질 수 있는 환경에서 발생

**증세 진행 순서**
| 단계 | 증상 |
|---|---|
| **초기** | 단순한 **떨림**, **맥박·호흡 증가**, **입술의 청색증** |
| **진행** | **근육경직**, 호흡력 저하, **말이 느려지고 어눌해짐**, **극심한 피로감이나 졸림** |
| **30도 이하** | 생리적 신체 기능 전반 저하, **체온·혈압·호흡 모두 저하**, **의식 소실**, **폐부종·심부전으로 사망**에 이를 수 있음 |

### 3) 음주와 저체온증 ★
- **음주는 저체온증의 아주 큰 위험요소 중 하나**
- 알코올을 분해하며 **초기에는 체온이 올라가는 것처럼 느낌**
- 그러나 실제로는 ① **혈관이 확장되어 열 손실이 더 빨라지고**
  ② **판단력과 추위를 느끼는 감각이 떨어져** 결국 저체온증에 더 쉽게 노출

### 4) 저체온증 대처 ★★
> 가장 중요한 것은 **추가적인 열 손실 방지 + 재가온**
- **젖은 옷을 입고 있다면 신속히 마른 옷으로 갈아입기**
- 몸을 **담요 등으로 감싸고 따뜻한 곳으로 이동**
- **의식이 있다면 따뜻한 물이나 설탕물**을 마시면 체온 회복에 도움
- **의식이 없거나 심정지 상태라면 심폐소생술을 시행하면서 신속히 병원으로**

**겨울철 산행 시 주의**
- **여러 겹으로 옷 입기(얇게 껴입기)**
- 산행 중 **수분·영양 섭취**
- **기온이나 체감온도가 너무 낮으면 야외활동 피하기**

### 5) 동창 vs 동상 ★★
| 구분 | 동창 | 동상 |
|---|---|---|
| 정의 | 추위에 노출된 부위의 **말초 혈액순환 저하로 발생하는 국소 염증 반응** | 동창보다 **약간 심한 것** |
| 온도 | **영상의 온도에서 발생하는 경우도 많음** | 주로 **영하의 온도** |
| 상태 | **열감, 가려움증, 통증** 동반 | **피부와 피하조직이 얼어 혈액 공급이 없어지고 조직 손상**이 일어난 상태 |

**호발 부위**: **심장과 멀고 외부 노출이 많은 곳** → **손, 발, 코, 귀, 뺨**

**합병증**
- **출혈이 있거나 수포가 터지며 균이 들어가 감염**이 생기는 것이 비교적 흔함
- 동상 부위에 **저린 증상이 장시간 지속**되거나 **관절염**이 생기기도 함
- **어린이는 성장판이 손상되어 뼈 성장에 지장**을 줄 수 있음

### 6) 다한증과 한랭질환 ★
- 다한증인 사람은 장갑·방한 양말·방한화를 잘 챙겨도 **그 안이 젖은 채 저온에 장시간 노출**되어 **동상·동창에 잘 걸림**
- **양말을 자주 갈아 신기**
- 장갑은 **털이 많고 땀이 나기 쉽거나 두꺼운 것보다 땀 흡수가 잘 되고 잘 마르는 것**을 선택

### 7) 동상·동창 응급 대처 ★★
- 신속하게 **실내나 따뜻한 장소로 이동**
- **젖은 옷이나 양말은 신속히 제거하고 갈아 신기**
- 노출 부위를 따뜻하게 덮고, 가능하면 **37~42도 정도의 물에 담가 재가온**
- ⚠ **난로나 전기 제품으로 직접 가열하면 화상 위험**
- ⚠ **비비거나 마사지를 심하게 하는 것도 조직 손상**을 유발

### 8) 한랭피로
- 추운 상황에서 **신체 기능이 전반적으로 쉽게 떨어지고 쉽게 피로해지는 현상**
- 대처: **너무 추운 환경 미리 피하기**, **비타민 포함 영양분 골고루 섭취**, **따뜻한 환경에서 숙면**

### 9) 한랭 두드러기 ★★
- 추위나 차가운 물에 노출된 피부가 부풀어 오르며 **팽진이나 붉은 반점**이 생기고 **가려움증**을 동반
- 정확한 원인은 모르나, **추위가 자극이 되어 알러지 반응과 유사한 두드러기 유발 물질이 분비**되어 생긴다고 알려짐
- **만성 유발성 두드러기**의 하나
  → **만성 두드러기 = 6주 이상 거의 매일 팽진이 발생하는 경우**
- **알러지 비염·천식 등 다른 알러지 질환이 있거나 갑상선 질환이 있으면** 만성 진행 확률이 조금 더 높음
- **대처**: 모든 알러지 질환의 기본은 **회피** → **추위, 찬 바람, 차가운 물 노출 피하기** + **항히스타민제** 등 약물 치료

### 10) 한랭질환 예방의 기본
> 평상시 **꾸준한 운동, 좋은 영양 섭취, 충분한 숙면**으로 **기초체력을 향상시키고 면역력을 유지**하는 것

## 49강. 허리에 테러! 허리디스크

### 1) 정의
- 척추체와 척추체 사이에 **디스크(추간판)**라는 정상 구조물이 있는데,
  이 **디스크 자체가 돌출되어 신경을 압박하는 것**을 디스크 병이라 함

### 2) 증상 2가지 ★★
| 구분 | 내용 |
|---|---|
| **연관통** | **디스크가 약해져** 주위의 근육·인대·후관절이 자극되어 나타나는 통증. 연골이 닳아 없어진 것처럼 되어 **연골·주변 뼈·힘줄이 통증 부하**를 받아 아픈 것 |
| **방사통** | **디스크가 돌출되어 신경 가지를 눌렀을 때** 발생. **허벅지부터 다리까지 방사되는 양상** |

### 3) 원인 2가지 ★★
| 구분 | 내용 |
|---|---|
| **외상성 요인** | 디스크 안의 **수액**과 이를 둘러싼 **디스크 막**이 있는데, **외부 요인으로 수액이 터져 바깥쪽으로 돌출**되는 것. **격한 운동, 잘못된 자세로 물건을 잡을 때, 교통사고** |
| **퇴행성 요인** | 많이 사용하면서 **수액과 디스크 막이 약해지고 탄력이 떨어져 부풀어 오르는 것** |

### 4) '작은 물건'이 더 위험한 이유 ★★
- **10~15kg 정도의 작은 물건을 잘못된 자세로 잡았을 때 외상성 디스크가 충분히 발생**
- **40kg 이상의 무거운 물건**이면 몸이 그 무게에 대해 **준비를 하고 힘을 씀**
- 그러나 **작은 물건은 얕잡아보아 몸이 준비를 못 하므로 디스크에 큰 하중**이 실림

### 5) 요통·디스크 통계 ★★
- **4명 중 1명** 정도가 **6개월 동안의 요통** 때문에 병원 방문
- 한 사람의 **평생을 따지면 약 80%(5명 중 4명)**가 허리 통증을 호소
- **일 년마다 새로운 허리 통증을 호소하는 사람은 12명 중 1명 꼴**
- 요통의 중요한 원인 중 하나가 디스크이므로 **디스크의 유병률은 많을 것**으로 추정
- ※ 허리디스크 자체의 발병률은 잘 알려져 있지 않음

### 6) 치료 ★
- **디스크가 다 수술을 해야 하는 것은 아님**
- **디스크의 상태, 환자 몸의 상태, 증상의 경도**에 따라 적절한 치료를 하는 것이 중요
  → **전문의와 충분히 상의하고 결정**
- **디스크 탈출증**: 디스크 자체를 제거하는 경우가 흔함
- **고연령이거나 척추협착증이 오래된 경우**: 척추체 사이에 **인공디스크**를 넣고 문제 디스크를 완전히 제거한 뒤 **뒤쪽에서 척추를 안정적으로 고정하는 유합술** 진행

### 7) 재발이 잘 되는 이유 ★
① **디스크는 혈관이 풍부한 조직이 아님** → 산소·영양분이 **주위 조직의 확산**으로 공급되므로 **한 번 손상되면 회복이 매우 더딤**
② 허리디스크는 **잘못된 습관이나 자세** 때문에 생기는 경우가 많은데 **그 습관과 행동이 쉽게 고쳐지지 않기 때문**

### 8) 위험요인·예방
- **위험요인**: **나이, 성별, 작업 환경, 비만, 흡연, 유전적 요인**
- **예방**
  - **잘못된 습관 개선**
  - **허리에 무리가 가는 운동 피하기**
  - **척추체 옆의 중요 근육을 단단하게 하는 코어 운동 추천**
- **발생 시 대처**: 아픈데도 무리해서 움직이는 것보다 **증상이 호전될 때까지 쉬는 것이 나음**
- **척추 수술 후 통증 증후군**: 수술 후 허리에 통증이 생기는 경우
  → **여러 번 수술하기보다 원인을 정확히 규명하는 것이 중요**

### 9) 바르지 않은 자세의 문제점 ★★
- 척추 변형 → 주변 근육이 제대로 움직이지 못해 **붓고**, **혈액순환 저하**,
  **영양 성분 전달·수분 배출 기능 약화** → 몸이 약해지고 잘 붓게 됨 → **노화 촉진**
- **척추뼈는 매일 새 세포가 낡은 세포를 대체해야 골격이 유지**되는데,
  나쁜 자세로 척추가 휘면 이 과정이 활발하지 않아 **골다공증이 빨리 발생**
- **거북목(일자 목)**: 컴퓨터 작업이 많아 경추가 비정상적인 일자 목이 되면
  **눈·코·입과 관련된 경추 근처 신경이 눌려 코 염증이 생기고 눈도 침침해짐**
- **흉추(가슴 근처 척추)가 비뚤어지면**: **폐와 심장을 압박** → **조금만 뛰어도 숨이 차거나 현기증**

### 10) 바른 자세 실천 ★★
- **사무실**: **모니터 화면과 눈높이를 일치**시켜야 허리를 바로 펼 수 있음. 항상 **책상 가까이 당겨 앉고 허리는 의자 등받이에 밀착**
- **휴대폰**: 고개를 숙인 자세가 반복되면 거북목 발생 → **휴대전화를 눈높이로 올려 사용**
- **주방 일**: **15~20cm 정도의 발 받침대에 발을 번갈아 올려놓고** 일하면 척추에 무리가 덜 감
- **잘 때**: **천장을 바로 보고 눕는 것이 가장 좋고**, 베개는 **방석 두 개 정도 높이**가 적당
  → **엎드려 자는 것은 척추가 비틀릴 수 있으므로 피하기**
- **걷기**: 등쪽과 어깨뼈 사이에 힘을 모은다는 생각으로 **가슴과 어깨를 자연스럽게 펴고 배를 집어넣은 뒤 엉덩이를 조여 올리는 기분으로 11자**로 걷기
- **신발**: **발등을 감싸는 것**이 좋고, **밑창은 0.5cm 이상**으로 충격을 부드럽게 흡수해야 함

## 50강. 알고 먹어야 안전한 건강기능식품

### 1) 부족한 영양소 ★
- **2015년 우리나라 국민 영양 평가**: **칼슘이 부족**한 편
  → 칼슘 하루 권장 섭취량 **약 700mg**인데 실제는 **약 490mg** 수준
- **여중생·여고생**은 생리를 시작하는 나이여서 **철분**이 필요한데 **섭취량이 부족**
- **인스턴트 식품** 때문에 **열량(칼로리)은 많이 섭취하는 데 비해 무기질이나 영양소는 부족**하다는 연구 결과

### 2) 건강기능식품의 작용 ★
- "간에 좋은 것, 눈에 좋은 것이 따로 있다"고 생각하기 쉬우나 **모든 것이 상호 작용으로 진행**
- → **맹신하면 안 되며**, 이것저것 많이 챙겨 먹으면 **상호작용으로 부작용이 생길 수 있음**

**비타민제의 3분류**
| 구분 | 내용 |
|---|---|
| **단일 비타민제** | 한 가지 성분 |
| **복합 비타민제** | **비타민 2~4가지** 정도가 들어 있음 |
| **종합 비타민제** | **비타민 A·B·C·D·E와 무기질**까지 함께 |
- → 상황에 따라 **단일이냐, 복합이냐, 종합이냐**를 나눠서 복용해야 함

### 3) 나에게 부족한 영양소 알기 ★
- 영양소는 **사람마다 흡수율이 다르고 질환별로도 흡수할 수 있는 것이 다름**
- 예: **위궤양이나 만성 위축성 위염**이 있으면 위산이 너무 많거나 적어서
  → **어떤 비타민제를 복용해도 다 파괴되거나 흡수가 안 되어 소용이 없음**
- **식습관에 따라 파악 가능** → **어머니가 가장 잘 알 수 있음**
  - **변비**가 있는 사람 → **식이섬유 부족**
  - **골다공증이나 어려서부터 성장 장애** → **칼슘 또는 비타민 D 부족** 의심
- → 증상을 **가족과 얘기해보고 동네 주치의와 상의**하면 자신에게 맞는 비타민제를 찾을 수 있음

### 4) 영양제의 필요성
- 부족한 영양소는 **음식으로 직접 섭취하는 것이 좋으나 현실적 어려움**이 있어 영양제 병행이 필요
- 예: **칼슘이 많은 음식으로 시금치**가 추천되지만, **하루 권장량만큼 먹으려면 광주리 가득**한 분량
- **40대가 되면, 특히 여성이 갱년기를 맞이한다면 칼슘제를 똑똑하게 복용**하는 것이 도움

### 5) 영양제의 등급 ★★
> **질병 발생 위험 감소** > **생리활성 1등급** > **생리활성 2등급** > **생리활성 3등급**

| 등급 | 의미 |
|---|---|
| **질병 발생 위험 감소** | **질병 발생 위험 감소** 등의 의미 |
| **생리활성 1등급** | **도움을 줌** |
| **생리활성 2등급** | 어떤 기능에 **도움이 될 수 있음** |
| **생리활성 3등급** | 도움을 줄 수는 있지만 **미흡** |
- 무조건 도움이 되는 것이 아니라 **"이러한 경우에 특정 질환에 도움이 된다"**는 식으로 등급이 나뉜 것
- **안전 마크 확인**: **건강기능식품 인증 마크, 식품의약청 마크, GMP 마크**

### 6) 영양제의 궁합 ★★
**좋은 궁합**
- **철분 + 비타민 C** → **철분 흡수율 상승**
- **비타민 E + 마그네슘·아연** → 흡수율 상승
- **오메가3 + 코엔자임** → 소장에서 흡수에 도움

**나쁜 궁합**
- ⚠ **비타민 E + 칼슘** → **지혈 장애와 소화 장애** 발생 가능성 상승

### 7) 상황별 영양제 선택 ★
| 상황 | 추천 |
|---|---|
| **술자리가 잦을 때** | **비타민 C + 실리마린(실리바린) 제제** |
| **다이어트** | **비타민 C + 콜라겐** |
| **70대 이상** | **종합비타민제 + 아연** |
| **피로** | **비타민 C + 항산화제** |
| **종합비타민제 선택 시** | **이산화규소가 없는 것**으로 선택 |

## 51강. 응급처치 ― 휴가철 응급상황

### 1) 해파리 ★
- 머리카락 같은 **침**에 쏘임 → 가려움증·부어오름부터
  **신경을 마비시키는 독소, 혈압을 떨어뜨리는 독** 등 여러 독이 있을 수 있음
- ⚠ **처음에 괜찮았다고 안심하지 말고 지켜봐야 함**
- **응급처치 순서**
 ① **물 밖으로 나오기**
 ② **따뜻한 바닷물로 씻어내기**
 ③ 남아 있는 것은 **카드 같은 것으로 긁어내어 제거**
 ④ **피부 치료**
 ⑤ 증상이 나아지지 않으면 **가까운 병원으로 신속히**

### 2) 물놀이 중 손발 경련 ★
- 심한 운동은 근육이 뭉치고 경련을 일으킴 → 수영 중이면 매우 위험
- **예방**: 과하게 수영하지 말고 **미리 몸을 충분히 풀고 자기 실력만큼만**
- **대처**
 ① 경련이 반복될 수 있으므로 **도움을 청하는 것이 가장 먼저**
 ② **뭉친 근육을 억지로 쓰려고 하면 안 됨**
 ③ 자유형 중이었다면 **다른 수영 방법으로 바꿔** 뭉친 근육을 쓰지 않고 물 밖으로 나오기

### 3) 장시간 수영 후 체온 저하 ★★
| 체온 | 상태 |
|---|---|
| **36.5도** | 정상 체온 |
| **34~35도** | **몸이 많이 떨림** (체온이 떨어져 몸 안에서 열을 만드는 것) |
| **32~33도** | **더 이상 몸에서 열을 만들어 낼 수 없는 상황** |
| **32도 이하** | 계속 떨어질 수 있으며 **심장에 부정맥 → 갑작스러운 심정지** → **익사** 가능 |

### 4) 물에 빠졌을 때 ★
- **구명조끼**를 입고 물놀이를 하는 것이 좋음
- ⚠ 물에 빠진 사람을 **직접 들어가서 구하려다 같이 사망**하는 사고가 매년 발생
  → **잡을 수 있는 것을 먼저 던져주고 그 다음에 꺼내려고 하는 것이 더 안전**

### 5) 화상의 분류 ★★
| 구분 | 손상 범위 | 특징 |
|---|---|---|
| **1도 화상** | **표피층만 손상** | 햇볕에 데었을 때처럼 **따끔거리고 발갛게 부음**. 화끈거리지만 **빨리 나음** → **식혀주고 상처가 덧나지 않는지 살피기** |
| **2도 화상** | **진피층까지 손상** | **물집(수포)**이 있음. 손상된 피부에서 물이 스며 나옴. **흉터가 생길 수 있고**, 심한 수포는 **탈수·심한 통증**이 지속될 수 있음 |
| **3도 화상 (전층 화상)** | **피부 전층 손상** | 보기에는 2도와 똑같을 수 있으나 **피부 신경까지 손상되어 통증이 없음**. **피부가 재생되지 않아 흉터가 생기고 피부 이식이 필요**한 경우가 많음 |

### 6) 수포 처치와 화상 관리 ★★
- **작은 수포는 터뜨리지 않아도 됨** → 수포 자체가 **피부를 보호하는 역할**
- **큰 수포, 피가 섞인 수포**는 **죽은 세포들이 모여 있는 것**이므로 **진물을 빼고 터뜨려 주는 것이 좋음**
- ⚠ **된장 등 민간요법 금지** — 예전에는 좋은 약이 없어 도움이 됐지만,
  **된장이나 알코올은 소독은 되어도 정상세포까지 손상**시켜 **상처가 늦게 나음**
- 핵심: **화상은 일주일 내에 나으면 흉터 없이 나을 수 있음**
  → 빨리 낫게 하려면 **감염되거나 덧나지 않아야 함**
  → **항생제 연고**를 바르거나 **습윤밴드**를 붙이는 것이 좋음

### 7) 벌레 물림·골절
- **벌레 물림**: 아이는 피부가 약해 **봉와직염**이 잘 생기며, 어른도 **세균 감염**이 일어날 수 있음
  → 물린 곳에 **고름**이 잡히고 긁으면 감염이 옆으로 번짐 → **항생제 치료**
- **캠핑장 골절·염좌**: 바닥이 울퉁불퉁하고 텐트 줄이 많아 어두울 때 넘어지기 쉬움
  → 관절이 부으면 **압박붕대나 압박밴드로 흔들리지 않게 고정**
  → 계속 부어오르면 잘 낫지 않으므로 **얼음주머니를 올려두면 붓기도 가라앉고 통증도 빨리 줄어듦**

### 8) 안전한 휴가를 위한 기본 준비품 ★
- **지혈에 좋은 붕대, 거즈**
- **상처에 바를 연고**
- **항생제 연고**
- **벌레 물림에 쓸 알레르기 연고**

## 52강. 응급처치 ― 소아 응급상황 대처법

### 1) 고열의 정의 ★
- **약 38도** 정도면 **열이 난다**고 함
- 그보다 높은 **39~40도** 정도를 **고열**이라고 정의
- 해열제를 먹여도 **떨어지지 않거나 금방 다시 열이 나는 경우**도 고열로 볼 수 있음

### 2) 열이 나는 순서 ★★
> **열은 위에서부터** — **머리가 뜨거워지고 → 몸이 뜨거워지고 → 발이 뜨거워지는** 순서

### 3) 아이가 열이 날 때 대처 ★★
- ⚠ **잘못된 방법**: 옷을 계속 벗겨놓고 에어컨 바람 쐬기 / 찬물에 넣기 / 알코올 발라주기

**단계별 올바른 대처**
| 시점 | 상태 | 대처 |
|---|---|---|
| **열이 시작할 때** | **팔다리가 차갑고 온몸이 떨리는 오한·몸살** (39도라도 매우 추워함) | **벗기면 안 되고, 해열제를 빨리 주는 것이 좋음** |
| **열이 다 났을 때** | 온몸이 더워진 상태 | **해열제를 여러 번 먹여도 효과가 없으므로, 옷을 벗기고 닦아주는 것이 좋음** |

### 4) 해열제 사용 ★
- 보통 약은 **하루 2~3번** 먹게 되어 있으나, 고열이 있는 아이는 그 정도로 체온이 안 떨어짐
- ⚠ 해열제를 많이 먹으면 **간이나 콩팥에 부담** → **하루 최대량이 정해져 있으므로 정해진 용량 안에서** 사용
- 그러나 열이 계속 나는데 **4시간을 기다리며 약을 안 주는 것도 좋은 방법이 아님**
- **요령**: **열이 시작할 때 빨리 해열제를 주고**, 열이 높아졌더라도 **몸이 다 더워지고 식어가는 중이라면 주지 않고 조금 기다리기**
  → **줄 때와 안 줄 때를 구분하면 약을 덜 쓰면서 약효를 볼 수 있음**

### 5) 소아 낙상 ★★
- 어린이는 **머리가 크므로 넘어지면 언제나 머리를 다치게 되어 있음**
- **위험한 낙상**: 머리를 부딪쳐 **뇌출혈**이 생기는 경우
  → 시간이 지날수록 악화되어 **뇌수술**이 필요할 수 있음
- **특히 위험한 경우**
 ① **자기 키보다 훨씬 높은 위치에서 머리부터 떨어질 때**
 ② **18개월에서 2세 미만** — 아이는 태어날 때 머리뼈가 붙어 있지 않고,
   **대개 18개월 정도까지는 머리뼈가 단단하지 않아** 머리를 다치면 더 위험

### 6) 머리에서 피가 날 때 보호자 대처 ★★
- **가장 먼저 할 일은 지혈**
- 보통은 **상처를 눌러주면 지혈**되지만, **무릎처럼 튀어나온 부분**은 자꾸 터짐
- **머리도 동그랗기 때문에 눌러도 피가 잘 안 멎는 경우가 많음**
  → **머리카락을 양쪽에서 오므리듯이 모아서 눌러주면** 일단 응급처치가 됨

> ※ 본 강의 원문 중 일부(피가 계속 날 때의 추가 조치)는 교재의 인쇄·스캔 상태로 판독이 어려운 부분이 있습니다.

## 53강. 일상의 재난이 된 미세먼지

### 1) 초미세먼지 ★
- **입과 코로 들어와 폐로 들어간 다음**,
  마지막으로 **폐포와 혈관이 소통·교환하는 과정에서 혈관으로 들어가** 문제를 일으킴

### 2) 증상 ★
- **목이 칼칼한 것과 같은 염증 유발**
- **천식 환자는 각별한 관리 필요**
- **호흡기뿐 아니라 심혈관계 질환에도 영향** → **심장에 답답함을 느끼면 적극적 치료 필요**

### 3) 마스크 착용법 6단계 ★★
① **마스크를 만지기 전에 손을 씻기**
② **양 손으로 마스크의 날개를 펼치고 날개 끝을 잡아 오므려 주기**
③ **고정심이 내장된 부분을 위로 해서 잡고, 턱 쪽에서 시작하여 코 쪽으로 코와 입을 완전히 가리기**
④ **머리끈을 귀에 걸어 위치를 고정하거나, 끈을 머리 뒤쪽으로 넘겨 연결고리에 양쪽 끈 걸기**
⑤ **양 손의 손가락으로 고정심 부분이 코에 밀착되도록 누르기**
⑥ **양 손으로 마스크 전체를 감싸고 공기가 새는지 체크하면서 얼굴에 밀착되도록 조정하기**

### 4) 주의사항 ★★
- 착용 후 **호흡곤란, 두통 같은 불편감**이 느껴지면 **바로 벗어야 함**
- **호흡기 질환자는 의사와 상의한 후 보건용 마스크 착용**
  → **만성 폐쇄성 폐질환, 천식 환자** 등은 마스크를 쓴 채 계속 지내면
    **몸의 산소가 저하되고 이산화탄소가 올라가 호흡곤란이 악화**될 수 있음
- **임산부**도 임신 후기로 갈수록 그런 문제가 생길 수 있으므로,
  **실내에서 마스크를 쓰고 움직여보아 호흡곤란이 없음을 확인한 후** 착용

### 5) 코는 신이 만들어준 필터 ★★
**코가 신비한 필터인 이유 3가지**
① **코털** ② **코 안의 섬모**(미세먼지를 걸러줌) ③ **공기가 습해지고 온도가 올라가는 효과**
- 습한 공기와 올라간 온도는 **그 아래의 기관지를 보호**해줌
- → **미세먼지는 입으로 들어가는 것보다 코로 들어가는 것이 조금 더 나음**

### 6) 상식
- **마스크를 안 챙겼으면 손으로라도 입을 막기**
  → 미세먼지가 첫 번째로 일으키는 문제는 **입 안 구강점막의 국소 염증**
  → 그 국소염증이 결국 **온몸으로 퍼져 전신염증**을 만들기 때문
- **짧은 시간 사용한 미세먼지 마스크는 다시 써도 괜찮음**

## 54강. 태양이 만드는 재난, 자외선

### 1) 자외선의 양면성 ★
**나쁜 점**
- **기미, 잡티, 주름**이 생기게 하는 원인
- **피부암**

**좋은 점**
- 피부의 **살균 작용**
- 자외선 중 **특정 파장을 추출해 실제 치료에 이용**

### 2) 피부색에 따른 차이 ★
| 피부 | 특징 |
|---|---|
| **흰 피부** | 천연 자외선 차단 역할을 하는 **색소가 부족** → **화상 및 암에 걸릴 확률이 더 높고 노화가 빨리 진행** |
| **까만 피부(멜라닌 많음)** | **노화가 조금 천천히** 진행되나 **켈로이드 등의 질환이 더 많이 생김** |

### 3) 자외선의 종류 ★★
| 종류 | 비율 | 특징 |
|---|---|---|
| **UVC** | – | **오존층에서 걸러짐** |
| **UVA** | **지구에 도달하는 자외선의 약 90%** | **아주 약하지만 양이 많고 피부 깊숙이 침투** → **콜라겐을 파괴**하고 **기미·잡티의 원인** |
| **UVB** | **약 10%** | **아주 강력**. **해수욕장에서 피부가 벗겨지는 것은 거의 UVB 때문** |

### 4) 자외선 차단제 ★★
- **SPF = UVB를 차단**해주는 지수
- **PA = UVA를 차단**해주는 지수
- **SPF 50까지는 차단률이 올라가다가 50~100은 비슷비슷** → **내 피부에 맞춰 선택**
- **숫자의 의미**: **SPF 15 = 자외선을 15분의 1로 줄여줌**, **30 = 30분의 1**, **50 = 50분의 1**
- **PA의 플러스(+) 표시는 많을수록 좋음**
- **덧바르기**: 여름철에는 피부 노폐물과 야외 활동으로 차단제가 사라지므로
  **2시간 또는 3~4시간 단위로 반복해서 덧발라주는 것이 안전**
- ⚠ **자외선 차단 기능이 있는 화장품**은 **바르는 양을 많이 해야 효과**를 발휘하므로
  **자외선 차단제를 대신할 것이라 생각하면 안 되며, 차단제를 정량으로 사용**해야 함

### 5) 알쏭달쏭 자외선 상식 ★★
- **비 오는 날·흐린 날에도 발라야 함**
  → **기상청이 지난 10년간 목포와 포항**에서 맑은 날부터 비 오는 날까지 단계적으로 조사
  → **맑은 날의 자외선량을 100이라 할 때, 아주 흐리고 구름이 꽉 낀 날에도 약 50%**
- **비나 땀에 차단제가 녹아내렸을 때 눈이 따갑거나 시리면 → 안 맞는 제품이므로 교체**
- **눈(雪) 속에서는 반사량 때문에 자외선이 일반 대비 50% 상승** → **눈 오는 겨울에도 차단제는 유효**
- **실내에서도 차단제 사용 권장**
  → **창이 있는 공간은 밖과 거의 유사한 양의 자외선**이 있음
  → **지하실**도 미미하지만 **전등에 의한 자외선**이 있을 수 있음
- **옷과 자외선** ★
  → **긴팔이라도 헐렁헐렁하고 통풍이 잘 되는 옷은 자외선 투과가 많음**
  → **딱 붙은 반투명·불투명한 옷**이 오히려 더 나을 수 있음
  → **차단제에 알러지가 심한 사람은 긴팔·긴바지가 훨씬 더 안전**할 수 있음

## 55강. 심근경색과 응급처치

### 1) 정의와 통계 ★★
- **심장 근육에 혈액을 공급하던 혈관이 막히는 상태가 지속되면서 심장 근육 일부가 괴사**하는 상태
- **사망 원인: 암에 이어 심혈관계 질환이 2위**
- **심장 질환 사망자의 5~10%**는 심근경색이 직접적 원인
- ⚠ **심근경색은 응급실 도착 전에 30%가 이미 사망**

### 2) 증가 원인
- **고혈압·당뇨·고지혈증 환자 증가**
- **평균 수명 증가**
- **발병률에 비해 낮은 관심**
- **늦은 치료 시기**

### 3) 환자의 공통점 ★
- **화가 나거나 흥분 상태인 경우가 많음**
- ⚠ **화가 난 상태에서 격한 운동을 하면 심근경색 위험이 3배로 상승**
- **연령대별로는 70대가 가장 많으며, 50대 이상이 대부분**

### 4) 증상과 감별 ★★
| 질환 | 통증 양상 |
|---|---|
| **역류성 식도염** | **바늘로 찌르는 듯한** 가슴 통증 |
| **심근경색** | **가슴이 조여오는 듯한 답답한 느낌**과 가슴 통증 |
- ⚠ **노년층은 심근경색 전조 증상이 나타나지 않으므로** 심장 검사, 내시경 등 진단이 필요

### 5) 응급 대처법 ★★
- **니트로글리세린을 혀 밑에 녹여 복용하거나 스프레이 형태로 뿌려 관상동맥을 확장**
- 평소에 **응급약의 사용법과 119 신고 매뉴얼 등 응급조치법을 환자와 가족이 정확히** 알고 있어야 함

**대처 순서**
> **주변·119에 도움 요청 → 환자의 의식 확인 → 심장 박동 유무 확인 → 심폐소생술 실시**

### 6) 심폐소생술 ★★
① **가슴이 5~6cm 들어갈 정도의 강한 압박**
② **팔은 곧게 편 상태에서 수직으로 압박**
③ **1분당 100~120회 속도로 30회 단위로 흉부 압박을 반복 실시**

### 7) 골든 타임 ★
- **심근경색의 골든 타임은 대개 3~6시간 이내**
- 예방을 위해 **성인병 관리, 비만 관리** 필요

### 8) 여성 심근경색 ★★
**원인**
- **폐경 이후 여성 호르몬 감소**
- **저밀도(LDL) 콜레스테롤 축적으로 인한 동맥경화**
- **심장 주변 혈관과 심장벽의 경화**

**여성의 사망률이 남성보다 높은 이유**
- **신체 구조상 악화 속도가 더 빠름**
- **다양한 전조 증상 때문에 다른 병으로 착각**하여 **병원을 찾는 시각이 늦음**

**전조 증상**
- **가슴 쪽이 메스껍고 체한 느낌**
- **전신 피로 및 심하게 숨이 참**
- **등이나 팔, 다리 통증**

**예방**
- **1년에 한 번 심장 검진**
- **채소·과일·해조류 섭취**

## 56강. 건강과 교통안전

### 1) 졸음운전의 원인 ★
- **운전은 시각적인 변화가 많지 않아** 집중력을 떨어뜨리거나 졸음을 유발
- **불면증**
- **수면의 질이 낮을 때**
- **7~8월의 열대야**
- **에어컨으로 인한 차내 이산화탄소 증가**

### 2) 졸음운전 막는 법 ★
- **껌이나 초콜릿 섭취**
- **대화**
- **일정한 시간 주기로 휴식**
- **운전 교대**

### 3) 안전띠 ★★
| 상황 | 중상 가능성 |
|---|---|
| **안전띠를 느슨하게 풀어주는 장치 사용** | **50%에 육박** (제대로 맸을 때보다 **약 5배**) |
| **안전띠 미착용 + 경고음 방지 클립 장착** | **80% 초과** |
| **아이가 안전띠를 매지 않고 뒷좌석 놀이방 매트에 앉아 있었던 경우** | **최대 99.9%** (카시트 정상 착용 대비 **약 9배**) |

- 전문가 지적: **안전띠를 제대로 매지 않으면 충돌 시 앞으로 쏠리는 힘이 더 세져 에어백의 충격 흡수 효과도 줄어들 수밖에 없음**

### 4) 음주운전 ★
- 최근 5년간 **음주운전 발생 건수는 축소 중**이나 **재범률은 여전히 높음**
- "무서워서 절대 안 한다"는 사람은 아예 안 하지만, **하는 사람이 자꾸 하는 경향**
  → 그 이유는 **처벌이 의외로 무겁지 않기 때문**
- **미국**: 음주운전에 한 번 걸리면 **기본 천만 원 이상** 지출
- **우리나라**: 단순 음주는 **벌금 백만 원에서 삼백만 원** 정도
- **2018년 윤창호법이 국회를 통과**하며 음주운전 관련 처벌이 강화됨

## 57강. 생명을 보호하는 직업안전

### 1) 건설 현장 안전사고 ★★
**타워크레인 사고 (2017년 기준 지난 5년)**
- 사망자·중상자가 발생한 사고 **모두 25건**, **사망자만 38명**
- **2017년 한 해에만 16명**이 목숨을 잃음

**원인**
- 크레인을 **외부업체에서 빌려 사용**하다 보니 제대로 된 관리가 안 됨
- 작업자들이 **작동법을 숙지하지 못함**
- **부품을 마구잡이식으로 조립**하거나 **노후된 장비를 투입**

**건설공사 현장 산업재해**
- **2012년부터 2016년 중순까지 30대 건설사 시공 현장에서 사망한 근로자 모두 327명, 연간 73명 꼴**
- **다친 사람은 4천2백여 명**

**대책**
- 건설 현장에 **정보통신 기술(ICT) 활용** 시도
  → 용접 시 공간 내 **산소가 일정 수치 이상 떨어지면 경고 알람**, 관리자도 **모바일로 실시간 확인**
- **사물인터넷(IoT)을 활용한 산재 예방** 시도가 본격화될지 주목

### 2) 과로와 업무상 재해 ★★
- 근로자가 **뇌혈관이나 심장 질환으로 숨졌을 경우**,
  **일주일에 평균 60시간 이상** 일했을 때 통상적으로 **업무상 재해가 인정**됨
- 그러나 최근 **업무시간이 업무상 재해를 판단하는 절대적 기준이 될 수 없다**는 법원 판결

**판례 ① — 항공사 사무장 사례**
- 독일행 비행 근무를 위해 집을 나선 **42세 조 모 씨**가 회사에 주차된 승용차에서 **뇌출혈로 사망**
- **근로복지공단**은 업무시간이 **월 평균 109시간**으로 **정부의 과로 기준(주당 평균 60시간 이상)에 미치지 못한다**며 유족 급여와 장의비 거부
- **법원은 업무상 재해를 인정**
  → 이유: **국제선 장거리 비행으로 며칠 사이 밤낮·계절이 바뀌는 등 업무가 불규칙**했고,
   **지상보다 낮은 기압, 계속되는 소음과 진동, 협소한 휴식처** 등 근무환경이 열악

> ★ **의미**: 업무의 과중 여부를 **단순 업무 시간만으로 판단해서는 안 되며**,
> **업무의 강도, 책임, 정신적 긴장의 정도, 수면시간** 등 여러 조건을 함께 고려해야 함

**판례 ② — 노조위원장 사례**
- **2015년** 임금 단체 협상이 치열하던 시기, 연초부터 **6차례에 걸쳐 사측과 협상**하던
  한화그룹 **노조위원장**이 노조건물 화장실에서 쓰러진 채 발견 → **뇌출혈과 사지마비** 진단
- 요양급여 신청이 거절되어 소송 → 법원은 **임금 협상 당시의 상황에 주목**
- 2015년 쟁점: **상여금을 통상임금에 포함할지**와 **임금피크제 도입**
  → 노조 지부별 입장 차이가 커 **사측이 정한 시한을 맞추지 못했고, 쓰러진 때가 바로 마감 시한 다음 날**
- **재판부는 통상적인 업무 스트레스를 넘는 정도로 보는 것이 타당하다며 업무상 재해 인정**

### 3) 특성화고 실습생의 눈물 ★★ (교사에게 특히 중요)
- 최근 현장실습에서 **학생 사망, 초과근무, 성희롱** 사고가 발생
- **특성화고등학교**: **특정 분야의 인재, 전문직업인 양성**을 목적으로 설립되어
  **교육과 현장실습 등 체험 위주 교육**을 전문적으로 실시
- 학생들은 산업 현장에서 직무를 수행하며 **취업에 대비한 직무수행 지식과 기술을 습득**하는 것을 목적으로 현장실습 수행

**법적 보호 — 「직업교육훈련촉진법」 ★★**
- **하루에 7시간 이상 초과 근무할 수 없음**
- **휴일 근무·야간 근무 금지**
- **위반 시 2년 이하의 징역 또는 2,000만 원 이하의 벌금**
- ⚠ 그러나 현장에서는 이런 규정들이 **무시되는 현실**

**구조적 문제점**
- 학생들은 **미성년자인 청소년**이라 부당한 대우를 받아도 **어른들에게 항의하기 어려움**
- 선생님에게 얘기해도 **그 선생님이 적극적으로 해결해주지 않으면 인권 사각지대**가 됨
- **문제 학생이 많이 발생할수록 학교와 해당 업체의 관계가 나빠지므로**,
  **학교 측이 곤란한 상황을 회피하려고 문제를 축소하려는 경향**이 발견됨

## 58강. 건강과 안전을 위협하는 스마트폰 중독

### 1) 학생들의 인터넷·스마트폰 중독 ★★
- **전국 청소년 141만여 명 조사 결과**
  → **14.3%인 20만 2천4백여 명**이 **인터넷·스마트폰 위험·주의 사용자군**
  → **청소년 7명 중 1명 꼴**
- **성별 차이**: **남학생은 게임**에 빠지고, **여학생은 인터넷·SNS를 주로 이용**하며 **스마트폰에 더 중독**된 것으로 분류

### 2) 스마트폰 배터리의 위험성 ★
- **일본 소방청 실험 결과**
  → **과도한 충격과 압력을 가하거나 과도한 충전**을 할 경우
  → **전기 흐름을 막는 내부 절연재가 파손** → **합선** → **화재**
- **사고의 전조증상** (있으면 사용 중지)
  - **배터리 충전이 잘 안 됨**
  - **손으로 쥐지 못할 정도로 뜨거워짐**
  - **부풀어 오름**

### 3) 스마트폰과 사회적 상호관계 ★
- **SNS를 많이 사용하는 사람들이 실제 동료와의 관계에서는 안정감을 느끼지 못하고,
  대신 사회적 보상을 위해 SNS를 더 많이 사용**하는 양상
- **SNS를 통한 상호작용이 실제적인 사회적 상호작용을 대신하기 어려움**
- **SNS에 과의존을 보인다면 인지조절 능력이 약해졌다고 볼 수 있음**
- → 스마트폰 사용을 **스스로 모니터링**하고, **정한 목적 외로 과도하게 사용**하는 것이 확인되면 **의식적인 조절이나 도움**이 필요

### 4) 디지털 치매 자가진단 ★★
① **외우는 전화번호가 거의 없음**
② **전체 가사를 외우는 노래가 거의 없음**
③ **생일이나 기념일을 잘 기억하지 못함**
④ **웹사이트의 아이디와 비밀번호를 잘 기억하지 못함**
⑤ **사람의 이름을 잘 기억하지 못함**
⑥ **물건을 사고 거스름돈 계산이 바로 되지 않음**
⑦ **주변 사람과 대화 중 80%는 메신저나 이메일로 함**
⑧ **이미 한 이야기를 반복한다는 지적을 받음**
⑨ **오늘이나 어제 먹은 메뉴가 생각나지 않음**
⑩ **내비게이션 없이 길 찾기가 어려움**

> **판정: 2개 이상 → 초기 / 절반 이상(5개 이상) → 디지털 치매**

**대처**
- 스마트 미디어 기기를 안 쓸 수는 없으므로 **의존하는 시간을 제한하고 정해진 목적으로만 사용**
- **웬만한 내용은 되도록 암기하고, 손으로 직접 쓰며, 직접 계산**해 **의존도를 낮추기**

## 59강. 약물, 음주, 카페인이 망치는 것들

### 1) 약물 오남용 — 편두통 ★★
- **편두통**은 **CT나 MRI를 찍어도 아무것도 나타나지 않지만**,
  **일상생활을 못 할 정도로 통증이 반복**되며 **속이 메슥거리거나 구토가 나오려는 느낌**
- **1차적 발병 원인은 유전적 요인이 크지만, 진통제를 오남용해서 악화**시키는 경우도 다수
- ⚠ **1회성 두통은 진통제로 나아질 수도 있지만, 만성 편두통은 진통제가 아니라 '예방제'를 써야 함**
- **커피**: 상태가 가벼울 때는 한 잔이 두통을 덜어주기도 하나,
  **대부분은 카페인이 상태를 더 악화**시키므로 **커피는 끊는 것이 좋음**
- ⚠ **6시간 이상의 공복 상태는 뇌혈관을 자극해 두통을 유발** → **머리가 아파도 끼니는 거르지 않기**

### 2) 마약 ★
- 최근 **마약이 청소년들에게까지 퍼지는 증가 추세가 매우 빠름**
- **전파의 가장 큰 요인**
 ① **인터넷을 통한 정보 공유 증가**
 ② **국제우편·국제특송의 일반화로 마약 유통이 쉬워진 현실**

### 3) 음주와 암 ★★
**가벼운 음주자(소량의 음주)**
| 암 | 비음주자 대비 위험 |
|---|---|
| **식도암** | **50% 높음 (최대 1.5배까지 상승)** |
| **대장암** | **12% 높음** |
| **위암** | **5% 높음** |
- ⚠ **소주 1잔 미만으로 알코올 섭취량이 아주 적은 경우에도** 식도암·위암·대장암 발생 위험은 높아짐

**과음자(소주 4잔 초과)**
| 암 | 비음주자 대비 위험 |
|---|---|
| **식도암** | **3.1배** |
| **위암** | **1.2배** |
| **대장암** | **1.3배** |

- ⚠ **음주에 흡연까지 더해지면 식도암 발생 위험이 최대 5.6배까지 상승**

### 4) 카페인의 영향 ★★
- 카페인은 **체내 흡수가 매우 빨라 혈관을 통해 약 5분이면 몸 전체에 흡수**
- **콩팥 위에 있는 부신을 자극해 아드레날린 호르몬을 많이 분비**하게 만들어
  **심장·뇌·근육 등의 활동을 자극**
- **에너지 음료 섭취 시 증상**
  - **맥박 수가 빨라져 가슴이 두근거림**
  - **불면증**
  - **어지럼증, 호흡곤란**
- → **카페인 분해 효소가 부족한 사람은 가능하면 피하거나 최소한의 양만 섭취**

### 5) 카페인 섭취 권장량 (식약청 기준) ★★
| 대상 | 하루 권장량 |
|---|---|
| **성인** | **400mg 이하** |
| **임산부** | **300mg 이하** |
| **어린이·청소년** | **체중 1kg당 2.5mg** |

- ⚠ 우리나라에서 많이 팔리는 **고카페인 에너지 음료는 1캔에 약 50mg~100mg**의 카페인 함유

## 60강. 분노조절장애 관리로 폭력 예방

### 1) 진단과 증가 원인 ★
- **진단**: 일반적인 관점에서 **'저 정도에 왜 저렇게까지 화를 내지?'** 싶은 사례
- **증가 원인**
 ① 예전에는 **병이라고 전혀 인식하지 못했는데** 요즘 많이 다뤄지며 **진단받는 사람이 증가**
 ② **경쟁, 불안 등으로 안 힘든 세대가 없는 사회 현실**

### 2) 뇌의 작동 원리 ★★
- **분노·화라는 감정은 뇌의 '변연계'가 담당** (뇌 깊숙한 곳)
  → 화가 날 때 그곳이 꿈틀하면서 **감정이 확 폭발해 올라옴**
- 그럴 때 **이마 쪽에 있는 '전두엽'이 그 감정을 적절하게 컨트롤**해줌
  → '참아야지, 지금 그럴 상황 아니야'라고 눌러주는 것
- ⚠ 그러나 **계속해서 스트레스가 쌓이면 뇌도 더 이상 견디기 힘든 상태**가 됨
  → 마치 **컴퓨터에 무리하게 프로그램을 계속 돌리면 에러가 나는 것**처럼

### 3) 자가진단 — 대한신경정신의학회 기준 ★★
① 나는 때때로 싫어하는 사람 앞에서 그의 험담을 늘어놓는다
② 나는 화가 나면 가끔 물건을 집어 던진다
③ 나는 상대방과 의견이 다르다면 그의 입장을 무시하고 내 입장만 말한다
④ 사람들이 내게 호통을 치면 나도 맞서서 호통을 친다
⑤ 나는 매우 흥분했을 때 누군가를 때릴 수 있다
⑥ 나는 때때로 시비조로 행동한다
⑦ 나는 거짓 협박을 자주 한다
⑧ 나는 논쟁할 때 언성을 높이는 경향이 있다
⑨ 나는 궁지에 빠지게 한 사람을 알면 끝까지 추적해서 싸운다
⑩ 나는 때때로 다른 사람을 해치고 싶은 충동을 느낀다

**채점**: **전혀 그렇지 않다 = 1점 ~ 매우 그렇다 = 4점**

| 점수 | 판정 |
|---|---|
| **~25점** | 충분히 그럴 수 있음(정상 범위) |
| **26점 이상** | **조금 위험** |
| **30점 이상** | **꽤 고위험군** |

### 4) 관리법 ★★
**15초법**
- 뇌의 특정 부분에서 화가 나고 **분노 관련 호르몬이 올라가기 시작하는데,
  호르몬이 절정을 찍는 데까지 보통 약 15초**가 걸림
- → **15초만 참으면 그 호르몬들이 다시 내려가므로, 15초를 세면서 참는 법**

**감정일기**
- **'나에게 어떤 일들이 있었다'는 식이 아니라, '오늘 어떤 감정들이 들었다'는 식으로
  감정에만 집중해서 최대한 자세하게 적는 방법**
- **감정을 표출하지 않아도 일기에 글로 옮겨 적으면 상당히 해소**됨

### 5) 상식 ★★
**화날 때 자주 참으면 분노조절장애가 생길까?**
- 분노조절장애는 크게 **충동적 타입**과 **습관적 타입**으로 구분
  - **충동적 타입** = **간헐성 폭발장애**
  - **습관적 타입** = 화를 내다 보니 계속 화를 내게 되는 것
- **사회적으로 분노를 학습하여 아주 작은 것에도 습관적으로 화를 내는 사람들이 존재**한다는 점에서,
  → **화날 때 자주 참는다고 분노조절장애가 생긴다고 보기는 어려움**

**화내기 전에는 드러나지 않는 분노조절장애**
- 분노조절장애를 가진 사람들의 특징은 **화를 내고 난 다음에 심하게, 진심으로 자책하고 후회**하는 것
- 평소에는 **온순하고 별 문제없는 사람처럼 지내다가 순간 나타남**
- **원인은 사람마다 약간씩 다름**
 ① **뇌파를 촬영하면 정상인과 조금 차이가 있다**는 결과
 ② **심리적인 영향**이 있다는 연구 결과
 ③ **어릴 때 그런 부모님의 모습을 보고 자라 자기도 모르게 따라 하게 됐다**는 이론

**소심한 사람과 분노조절장애**
- 소심한 사람은 일상에서 분노가 쌓일 일이 정말 많음 (집·회사·길거리)
- 보통 사람은 적당하게 화를 내지만, **너무 공손하고 소심한 사람은 겉으로는 마냥 착해 보여도
  분노를 적절히 풀지 못하면 계속 속에 쌓아놓게 됨**
- → **전혀 예측하지 못한 타이밍에 뇌의 전전두엽에서 충동을 더 이상 조절하지 못할 정도로
  과부하가 걸릴 때 분노조절장애가 튀어나옴**

/* ============ 마크다운 파서 (외부 라이브러리 없이 동작) ============ */
function mdInline(t){
  t=esc(t);
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" rel="noopener">$1</a>');
  return t;
}
function mdTableRow(l){
  l=l.trim().replace(/^\|/,"").replace(/\|$/,"");
  return l.split("|").map(function(c){return c.trim()});
}
function mdParse(src){
  var L=String(src).replace(/\r\n?/g,"\n").split("\n"), out=[], i=0;
  function flushList(marker,ordered){
    var tag=ordered?"ol":"ul", items=[];
    while(i<L.length){
      var m=L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if(!m)break;
      var depth=Math.floor(m[1].length/2);
      items.push({d:depth,txt:m[3]});
      i++;
    }
    // 2단계까지 중첩 처리
    var html="<"+tag+">", open=false;
    items.forEach(function(it,k){
      if(it.d===0){
        if(open){html+="</ul></li>";open=false}
        var nextDeep=items[k+1]&&items[k+1].d>0;
        html+="<li>"+mdInline(it.txt);
        if(nextDeep){html+="<ul>";open=true}else{html+="</li>"}
      }else{
        html+="<li>"+mdInline(it.txt)+"</li>";
      }
    });
    if(open)html+="</ul></li>";
    html+="</"+tag+">";
    return html;
  }
  while(i<L.length){
    var line=L[i];
    if(!line.trim()){i++;continue}
    var h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){out.push("<h"+h[1].length+">"+mdInline(h[2])+"</h"+h[1].length+">");i++;continue}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){out.push("<hr>");i++;continue}
    if(/^>\s?/.test(line)){
      var q=[];
      while(i<L.length&&/^>\s?/.test(L[i])){q.push(L[i].replace(/^>\s?/,""));i++}
      out.push("<blockquote>"+mdParse(q.join("\n"))+"</blockquote>");continue;
    }
    if(line.trim().indexOf("|")===0&&L[i+1]&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])){
      var head=mdTableRow(L[i]);i+=2;
      var body=[];
      while(i<L.length&&L[i].trim().indexOf("|")===0){body.push(mdTableRow(L[i]));i++}
      var t='<div class="tw"><table><thead><tr>'+
        head.map(function(c){return "<th>"+mdInline(c)+"</th>"}).join("")+"</tr></thead><tbody>"+
        body.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+mdInline(c)+"</td>"}).join("")+"</tr>"}).join("")+
        "</tbody></table></div>";
      out.push(t);continue;
    }
    var lm=line.match(/^(\s*)([-*]|\d+\.)\s+/);
    if(lm){out.push(flushList(lm[2],/\d/.test(lm[2])));continue}
    var para=[];
    while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|>|\s*[-*]\s|\s*\d+\.\s|\|)/.test(L[i])&&!/^\s*(-{3,}|\*{3,})\s*$/.test(L[i])){
      para.push(L[i]);i++;
    }
    if(para.length)out.push("<p>"+mdInline(para.join(" "))+"</p>");
    else i++;
  }
  return out.join("\n");
}

let Q={list:[],i:0,ok:0,got:[],mode:"ch",ch:null,title:""};
const TL={mc:"객관식",sa:"단답식",ox:"O · X"};

async function quizCh(no){
  const P=partOf(no);
  if(!P){go("");return}
  let d;
  try{d=await getPart(P.p)}catch(e){toast("문제 파일을 찾지 못했습니다");go("part/"+P.p);return}
  const c=d.chapters.filter(x=>x.no===no)[0];
  if(!c){go("part/"+P.p);return}
  let qs=c.questions.map(q=>Object.assign({},q,{ch:no,cht:c.title}));
  if(S.shuf)qs=shuffle(qs);
  if(S.nq>0&&qs.length>S.nq)qs=qs.slice(0,S.nq);
  Q={list:qs,i:0,ok:0,got:[],mode:"ch",ch:no,title:pad2(no)+"강 "+c.title};
  S.last=no;save();
  if(location.hash==="#/run")step();else goRep("run");
}
function startList(list,title,mode){
  if(!list||!list.length){toast("풀 문항이 없습니다");return}
  const cp=list.map(q=>Object.assign({},q));
  Q={list:S.shuf?shuffle(cp):cp,i:0,ok:0,got:[],mode:mode||"set",ch:null,title:title};
  if(location.hash==="#/run")step();else go("run");
}

function step(){
  if(!Q.list.length){go("");return}
  if(Q.i>=Q.list.length){result();return}
  const q=Q.list[Q.i];
  head(Q.title,(Q.i+1)+"/"+Q.list.length);
  let body;
  if(q.t==="mc"){
    body=q.c.map(function(o,i){
      return '<button class="op" data-i="'+i+'" onclick="pick('+i+')"><b>'+"①②③④⑤"[i]+'</b><span>'+esc(o)+'</span></button>';
    }).join("");
  }else if(q.t==="ox"){
    body='<div class="ox"><button class="op" data-i="1" onclick="pick(true)">O</button>'+
         '<button class="op" data-i="0" onclick="pick(false)">X</button></div>';
  }else{
    body='<input class="sa" id="sain" placeholder="답을 입력하세요 (비워두고 눌러도 됩니다)" autocomplete="off" autocapitalize="off" autocorrect="off">'+
         '<div class="gap"></div><button class="bt p" id="sabt">답 확인</button>';
  }
  const src=(Q.mode!=="ch"&&q.cht)?'<div class="src">'+pad2(q.ch)+'강 · '+esc(q.cht)+'</div>':"";
  vw.innerHTML='<div class="fade">'+
   '<div class="qh"><span class="qc">문항 '+(Q.i+1)+' / '+Q.list.length+'</span>'+
   '<span class="qr"><span class="tp">'+TL[q.t]+'</span></span></div>'+
   '<div class="qp"><i style="width:'+(Q.i/Q.list.length*100)+'%"></i></div>'+
   src+'<h2 class="qt">'+esc(q.q)+'</h2>'+
   '<div id="opts">'+body+'</div><div id="fb"></div><div class="pad"></div></div>';
  if(q.t==="sa"){
    const el=document.getElementById("sain"), bt=document.getElementById("sabt");
    bt.onclick=function(){pick(el.value)};
    el.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();pick(el.value)}});
    setTimeout(function(){el.focus({preventScroll:true})},60);
  }
  scrollTop();
}
function pick(v){
  const q=Q.list[Q.i];
  if(!q||q._done)return;
  let ok=false,shown="";
  if(q.t==="mc"){ok=(v===q.a);shown=q.c[q.a]}
  else if(q.t==="ox"){ok=(v===q.a);shown=q.a?"O":"X"}
  else{
    const val=String(v==null?"":v).trim();
    if(!val)q._blank=true;
    ok=val?q.a.some(function(a){return norm(a)===norm(val)}):false;
    shown=q.a[0];
  }
  q._done=true;
  if(ok){Q.ok++;Q.got.push(q.q)}
  else if(!S.wrong.some(w=>w.q===q.q)){
    const cp=Object.assign({},q);delete cp._done;S.wrong.push(cp);
  }
  const opts=document.getElementById("opts");
  opts.querySelectorAll(".op").forEach(function(b){
    b.onclick=null;
    const i=b.dataset.i;
    const isA=q.t==="ox"?(q.a?i==="1":i==="0"):(parseInt(i,10)===q.a);
    if(isA)b.classList.add("ok");
    else if((q.t==="ox"&&(v?i==="1":i==="0"))||(q.t==="mc"&&parseInt(i,10)===v))b.classList.add("no");
    else b.classList.add("dm");
  });
  if(q.t==="sa"){
    const el=document.getElementById("sain");if(el)el.disabled=true;
    const bt=document.getElementById("sabt");if(bt)bt.remove();
  }
  const last=(Q.i+1>=Q.list.length);
  const inRev=S.star.some(function(x){return x.q===q.q});
  const hd=ok?"정답입니다":(q._blank?"정답을 확인하세요":"다시 확인하세요");
  document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+
    '<span class="h">'+hd+'</span>'+
    (ok?"":'<div class="an"><span>정답 · </span>'+esc(shown)+'</div>')+
    '<div>'+esc(q.e||"")+'</div></div>'+
    '<div style="height:13px"></div>'+
    '<div class="br"><button class="bt o rev'+(inRev?" on":"")+'" onclick="markRev()">'+
      '<svg viewBox="0 0 24 24"><path d="M3 3v6h6"/><path d="M3.5 13a9 9 0 106-8.5L3 9"/></svg>'+
      (inRev?"복습에 있음":"복습")+'</button>'+
    '<button class="bt p" onclick="next()">'+(last?"결과 보기":"확인")+'</button></div>';
  save();
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function markRev(){
  const q=Q.list[Q.i];
  if(!S.star.some(function(x){return x.q===q.q})){
    const cp=Object.assign({},q);delete cp._done;delete cp._blank;
    S.star.push(cp);save();toast("복습 문제에 담았습니다");
  }else toast("이미 복습 문제에 있습니다");
  next();
}
function next(){Q.i++;step()}

addEventListener("keydown",function(e){
  if(location.hash!=="#/run")return;
  const q=Q.list[Q.i];if(!q)return;
  if((e.target.tagName||"").toLowerCase()==="input")return;
  if(q._done){if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}return}
  if(q.t==="mc"&&/^[1-5]$/.test(e.key)){const i=parseInt(e.key,10)-1;if(i<q.c.length)pick(i)}
  if(q.t==="ox"){const k=e.key.toLowerCase();if(k==="o")pick(true);if(k==="x")pick(false)}
});

function result(){
  const sc=Math.round(Q.ok/Q.list.length*100);
  if(Q.mode==="ch"&&Q.ch){
    S.sc[Q.ch]=Math.max(S.sc[Q.ch]||0,sc);
    if(sc===100)S.wrong=S.wrong.filter(w=>w.ch!==Q.ch);
  }
  if(Q.got.length)S.wrong=S.wrong.filter(w=>Q.got.indexOf(w.q)<0);
  save();
  head("채점 결과","결과");
  const msg=sc>=80?"이 회차는 완료 기준을 넘었습니다.":sc>=60?"조금만 더 하면 완료입니다.":"정리본을 한 번 더 읽어 보세요.";
  const back=(Q.mode==="ch"&&Q.ch)?("part/"+partOf(Q.ch).p):"";
  const bl=(Q.mode==="ch")?"강 목록":"홈으로";
  vw.innerHTML='<div class="fade">'+
   '<div class="rs"><div class="rs-n">'+sc+'<i>점</i></div>'+
   '<div class="rs-t">'+Q.list.length+'문항 중 '+Q.ok+'문항 정답</div>'+
   '<div class="rs-s">'+msg+'</div></div><div class="pad"></div>'+
   '<div class="br"><button class="bt o" onclick="retry()">다시 풀기</button>'+
   '<button class="bt p" onclick="go(\''+back+'\')">'+bl+'</button></div>'+
   (S.wrong.length?'<div class="gap"></div><button class="bt q" onclick="go(\'wrong\')">오답 노트 ('+S.wrong.length+'문항)</button>':"")+
   '<div class="pad"></div></div>';
  scrollTop();
}
function retry(){
  Q.list.forEach(function(q){delete q._done});
  if(S.shuf)Q.list=shuffle(Q.list);
  Q.i=0;Q.ok=0;Q.got=[];step();
}

async function examGo(){
  vw.innerHTML='<div class="emp"><p>문제를 뽑는 중…</p></div>';
  const ds=await allParts();
  const pool=[];
  ds.forEach(function(d){
    if(!d)return;
    if(EX.p&&d.part!==EX.p)return;
    d.chapters.forEach(function(c){
      c.questions.forEach(function(q){pool.push(Object.assign({},q,{ch:c.no,cht:c.title}))});

  if(!pool.length){toast("문제를 불러오지 못했습니다");examV();return}
  const list=shuffle(pool).slice(0,Math.min(EX.n,pool.length));

    vw.innerHTML='<div class="emp fade"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><p>'+emptyMsg+'</p></div>';

  }
  const by={};

function runGroup(mode,ch){

  startList(list,ch?(pad2(ch)+"강 "+nm+" 다시 풀기"):(nm+" 전체"),mode);
}

    const box=document.getElementById("sr");
    if(!box)return;
    if(k.length<1){box.innerHTML='<div class="emp"><p>찾고 싶은 낱말을 입력해 보세요.</p></div>';return}
    const nk=norm(k);
    if(!nk){box.innerHTML='<div class="emp"><p>찾고 싶은 낱말을 입력해 보세요.</p></div>';return}
    const hit=[];
    idx.forEach(function(x){
      const inT=norm(x.t).indexOf(nk)>=0, inB=norm(x.body).indexOf(nk)>=0;
      if(inT||inB)hit.push({ch:x.ch,t:x.t,w:inT?2:1});
    });
    hit.sort(function(a,b){return b.w-a.w||a.ch-b.ch});
    if(!hit.length){box.innerHTML='<div class="emp"><p>“'+esc(k)+'”에 해당하는 강을 찾지 못했습니다.</p></div>';return}
    const re=new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    box.innerHTML='<div class="lb">'+hit.length+'개 강에서 찾았습니다</div><div class="lst">'+
      hit.map(function(x){
        const tt=esc(x.t).replace(re,function(m){return "<em>"+m+"</em>"});
        return '<button class="row" onclick="go(\'quiz/'+x.ch+'\')">'+
         '<span class="row-n">'+pad2(x.ch)+'</span><span class="row-t">'+tt+'</span>'+
         '<span class="s-n">'+(x.w===2?"제목":"내용")+'</span></button>';
      }).join("")+'</div>';
  }
}

/* ============ 설정 ============ */
function setV(){
  head("설정","");
  const fsL=[[0.92,"작게"],[1,"보통"],[1.14,"크게"],[1.3,"아주 크게"]];
  const nqL=[[0,"전체"],[10,"10문항"],[15,"15문항"]];
  vw.innerHTML='<div class="fade">'+
   '<div class="lb">보기</div><div class="lst">'+
     '<div class="st-row"><div class="st-l"><b>글자 크기</b><span>화면 전체에 바로 적용됩니다</span></div></div>'+
     '<div class="st-row tight"><div class="seg">'+
       fsL.map(function(x){return '<button class="'+(S.fs==x[0]?"on":"")+'" onclick="setFs('+x[0]+')">'+x[1]+'</button>'}).join("")+
     '</div></div>'+
     '<div class="st-row"><div class="st-l"><b>어두운 화면</b><span>밤에 눈이 편합니다</span></div>'+
       '<button class="sw '+(S.theme==="dark"?"on":"")+'" onclick="setTheme()" aria-label="어두운 화면"><i></i></button></div>'+
   '</div>'+
   '<div class="lb">문제 풀이</div><div class="lst">'+
     '<div class="st-row"><div class="st-l"><b>문항 순서 섞기</b><span>같은 강을 다시 풀어도 순서가 바뀝니다</span></div>'+
       '<button class="sw '+(S.shuf?"on":"")+'" onclick="setShuf()" aria-label="문항 순서 섞기"><i></i></button></div>'+
     '<div class="st-row"><div class="st-l"><b>한 회차 문항 수</b><span>강마다 10~15문항이 들어 있습니다</span></div></div>'+
     '<div class="st-row tight"><div class="seg">'+
       nqL.map(function(x){return '<button class="'+(S.nq==x[0]?"on":"")+'" onclick="setNq('+x[0]+')">'+x[1]+'</button>'}).join("")+
     '</div></div>'+
   '</div>'+
   '<div class="lb">학습 기록</div><div class="lst">'+
     '<div class="st-row"><div class="st-l"><b>기록 내보내기</b><span>휴대폰을 바꾸기 전에 저장해 두세요</span></div>'+
       '<button class="bt q sm" onclick="expJSON()">저장</button></div>'+
     '<div class="st-row"><div class="st-l"><b>기록 불러오기</b><span>내보낸 파일을 골라 되돌립니다</span></div>'+
       '<button class="bt q sm" onclick="document.getElementById(\'imf\').click()">불러오기</button></div>'+
     '<div class="st-row"><div class="st-l"><b>모두 지우기</b><span>점수·오답·복습 문제가 사라집니다</span></div>'+
       '<button class="bt q sm danger" onclick="resetAll()">초기화</button></div>'+
   '</div>'+
   '<input type="file" id="imf" accept="application/json,.json" hidden>'+
   '<div class="pad"></div>'+
   '<p class="note">학습 기록은 이 휴대폰 안에만 저장됩니다.<br>서버로 보내지 않으니 안심하셔도 됩니다.</p>'+
   '<div class="pad"></div></div>';
  document.getElementById("imf").onchange=function(){impJSON(this)};
  scrollTop();
}
function setFs(v){S.fs=v;save();applyPrefs();setV();toast("글자 크기를 바꿨습니다")}
function setTheme(){S.theme=(S.theme==="dark"?"light":"dark");save();applyPrefs();setV()}
function setShuf(){S.shuf=!S.shuf;save();setV()}
function setNq(v){S.nq=v;save();setV()}
function expJSON(){
  try{
    const b=new Blob([JSON.stringify(S)],{type:"application/json"});
    const u=URL.createObjectURL(b);
    const a=document.createElement("a");
    a.href=u;a.download="건강과안전_학습기록_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},1500);
    toast("학습 기록을 내려받았습니다");
  }catch(e){toast("내보내기에 실패했습니다")}
}
function impJSON(el){
  const f=el.files&&el.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const o=JSON.parse(r.result);
      if(!o||typeof o!=="object"||!("sc" in o))throw new Error();
      S=Object.assign(dft(),o);save();applyPrefs();setV();
      toast("학습 기록을 되돌렸습니다");
    }catch(e){toast("올바른 기록 파일이 아닙니다")}
    el.value="";
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm("학습 기록을 모두 지울까요? 되돌릴 수 없습니다."))return;
  const fs=S.fs, th=S.theme;
  S=dft();S.fs=fs;S.theme=th;save();setV();toast("기록을 지웠습니다");
}

/* ============ 시작 ============ */
route();
</script>
